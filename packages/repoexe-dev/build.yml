name: repoexe-dev
version: "1.0.0"
description: Opt-in package for the RepoExe dev component
homepage: https://github.com/SjnExe/RepoExe
license: MIT
maintainer: "@SjnExe"
source: local
platform_independent: true

phases:
  install: |
    mkdir -p $DESTDIR$PREFIX/etc/apt/sources.list.d
    echo "deb https://SjnExe.github.io/RepoExe stable dev" > repoexe-dev.list
    install -Dm644 repoexe-dev.list $DESTDIR$PREFIX/etc/apt/sources.list.d/repoexe-dev.list
