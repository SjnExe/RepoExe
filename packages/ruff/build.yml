name: ruff
version: "0.16.0"
revision: 0
architecture: aarch64
description: Fast Python linter and code formatter written in Rust
license: MIT
homepage: https://github.com/astral-sh/ruff
maintainer: SjnExe

auto_update: true
update_strategy: github_release
source_url: https://github.com/astral-sh/ruff/releases/download/0.9.0/ruff-aarch64-unknown-linux-musl.tar.gz

build_system: custom
phases:
  install: |
    install -Dm755 ruff "${DESTDIR}${PREFIX}/bin/ruff"
