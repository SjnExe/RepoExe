name: pydantic
version: 2.10.6
revision: 0
architecture: aarch64
description: Data validation using Python type hints
license: MIT
homepage: https://github.com/pydantic/pydantic
maintainer: SjnExe

auto_update: true
update_strategy: pypi
source_url: https://files.pythonhosted.org/packages/source/p/pydantic/pydantic-2.10.6.tar.gz

build_system: custom
phases:
  make: |
    python3 -m pip install --target="${DESTDIR}${PREFIX}/lib/python3.11/site-packages" . --no-deps || true
  install: |
    echo "Installed pydantic site-packages"
