name: protobuf
vars:
  version: "34.1"
version: "2:{version}"
revision: 1
description: Protocol buffers C++ library
homepage: https://github.com/protocolbuffers/protobuf
license: custom:BSD 3-Clause, MIT

host:
  url: https://github.com/protocolbuffers/protobuf/releases/download/v{version}/protoc-{version}-linux-x86_64.zip
  sha256: af27ea66cd26938fe48587804ca7d4817457a08350021a1c6e23a27ccc8c6904

source:
  - url: https://github.com/protocolbuffers/protobuf/archive/refs/tags/v{version}.tar.gz
    sha256: 0c98bb704ceb4e68c92f93907951ca3c36130bc73f87264e8c0771a80362ac97

depends:
  termux-main:
    - abseil-cpp
    - libc++
    - zlib

cmake_args:
  - "-Dprotobuf_ABSL_PROVIDER=package"
  - "-Dprotobuf_BUILD_TESTS=OFF"
  - "-DBUILD_SHARED_LIBS=ON"
  - "-DCMAKE_INSTALL_LIBDIR=lib"

static: false

subpackages:
  libprotoc:
    description: "Compiler for protocol buffer definition files"
    includes:
      - "bin/"
      - "lib/libprotobuf-lite.so*"
      - "lib/libprotoc.so*"
      - "lib/pkgconfig/protobuf-lite.pc"
