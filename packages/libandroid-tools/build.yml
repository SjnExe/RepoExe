name: libandroid-tools
version: 16.0.0-r4
description: Shared libraries for Android tools (aapt2, zipalign, aidl)
homepage: https://android.googlesource.com/platform/system/core
license: Apache-2.0
maintainer: "@SjnExe"

# Multiple git repositories are historically used for libandroid-tools.
# We map the legacy source URLs and logic to the new `build_in_src: true` setup.
# We'll use the 'phases' hook to define the complex clone step directly, bypassing a single 'source' string.
# (This is supported by RepoExe's hybrid capabilities for complex packages).
source: git
git_branch: android-16.0.0_r4
build_in_src: true

depends:
  - fmt
  - libc++
  - libexpat
  - libpng
  - libzopfli
  - zlib

subpackages:
  libbase:
    description: "Android base library"
    includes: ["lib/libandroid-base.so"]
    depends: ["fmt"]
  libcutils:
    description: "Android cutils library"
    includes: ["lib/libandroid-cutils.so"]
    depends: ["libbase"]
  libutils:
    description: "Android utils library"
    includes: ["lib/libandroid-utils.so"]
    depends: ["libbase", "libcutils"]
  libziparchive:
    description: "Android ziparchive library"
    includes: ["lib/libandroid-ziparchive.so"]
    depends: ["libbase", "zlib"]
  libandroidfw:
    description: "Android fw library"
    includes: ["lib/libandroid-fw.so"]
    depends: ["libbase", "libcutils", "libutils", "libziparchive", "zlib"]
  libandroid-pathutils:
    description: "Android pathutils library"
    includes: ["lib/libandroid-pathutils.so"]
    depends: ["libbase", "libcutils", "libutils", "libziparchive", "libandroidfw", "zlib"]
  liblog:
    description: "Android log library headers (mocked via liblog)"
    includes: ["include/android/log.h"]

phases:
  pre_fetch: |
    # Emulate the legacy step_post_get_source logic
    PKG_SRCURL=(
      "https://android.googlesource.com/platform/frameworks/base"
      "https://android.googlesource.com/platform/system/core"
      "https://android.googlesource.com/platform/system/libbase"
      "https://android.googlesource.com/platform/system/libziparchive"
      "https://android.googlesource.com/platform/system/logging"
      "https://android.googlesource.com/platform/system/incremental_delivery"
    )

    for i in $(seq 0 $(( ${#PKG_SRCURL[@]}-1 ))); do
      REPO_URL=${PKG_SRCURL[$i]}
      CLONE_DIR=$(basename "$REPO_URL" .git | sed -e 's/platform_system_tools_//' -e 's/platform_system_//' -e 's/platform_frameworks_//' -e 's/platform_//')

      git clone --depth 1 --single-branch \
        --branch "android-16.0.0_r4" \
        "$REPO_URL" "$CLONE_DIR"
    done

  pre_configure: |
    export PATH=$PREFIX/bin:$PATH

    CFLAGS+=" -fPIC"
    CXXFLAGS+=" -Wno-c99-designator  -fPIC -std=c++20"
    CPPFLAGS+=" -DNDEBUG -D__ANDROID_SDK_VERSION__=__ANDROID_API__"

    _TMP_LIBDIR=./_lib
    rm -rf $_TMP_LIBDIR
    mkdir -p $_TMP_LIBDIR

    LDFLAGS+=" -L$PREFIX/lib -llog -L$_TMP_LIBDIR"

  make: |
    # Embed the legacy sources.sh logic directly
    libcutils_sockets_nonwindows_sources="socket_inaddr_any_server_unix.cpp socket_local_client_unix.cpp socket_local_server_unix.cpp socket_network_client_unix.cpp sockets_unix.cpp"
    libcutils_sockets_sources="$libcutils_sockets_nonwindows_sources sockets.cpp"
    libcutils_nonwindows_sources="fs.cpp hashmap.cpp multiuser.cpp str_parms.cpp ashmem-host.cpp canned_fs_config.cpp fs_config.cpp trace-host.cpp"
    libcutils_sources="$libcutils_sockets_sources $libcutils_nonwindows_sources config_utils.cpp iosched_policy.cpp load_file.cpp native_handle.cpp properties.cpp record_stream.cpp strlcpy.c"

    libutils_sources="binder/Errors.cpp FileMap.cpp JenkinsHash.cpp LightRefBase.cpp NativeHandle.cpp Printer.cpp binder/RefBase.cpp binder/SharedBuffer.cpp StopWatch.cpp binder/String8.cpp binder/String16.cpp binder/StrongPointer.cpp SystemClock.cpp Threads.cpp Timers.cpp Tokenizer.cpp binder/Unicode.cpp binder/VectorImpl.cpp misc.cpp"

    libbase_linux_sources="errors_unix.cpp"
    libbase_sources="$libbase_linux_sources chrono_utils.cpp cmsg.cpp file.cpp hex.cpp logging.cpp mapped_file.cpp parsebool.cpp parsenetaddress.cpp posix_strerror_r.cpp process.cpp properties.cpp stringprintf.cpp strings.cpp threads.cpp test_utils.cpp"

    libziparchive_sources="zip_archive.cc zip_archive_stream_entry.cc zip_cd_entry_map.cc zip_error.cpp zip_writer.cc incfs_support/signal_handling.cpp"

    androidfw_sources="ApkAssets.cpp Asset.cpp AssetDir.cpp AssetManager.cpp AssetManager2.cpp AssetsProvider.cpp AttributeResolution.cpp ChunkIterator.cpp ConfigDescription.cpp Idmap.cpp LoadedArsc.cpp Locale.cpp LocaleData.cpp misc.cpp ObbFile.cpp PosixUtils.cpp ResourceTypes.cpp ResourceUtils.cpp StreamingZipInflater.cpp TypeWrappers.cpp Util.cpp ZipFileRO.cpp ZipUtils.cpp"

    CORE_INCDIR=./core/include
    LIBLOG_INCDIR=./logging/liblog/include
    LIBBASE_SRCDIR=./libbase
    LIBCUTILS_SRCDIR=./core/libcutils
    LIBUTILS_SRCDIR=./core/libutils
    INCFS_SUPPORT_INCDIR=./libziparchive/incfs_support/include
    LIBZIPARCHIVE_SRCDIR=./libziparchive
    INCFS_UTIL_SRCDIR=./incremental_delivery/incfs/util
    ANDROIDFW_SRCDIR=./base/libs/androidfw

    CPPFLAGS+=" -I. -I./include -I../include -I$LIBBASE_SRCDIR/include -I$LIBLOG_INCDIR -I$CORE_INCDIR"

    # Build libbase
    cd $LIBBASE_SRCDIR
    for f in $libbase_sources; do
      $CXX $CXXFLAGS $CPPFLAGS $f -c
    done
    $CXX $CXXFLAGS *.o -shared $LDFLAGS -lfmt -o ../_lib/libandroid-base.so
    cd ..

    # Build libcutils
    cd $LIBCUTILS_SRCDIR
    for f in $libcutils_sources; do
      $CXX $CXXFLAGS $CPPFLAGS $f -c
    done
    $CXX $CXXFLAGS *.o -shared $LDFLAGS -landroid-base -o ../../_lib/libandroid-cutils.so
    cd ../..

    # Build libutils
    cd $LIBUTILS_SRCDIR
    for f in $libutils_sources; do
      $CXX $CXXFLAGS $CPPFLAGS $f -c
    done
    $CXX $CXXFLAGS *.o -shared $LDFLAGS -landroid-base -landroid-cutils -o ../../_lib/libandroid-utils.so
    cd ../..

    # Build libziparchive
    cd $LIBZIPARCHIVE_SRCDIR
    for f in $libziparchive_sources; do
      $CXX $CXXFLAGS $CPPFLAGS -I$INCFS_SUPPORT_INCDIR $f -c
    done
    $CXX $CXXFLAGS *.o -shared $LDFLAGS -landroid-base -lz -o ../_lib/libandroid-ziparchive.so
    cd ..

    CPPFLAGS+=" -I$LIBZIPARCHIVE_SRCDIR/include -I$INCFS_UTIL_SRCDIR/include -I$ANDROIDFW_SRCDIR/include_pathutils"

    # Build libandroidfw
    cd $ANDROIDFW_SRCDIR
    for f in $androidfw_sources ../../../../$INCFS_UTIL_SRCDIR/map_ptr.cpp; do
      $CXX $CXXFLAGS $CPPFLAGS $f -c
    done
    $CXX $CXXFLAGS *.o -shared $LDFLAGS -landroid-base -landroid-cutils -landroid-utils -landroid-ziparchive -lz -o ../../../_lib/libandroid-fw.so
    cd ../../..

    # Build libandroid-pathutils
    cd $ANDROIDFW_SRCDIR
    for f in PathUtils.cpp; do
      $CXX $CXXFLAGS $CPPFLAGS $f -c
    done
    $CXX $CXXFLAGS PathUtils.o -shared $LDFLAGS -landroid-base -landroid-cutils -landroid-utils -landroid-ziparchive -landroid-fw -lz -o ../../../_lib/libandroid-pathutils.so
    cd ../../..

  install: |
    install -Dm644 -t $PREFIX/lib ./_lib/libandroid-{cutils,utils,base,ziparchive,fw,pathutils}.so

    mkdir -p $PREFIX/include/android-tools
    cp -r ./core/include/* $PREFIX/include/android-tools/
    cp -r ./logging/liblog/include/* $PREFIX/include/android-tools/
    cp -r ./libbase/include/* $PREFIX/include/android-tools/
    cp -r ./libziparchive/incfs_support/include/* $PREFIX/include/android-tools/
    cp -r ./libziparchive/include/* $PREFIX/include/android-tools/
    cp -r ./incremental_delivery/incfs/util/include/* $PREFIX/include/android-tools/
    cp -r ./base/libs/androidfw/include/* $PREFIX/include/android-tools/
    cp -r ./base/libs/androidfw/include_pathutils/* $PREFIX/include/android-tools/
