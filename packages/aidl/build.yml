name: aidl
version: "{tag_version}-{revision}"
vars:
  tag_version: 16.0.0_r4
revision: 4
description: Android Interface Definition Language (AIDL)
homepage: https://developer.android.com/guide/components/aidl
license: Apache-2.0
maintainer: "@SjnExe"

source: git
git_branch: android-{tag_version}
build_in_src: true

depends:
  termux-main:
    - fmt
    - libc++
  local:
    - libbase

phases:
  pre_fetch: |
    PKG_SRCURL=(
      "https://android.googlesource.com/platform/system/tools/aidl"
      "https://android.googlesource.com/platform/system/core"
      "https://android.googlesource.com/platform/system/libbase"
    )

    for i in $(seq 0 $(( ${#PKG_SRCURL[@]}-1 ))); do
      REPO_URL=${PKG_SRCURL[$i]}
      CLONE_DIR=$(basename "$REPO_URL" .git | sed -e 's/platform_system_tools_//' -e 's/platform_system_//' -e 's/platform_//')

      git clone --depth 1 --single-branch \
        --branch "android-{tag_version}" \
        "$REPO_URL" "$CLONE_DIR"
    done

  pre_configure: |
    export PATH=$PREFIX/bin:$PATH

    CFLAGS+=" -fPIC"
    CXXFLAGS+=" -fPIC -std=c++17"
    CPPFLAGS+=" -DNDEBUG -D__ANDROID_SDK_VERSION__=__ANDROID_API__"

    _TMP_BINDIR=./_bin
    rm -rf $_TMP_BINDIR
    mkdir -p $_TMP_BINDIR

    LDFLAGS+=" -L$PREFIX/lib -llog -landroid-base -lfmt"

  make: |
    # Embedded aidl_sources logic
    libaidl_sources="aidl_checkapi.cpp aidl_const_expressions.cpp aidl_dumpapi.cpp aidl_language.cpp aidl_to_cpp_common.cpp aidl_to_cpp.cpp aidl_to_java.cpp aidl_to_ndk.cpp aidl_to_rust.cpp aidl_typenames.cpp aidl.cpp ast_java.cpp check_valid.cpp code_writer.cpp comments.cpp diagnostics.cpp generate_aidl_mappings.cpp generate_cpp.cpp generate_java_binder.cpp generate_java.cpp generate_ndk.cpp generate_rust.cpp import_resolver.cpp io_delegate.cpp location.cpp logging.cpp options.cpp parser.cpp permission.cpp preprocess.cpp lex.yy.c aidl_language_y.tab.cc"
    aidl_sources="$libaidl_sources main.cpp"

    LIBBASE_SRCDIR=./libbase
    CORE_INCDIR=./core/include
    AIDL_SRCDIR=./aidl

    CPPFLAGS+=" -I. -I./include -I../$LIBBASE_SRCDIR/include -I../$CORE_INCDIR"

    cd $AIDL_SRCDIR
    flex aidl_language_l.ll
    bison --header=aidl_language_y.h aidl_language_y.yy
    cat >> aidl_language_y.h <<-END
    typedef union yy::parser::value_type YYSTYPE;
    typedef yy::parser::location_type YYLTYPE;
    END

    for f in $aidl_sources; do
      $CXX $CXXFLAGS $CPPFLAGS $f -c
    done
    $CXX $CXXFLAGS *.o $LDFLAGS -lfmt -o ../_bin/aidl
    cd ..

  install: |
    install -Dm700 -t $PREFIX/bin ./_bin/aidl
