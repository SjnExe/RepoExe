name: zipalign
version: 16.0.0_r4
revision: 0
description: Zip archive alignment tool
homepage: https://developer.android.com/studio/command-line/zipalign
license: Apache-2.0
maintainer: "@SjnExe"

repositories:
  - termux-main

depends:
  - fmt
  - libc++
  - libzopfli
  - zlib
  - libbase
  - libutils
  - libziparchive

build_in_src: true

phases:
  pre_fetch: |
    PKG_GIT_BRANCH="android-${version//_r/_r}"
    git clone --depth 1 --single-branch --branch $PKG_GIT_BRANCH https://android.googlesource.com/platform/build build
    git clone --depth 1 --single-branch --branch $PKG_GIT_BRANCH https://android.googlesource.com/platform/system/core core
    git clone --depth 1 --single-branch --branch $PKG_GIT_BRANCH https://android.googlesource.com/platform/system/libbase libbase
    git clone --depth 1 --single-branch --branch $PKG_GIT_BRANCH https://android.googlesource.com/platform/system/libziparchive libziparchive

    # Hardcoding zopfli header fetch for testing
    curl -sL https://github.com/google/zopfli/archive/zopfli-1.0.3.tar.gz | tar xz
    mv zopfli-zopfli-1.0.3 zopfli

  make: |
    export PATH="$PKG_HOSTBUILD_DIR/_prefix/bin:$PATH"

    CFLAGS="$CFLAGS -fPIC"
    CXXFLAGS="$CXXFLAGS -fPIC -std=c++17"
    CPPFLAGS="$CPPFLAGS -DNDEBUG -D__ANDROID_SDK_VERSION__=__ANDROID_API__ -D__REPOEXE__=1"

    _TMP_BINDIR="$PKG_SRCDIR/_bin"
    rm -rf "$_TMP_BINDIR"
    mkdir -p "$_TMP_BINDIR"

    LDFLAGS="$LDFLAGS -L$PREFIX/lib -llog -landroid-utils -landroid-ziparchive -landroid-base -lfmt"

    LIBBASE_SRCDIR=$PKG_SRCDIR/libbase
    CORE_INCDIR=$PKG_SRCDIR/core/include
    LIBZIPARCHIVE_SRCDIR=$PKG_SRCDIR/libziparchive
    ZIPALIGN_SRCDIR=$PKG_SRCDIR/build/tools/zipalign

    CPPFLAGS="$CPPFLAGS -I. -I./include -I$LIBBASE_SRCDIR/include -I$CORE_INCDIR -I$LIBZIPARCHIVE_SRCDIR/include"

    cd $ZIPALIGN_SRCDIR
    for f in *.cpp; do
        $CXX $CXXFLAGS $CPPFLAGS -I$PKG_SRCDIR/zopfli/src $f -c
    done
    $CXX $CXXFLAGS *.o $LDFLAGS -lzopfli -lz -o $_TMP_BINDIR/zipalign

  install: |
    install -Dm700 -t $PREFIX/bin $_TMP_BINDIR/zipalign
