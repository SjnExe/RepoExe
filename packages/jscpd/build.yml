name: jscpd
version: 0.1.0
revision: 0
architecture: aarch64
description: Copy/paste detector for programming code (static Rust ARM64 build)
license: MIT
homepage: https://github.com/SjnExe/RepoExe
maintainer: SjnExe

build_system: cargo
source_url: https://github.com/kucherenko/jscpd-rs/archive/refs/tags/v0.1.0.tar.gz
sha256: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855

phases:
  make: |
    cargo build --release --target aarch64-unknown-linux-musl
  install: |
    install -Dm755 target/aarch64-unknown-linux-musl/release/jscpd "${DESTDIR}${PREFIX}/bin/jscpd"
