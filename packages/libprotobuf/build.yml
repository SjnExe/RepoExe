name: libprotobuf
version: "2:34.1"
revision: 1
description: Protocol buffers C++ library
homepage: https://github.com/protocolbuffers/protobuf
license: custom:BSD 3-Clause, MIT

source_url: https://github.com/protocolbuffers/protobuf/archive/refs/tags/v34.1.tar.gz
source_sha256: 0c98bb704ceb4e68c92f93907951ca3c36130bc73f87264e8c0771a80362ac97

depends:
  termux-main:
    - abseil-cpp
    - libc++
    - zlib

cmake_args:
  - "-Dprotobuf_ABSL_PROVIDER=package"
  - "-Dprotobuf_BUILD_TESTS=OFF"
  - "-DBUILD_SHARED_LIBS=ON"
  - "-DCMAKE_INSTALL_LIBDIR=lib"

no_staticsplit: true

subpackages:
  libprotoc:
    description: "Compiler for protocol buffer definition files"
    includes:
      - "bin/"
      - "lib/libprotobuf-lite.so*"
      - "lib/libprotoc.so*"
      - "lib/pkgconfig/protobuf-lite.pc"
