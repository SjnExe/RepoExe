name: tsc
version: 0.1.0
revision: 9
architecture: aarch64
description: Fast TypeScript compiler written in Go with Seccomp sandbox patches
license: Apache-2.0
homepage: https://github.com/SjnExe/RepoExe
maintainer: SjnExe

build_system: go
source_url: https://github.com/microsoft/typescript-go/archive/refs/heads/main.tar.gz

vars:
  GOOS: "android"
  GOARCH: "arm64"
  CGO_ENABLED: "0"

phases:
  make: |
    echo "Cleaning go.mod and building tsgo..."
    python3 -c '
    import re
    with open("go.mod", "r") as f:
        content = f.read()
    content = re.sub(r"(?s)\b(tool|ignore)\s*\(.*?\)", "", content)
    with open("go.mod", "w") as f:
        f.write(content)
    '
    go mod edit -go=1.26
    go build -ldflags="-s -w" -o tsc ./cmd/tsgo || go build -ldflags="-s -w" -o tsc .
  install: |
    install -Dm755 tsc "${DESTDIR}${PREFIX}/bin/tsc"
