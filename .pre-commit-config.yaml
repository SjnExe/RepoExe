repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run ruff check --fix scripts/
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest
        name: pytest suite
        entry: uv run pytest scripts/tests/
        language: system
        types: [python]
        pass_filenames: false
