repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: ruff check --fix
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest
        name: pytest suite
        entry: env PYTHONPATH=scripts python3 -m pytest scripts/tests/
        language: system
        types: [python]
        pass_filenames: false

      - id: actionlint
        name: actionlint workflow check
        entry: uvx actionlint
        language: system
        files: ^\.github/workflows/
