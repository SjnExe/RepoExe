name: repoexe
version: "2.0.0"
arch: all
description: Central RepoExe package repository management CLI and native interceptor
license: MIT
homepage: https://github.com/SjnExe/RepoExe
maintainer: SjnExe
build_system: custom
formats:
  - apt
  - pacman
  - apk

phases:
  install: |
    mkdir -p "${DESTDIR}${PREFIX}/bin" "${DESTDIR}${PREFIX}/lib"
    cp "../../scripts/site/install" "${DESTDIR}${PREFIX}/bin/repoexe"
    chmod +x "${DESTDIR}${PREFIX}/bin/repoexe"
    if [ -f files/librepoexe_override.c ]; then
      COMPILER="${CC:-clang}"
      if [ -z "$COMPILER" ] || ! command -v "$COMPILER" >/dev/null 2>&1; then
        COMPILER=$(find "${NDK:-/opt/android-ndk}" -type f -name "aarch64-linux-android*-clang" 2>/dev/null | head -n 1)
      fi
      if [ -z "$COMPILER" ]; then
        COMPILER="gcc"
      fi
      $COMPILER -shared -fPIC -O2 files/librepoexe_override.c -o "${DESTDIR}${PREFIX}/lib/librepoexe_override.so" -ldl 2>/dev/null || true
    fi
  test: |
    repoexe --version
