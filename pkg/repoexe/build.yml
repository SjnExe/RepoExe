name: repoexe
version: "1.1.2"
revision: 0
arch: all
desc: Central RepoExe package repository management CLI
license: MIT
homepage: https://github.com/SjnExe/RepoExe
maintainer: SjnExe
build_system: custom
formats:
  - apt
  - pacman
  - apk

phases:
  install: |
    mkdir -p "${DESTDIR}${PREFIX}/bin"
    cp "../../site/install" "${DESTDIR}${PREFIX}/bin/repoexe"
    chmod +x "${DESTDIR}${PREFIX}/bin/repoexe"
  test: |
    repoexe --version
