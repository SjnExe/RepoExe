name: repoexe
version: "1.1.1"
revision: 0
arch: aarch64
desc: Central RepoExe repository management CLI and security keyrings
license: MIT
homepage: https://github.com/SjnExe/RepoExe
maintainer: SjnExe
build_system: custom
formats:
  - apt
  - pacman
  - apk

phases:
  install: |
    mkdir -p "${DESTDIR}${PREFIX}/bin"
    mkdir -p "${DESTDIR}${PREFIX}/etc/apt/trusted.gpg.d"
    mkdir -p "${DESTDIR}${PREFIX}/etc/apk/keys"
    mkdir -p "${DESTDIR}${PREFIX}/share/bash-completion/completions"
    mkdir -p "${DESTDIR}${PREFIX}/share/zsh/site-functions"

    # Install central repoexe CLI helper
    cat << 'CLIEOF' > "${DESTDIR}${PREFIX}/bin/repoexe"
    #!/bin/sh
    set -e

    PREFIX="${PREFIX:-/data/data/com.termux/files/usr}"
    REPO_URL="https://sjnexe.github.io/RepoExe"
    WORKER_NPM_URL="https://sjnexe.github.io/RepoExe/npm/"

    # Terminal Colors
    if [ -t 1 ]; then
      BOLD='\033[1m'
      GREEN='\033[0;32m'
      RED='\033[0;31m'
      YELLOW='\033[0;33m'
      CYAN='\033[0;36m'
      RESET='\033[0m'
    else
      BOLD=''
      GREEN=''
      RED=''
      YELLOW=''
      CYAN=''
      RESET=''
    fi

    show_help() {
      printf "${BOLD}RepoExe Repository Management CLI v1.1.1${RESET}\n\n"
      printf "${BOLD}USAGE:${RESET}\n"
      printf "  repoexe <command> [target|args]\n\n"
      printf "${BOLD}COMMANDS:${RESET}\n"
      printf "  ${CYAN}status, -s${RESET}          Check system repository integrations status\n"
      printf "  ${CYAN}sync, -y${RESET}            Re-sync all manager integrations from upstream\n"
      printf "  ${CYAN}list, ls, -l${RESET}        List all available packages in RepoExe store\n"
      printf "  ${CYAN}doctor${RESET}              Run diagnostic health checks on repository setup\n"
      printf "  ${CYAN}enable, -e <target>${RESET} Enable specific manager (${BOLD}apt|bun|npm|pip|all${RESET})\n"
      printf "  ${CYAN}disable, -d <target>${RESET}Disable specific manager (${BOLD}apt|bun|npm|pip|all${RESET})\n"
      printf "  ${CYAN}version, -v${RESET}         Print CLI version\n"
      printf "  ${CYAN}help, -h${RESET}            Show this help menu\n"
    }

    check_status() {
      printf "${BOLD}=== RepoExe System Status ===${RESET}\n"

      if [ -f "$PREFIX/etc/apt/sources.list.d/repoexe.list" ]; then
        printf "  APT (Termux):      [${GREEN}ENABLED${RESET}]\n"
      else
        printf "  APT (Termux):      [${RED}DISABLED${RESET}]\n"
      fi

      if grep -q "sjnexe.github.io" ~/.npmrc 2>/dev/null; then
        printf "  NPM Registry:      [${GREEN}ENABLED${RESET}]\n"
      else
        printf "  NPM Registry:      [${RED}DISABLED${RESET}]\n"
      fi

      if grep -q "sjnexe.github.io" ~/.bunfig.toml 2>/dev/null; then
        printf "  Bun Registry:      [${GREEN}ENABLED${RESET}]\n"
      else
        printf "  Bun Registry:      [${RED}DISABLED${RESET}]\n"
      fi

      if grep -q "sjnexe.github.io" ~/.config/pip/pip.conf 2>/dev/null; then
        printf "  Pip Index:         [${GREEN}ENABLED${RESET}]\n"
      else
        printf "  Pip Index:         [${RED}DISABLED${RESET}]\n"
      fi
    }

    list_packages() {
      printf "${BOLD}Fetching available packages from RepoExe...${RESET}\n\n"
      if command -v curl >/dev/null 2>&1; then
        curl -sL "$REPO_URL/packages.json" | grep -E '"name"|"version"|"description"' | sed 's/[",]//g' | paste - - - 2>/dev/null || true
      else
        printf "${RED}curl is required to list remote packages.${RESET}\n"
      fi
    }

    run_doctor() {
      printf "${BOLD}=== RepoExe Health Doctor ===${RESET}\n"
      
      if curl -sI "$REPO_URL/packages.json" | grep -q "200 OK"; then
        printf "  Network Reachability: [${GREEN}OK${RESET}]\n"
      else
        printf "  Network Reachability: [${RED}FAILED${RESET}]\n"
      fi

      if [ -f "$PREFIX/etc/apt/trusted.gpg.d/repoexe.asc" ]; then
        printf "  APT GPG Keyring:      [${GREEN}OK${RESET}]\n"
      else
        printf "  APT GPG Keyring:      [${RED}MISSING${RESET}]\n"
      fi

      if [ -f "$PREFIX/etc/apt/sources.list.d/repoexe.list" ]; then
        printf "  APT Source Config:    [${GREEN}OK${RESET}]\n"
      else
        printf "  APT Source Config:    [${RED}MISSING${RESET}]\n"
      fi
    }

    enable_manager() {
      case "$1" in
        apt)
          mkdir -p "$PREFIX/etc/apt/sources.list.d" "$PREFIX/etc/apt/trusted.gpg.d"
          echo "deb [signed-by=$PREFIX/etc/apt/trusted.gpg.d/repoexe.asc] $REPO_URL/apt stable main" > "$PREFIX/etc/apt/sources.list.d/repoexe.list"
          curl -sL "$REPO_URL/repoexe.gpg" -o "$PREFIX/etc/apt/trusted.gpg.d/repoexe.asc"
          printf "${GREEN}✓ Enabled APT repository.${RESET}\n"
          ;;
        bun)
          mkdir -p ~/.config
          echo "# Configured by RepoExe" > ~/.bunfig.toml
          echo "url = \"$WORKER_NPM_URL\"" >> ~/.bunfig.toml
          echo "" >> ~/.bunfig.toml
          echo "[install.scopes]" >> ~/.bunfig.toml
          echo "\"@repoexe\" = { url = \"$WORKER_NPM_URL\" }" >> ~/.bunfig.toml
          printf "${GREEN}✓ Enabled Bun global registry and @repoexe scope.${RESET}\n"
          ;;
        npm)
          npm config set registry "$WORKER_NPM_URL" 2>/dev/null || true
          npm config set @repoexe:registry "$WORKER_NPM_URL" 2>/dev/null || true
          printf "${GREEN}✓ Enabled NPM registry override.${RESET}\n"
          ;;
        pip)
          mkdir -p ~/.config/pip
          if ! grep -q "sjnexe.github.io" ~/.config/pip/pip.conf 2>/dev/null; then
            echo "[global]" >> ~/.config/pip/pip.conf
            echo "extra-index-url = $REPO_URL/pip/" >> ~/.config/pip/pip.conf
          fi
          printf "${GREEN}✓ Enabled Pip extra index.${RESET}\n"
          ;;
        all)
          enable_manager apt
          enable_manager bun
          enable_manager npm
          enable_manager pip
          ;;
        *)
          printf "${RED}Error: Unknown target '$1'. Options: apt, bun, npm, pip, all${RESET}\n"
          exit 1
          ;;
      esac
    }

    disable_manager() {
      case "$1" in
        apt)
          rm -f "$PREFIX/etc/apt/sources.list.d/repoexe.list"
          printf "${YELLOW}✓ Disabled APT repository.${RESET}\n"
          ;;
        bun)
          rm -f ~/.bunfig.toml
          printf "${YELLOW}✓ Disabled Bun registry override.${RESET}\n"
          ;;
        npm)
          npm config delete registry 2>/dev/null || true
          npm config delete @repoexe:registry 2>/dev/null || true
          printf "${YELLOW}✓ Disabled NPM registry override.${RESET}\n"
          ;;
        pip)
          if [ -f ~/.config/pip/pip.conf ]; then
            sed -i '/sjnexe.github.io/d' ~/.config/pip/pip.conf 2>/dev/null || true
          fi
          printf "${YELLOW}✓ Disabled Pip extra index.${RESET}\n"
          ;;
        all)
          disable_manager apt
          disable_manager bun
          disable_manager npm
          disable_manager pip
          ;;
        *)
          printf "${RED}Error: Unknown target '$1'. Options: apt, bun, npm, pip, all${RESET}\n"
          exit 1
          ;;
      esac
    }

    case "$1" in
      status|-s)
        check_status
        ;;
      sync|-y)
        printf "${CYAN}Syncing RepoExe environment settings...${RESET}\n"
        curl -sL "$REPO_URL/install" | sh -s -- --all
        ;;
      list|ls|-l)
        list_packages
        ;;
      doctor)
        run_doctor
        ;;
      enable|-e)
        if [ -z "$2" ]; then
          printf "${RED}Usage: repoexe enable <apt|bun|npm|pip|all>${RESET}\n"
          exit 1
        fi
        enable_manager "$2"
        ;;
      disable|-d)
        if [ -z "$2" ]; then
          printf "${RED}Usage: repoexe disable <apt|bun|npm|pip|all>${RESET}\n"
          exit 1
        fi
        disable_manager "$2"
        ;;
      version|-v|--version)
        printf "repoexe v1.1.1\n"
        ;;
      help|-h|--help|"")
        show_help
        ;;
      *)
        printf "${RED}Error: Unknown command '$1'${RESET}\n\n"
        show_help
        exit 1
        ;;
    esac
    CLIEOF
    chmod 755 "${DESTDIR}${PREFIX}/bin/repoexe"

    # Install Bash Auto-completion
    cat << 'COMPEOF' > "${DESTDIR}${PREFIX}/share/bash-completion/completions/repoexe"
    _repoexe_completions() {
        local cur prev
        COMPREPLY=()
        cur="${COMPWORDS[COMPCWORD]}"
        prev="${COMPWORDS[COMPCWORD-1]}"

        case "${prev}" in
            enable|-e|disable|-d)
                COMPREPLY=( $(compgen -W "apt bun npm pip all" -- ${cur}) )
                return 0
                ;;
            repoexe)
                COMPREPLY=( $(compgen -W "status sync list ls doctor enable disable version help -s -y -l -e -d -v -h" -- ${cur}) )
                return 0
                ;;
        esac
    }
    complete -F _repoexe_completions repoexe
    COMPEOF

    # Install Zsh Auto-completion
    cat << 'ZSHCOMPEOF' > "${DESTDIR}${PREFIX}/share/zsh/site-functions/_repoexe"
    #compdef repoexe
    _repoexe() {
        local -a commands
        commands=(
            'status:Check system repository integrations status'
            'sync:Re-sync all manager integrations from upstream'
            'list:List all available packages in RepoExe store'
            'doctor:Run diagnostic health checks on repository setup'
            'enable:Enable specific manager'
            'disable:Disable specific manager'
            'version:Print CLI version'
            'help:Show help menu'
        )
        _describe 'command' commands
    }
    _repoexe
    ZSHCOMPEOF

    # Install GPG & RSA security keys using .asc extension
    if [ -f "scripts/repoexe.gpg" ]; then
      cp "scripts/repoexe.gpg" "${DESTDIR}${PREFIX}/etc/apt/trusted.gpg.d/repoexe.asc"
    fi
    if [ -f "scripts/repoexe.rsa.pub" ]; then
      cp "scripts/repoexe.rsa.pub" "${DESTDIR}${PREFIX}/etc/apk/keys/repoexe.rsa.pub"
    fi
