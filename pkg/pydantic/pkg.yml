name: pydantic
version: 2.13.5
revision: 0
arch: aarch64
description: Data validation using Python type hints
license: MIT
homepage: https://github.com/pydantic/pydantic
maintainer: SjnExe

deps:
  - pydantic-core
  - typing-extensions
  - annotated-types

formats:
  - pip

channels:
  latest:
    auto_update: true
    update_strategy: pypi
    source: https://files.pythonhosted.org/packages/source/p/pydantic/pydantic-{version}.tar.gz
    version: 2.13.5
    revision: 0

build_system: custom

phases:
  make: |
    python3 -m pip install --target="${DESTDIR}${PREFIX}/lib/python3/dist-packages" . --no-deps
  install: |
    echo "Installed pydantic site-packages into staging"
  test: |
    python3 -c "import pydantic; print('pydantic ok')"
