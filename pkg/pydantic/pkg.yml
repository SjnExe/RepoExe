name: pydantic
version: "2.13.4"
revision: 0
arch: aarch64
description: Data validation using Python type hints
license: MIT
homepage: https://github.com/pydantic/pydantic
maintainer: SjnExe

formats:
  - apt
  - pip

channels:
  latest:
    auto_update: true
    update_strategy: pypi
    source_url: https://files.pythonhosted.org/packages/source/p/pydantic/pydantic-{version}.tar.gz

build_system: custom

toolchains:
  python: "3.14"
  rust: "stable"

phases:
  prepare: |
    python3 -m pip install --break-system-packages hatchling hatch-fancy-pypi-readme hatch-vcs typing-extensions annotated-types typing-inspection
  make: |
    SRC_DIR="$(pwd)"
    rm -rf /tmp/pydantic_core_* /tmp/pydantic_dist /tmp/pylib /tmp/pyo3_config.ini
    mkdir -p /tmp/pydantic_core_dl /tmp/pydantic_dist /tmp/pylib

    printf "void* _Py_NoneStruct = 0;\n" | ${NDK:-/opt/android-ndk}/toolchains/llvm/prebuilt/linux-arm64/bin/aarch64-linux-android24-clang -shared -Wl,-soname,libpython3.14.so -o /tmp/pylib/libpython3.14.so -x c -
    cp /tmp/pylib/libpython3.14.so /tmp/pylib/libpython3.so 2>/dev/null || true

    printf "implementation=CPython\nversion=3.14\nshared=true\nabi3=false\nlib_name=python3.14\nlib_dir=/tmp/pylib\npointer_width=64\nbuild_flags=\nsuppress_build_script_link_lines=false\n" > /tmp/pyo3_config.ini

    python3 -c "
    import re, json, urllib.request, tarfile, pathlib
    p_text = pathlib.Path('pyproject.toml').read_text() if pathlib.Path('pyproject.toml').exists() else ''
    m = re.search(r'pydantic-core==([0-9\.]+)', p_text) or re.search(r'pydantic_core==([0-9\.]+)', p_text)
    core_ver = m.group(1) if m else '2.46.4'
    print(f'⚡ Dynamically resolved pydantic-core requirement: {core_ver}')
    req = urllib.request.urlopen(f'https://pypi.org/pypi/pydantic_core/{core_ver}/json')
    data = json.loads(req.read().decode('utf-8'))
    sdist = [u for u in data['urls'] if u['packagetype'] == 'sdist'][0]
    print(f'Fetching pydantic-core {core_ver} sdist: {sdist[\"url\"]}')
    urllib.request.urlretrieve(sdist['url'], '/tmp/pydantic_core_dl/sdist.tar.gz')
    with tarfile.open('/tmp/pydantic_core_dl/sdist.tar.gz') as tar:
        tar.extractall('/tmp/pydantic_core_dl')
    "
    CORE_DIR=$(find /tmp/pydantic_core_dl -mindepth 1 -maxdepth 1 -type d | head -n 1)
    cd "$CORE_DIR"

    PYO3_CONFIG_FILE=/tmp/pyo3_config.ini \
    RUSTFLAGS="${RUSTFLAGS:-} -L /tmp/pylib -C link-arg=-Wl,-rpath-link,/tmp/pylib" \
    LIBRARY_PATH="/tmp/pylib:${LIBRARY_PATH:-}" \
    cargo build --release --target aarch64-linux-android --features pyo3/extension-module

    mkdir -p "${DESTDIR}${PREFIX}/lib/python3/dist-packages/pydantic_core"
    [ -d python/pydantic_core ] && cp -r python/pydantic_core/* "${DESTDIR}${PREFIX}/lib/python3/dist-packages/pydantic_core/" || cp -r pydantic_core/* "${DESTDIR}${PREFIX}/lib/python3/dist-packages/pydantic_core/" 2>/dev/null || true
    SO_FILE=$(find target/aarch64-linux-android/release -maxdepth 1 \( -name "*pydantic_core*.so" -o -name "lib_pydantic_core.so" \) | head -n 1)
    if [ -n "$SO_FILE" ]; then
      cp "$SO_FILE" "${DESTDIR}${PREFIX}/lib/python3/dist-packages/pydantic_core/_pydantic_core.so"
      echo "✓ Staged pydantic-core binary extension: $SO_FILE"
    else
      echo "::error:: _pydantic_core.so not found after cargo build!"
      exit 1
    fi
    cd "$SRC_DIR"
    python3 -m pip install --break-system-packages --target="${DESTDIR}${PREFIX}/lib/python3/dist-packages" typing-extensions annotated-types typing-inspection
    python3 -m pip install --break-system-packages --no-deps --target="${DESTDIR}${PREFIX}/lib/python3/dist-packages" .
  install: |
    echo "Installed pydantic site-packages into staging"
  test: |
    python3 -c "import pydantic; print('pydantic ok')"
