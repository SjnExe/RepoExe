name: pydantic
version: 2.13.5
revision: 0
arch: aarch64
description: Data validation using Python type hints
license: MIT
homepage: https://github.com/pydantic/pydantic
maintainer: SjnExe

formats:
  - pip

channels:
  latest:
    auto_update: true
    update_strategy: pypi
    source: https://files.pythonhosted.org/packages/source/p/pydantic/pydantic-{version}.tar.gz
    version: 2.13.5
    revision: 0

build_system: custom
toolchains:
  python: "3.14"

phases:
  prepare: |
    python3 -m pip install --break-system-packages hatchling hatch-fancy-pypi-readme hatch-vcs
  make: |
    python3 -m pip install --break-system-packages --no-deps --target="${DESTDIR}${PREFIX}/lib/python3/dist-packages" .
  install: |
    echo "Installed pydantic site-packages into staging"
  test: |
    python3 -c "import pydantic; print('pydantic ok')"
