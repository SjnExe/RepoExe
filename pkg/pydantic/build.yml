name: pydantic
version: "2.13.4"
revision: 0
arch: aarch64
description: Data validation using Python type hints
license: MIT
homepage: https://github.com/pydantic/pydantic
maintainer: SjnExe

formats:
  - apt
  - pip

channels:
  latest:
    auto_update: true
    update_strategy: pypi
    source_url: https://files.pythonhosted.org/packages/source/p/pydantic/pydantic-{version}.tar.gz

build_system: custom
phases:
  prepare: |
    python3 -m pip install --break-system-packages maturin hatchling hatch-fancy-pypi-readme hatch-vcs
  make: |
    rm -rf /tmp/pydantic_core_* /tmp/pydantic_dist
    mkdir -p /tmp/pydantic_core_dl /tmp/pydantic_dist
    python3 -c "import json, urllib.request, tarfile; req = urllib.request.urlopen('https://pypi.org/pypi/pydantic_core/json'); data = json.loads(req.read().decode('utf-8')); sdist = [u for u in data['urls'] if u['packagetype'] == 'sdist'][0]; print('Fetching pydantic-core sdist:', sdist['url']); urllib.request.urlretrieve(sdist['url'], '/tmp/pydantic_core_dl/sdist.tar.gz'); with tarfile.open('/tmp/pydantic_core_dl/sdist.tar.gz') as tar: tar.extractall('/tmp/pydantic_core_dl')"
    cd /tmp/pydantic_core_dl/pydantic_core-*
    maturin build --release --target aarch64-linux-android -i "$(command -v python3)" --out /tmp/pydantic_dist
    mkdir -p "${DESTDIR}${PREFIX}/lib/python3/dist-packages"
    unzip -o /tmp/pydantic_dist/*.whl -d "${DESTDIR}${PREFIX}/lib/python3/dist-packages"
    cd "${REPO_ROOT:-/home/builder/RepoExe}"
    python3 -m pip install --break-system-packages --no-deps --target="${DESTDIR}${PREFIX}/lib/python3/dist-packages" .
    find "${DESTDIR}${PREFIX}/lib/python3/dist-packages/pydantic_core" -name "_pydantic_core*.so" -exec sh -c 'f="$1"; dir=$(dirname "$f"); cp "$f" "$dir/_pydantic_core.so"' _ {} \;
  install: |
    echo "Installed pydantic site-packages into staging"
  test: |
    python3 -c "import pydantic; print('pydantic ok')"
