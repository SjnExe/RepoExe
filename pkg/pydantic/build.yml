name: pydantic
version: "2.13.4"
revision: 0
arch: aarch64
description: Data validation using Python type hints
license: MIT
homepage: https://github.com/pydantic/pydantic
maintainer: SjnExe

formats:
  - apt
  - pip

channels:
  latest:
    auto_update: true
    update_strategy: pypi
    source_url: https://files.pythonhosted.org/packages/source/p/pydantic/pydantic-{version}.tar.gz

build_system: custom

toolchains:
  python: "3.14"
  rust: "stable"

phases:
  prepare: |
    python3 -m pip install --break-system-packages hatchling hatch-fancy-pypi-readme hatch-vcs typing-extensions annotated-types
  make: |
    SRC_DIR="$(pwd)"
    rm -rf /tmp/pydantic_core_* /tmp/pydantic_dist /tmp/pylib
    mkdir -p /tmp/pydantic_core_dl /tmp/pydantic_dist /tmp/pylib
    PY314=$(uv python find 3.14 2>/dev/null || which python3.14 || which python3)
    PY314_STDLIB=$($PY314 -c "import sysconfig; print(sysconfig.get_path('stdlib'))" 2>/dev/null || true)
    if [ -d "$PY314_STDLIB" ]; then
      find "$PY314_STDLIB" -name "_sysconfigdata*.py" -exec cp {} /tmp/pylib/_sysconfigdata__linux_aarch64-linux-android.py \; 2>/dev/null || true
    fi
    if [ ! -f /tmp/pylib/_sysconfigdata__linux_aarch64-linux-android.py ]; then
      find /usr/lib/python3* /home/builder/.local -name "_sysconfigdata*.py" -exec cp {} /tmp/pylib/_sysconfigdata__linux_aarch64-linux-android.py \; 2>/dev/null || true
    fi
    python3 -c "
    from pathlib import Path
    p = Path('/tmp/pylib/_sysconfigdata__linux_aarch64-linux-android.py')
    if p.exists():
        txt = p.read_text(encoding='utf-8')
        txt = txt.replace(\"'VERSION': '3.12'\", \"'VERSION': '3.14'\")
        txt = txt.replace(\"'SOABI': 'cpython-312\", \"'SOABI': 'cpython-314\")
        txt = txt.replace(\"'py_version_short': '3.12'\", \"'py_version_short': '3.14'\")
        p.write_text(txt, encoding='utf-8')
    "
    for v in 3.14 3.12; do
      printf "void* _Py_NoneStruct = 0;\n" | ${NDK:-/opt/android-ndk}/toolchains/llvm/prebuilt/linux-arm64/bin/aarch64-linux-android24-clang -shared -Wl,-soname,libpython${v}.so -o /tmp/pylib/libpython${v}.so -x c -
    done
    cp /tmp/pylib/libpython3.14.so /tmp/pylib/libpython3.so 2>/dev/null || true
    export PYO3_PYTHON="$PY314"
    export PYO3_CROSS_PYTHON_VERSION=3.14
    export PYO3_CROSS_PYTHON_IMPLEMENTATION=CPython
    export PYO3_CROSS_LIB_DIR=/tmp/pylib
    export _PYTHON_SYSCONFIGDATA_NAME="_sysconfigdata__linux_aarch64-linux-android"
    export RUSTFLAGS="${RUSTFLAGS:-} -L /tmp/pylib -C link-arg=-Wl,-rpath-link,/tmp/pylib"
    export LIBRARY_PATH="/tmp/pylib:${LIBRARY_PATH:-}"
    python3 -c "import json, urllib.request, tarfile; req = urllib.request.urlopen('https://pypi.org/pypi/pydantic_core/json'); data = json.loads(req.read().decode('utf-8')); sdist = [u for u in data['urls'] if u['packagetype'] == 'sdist'][0]; print('Fetching pydantic-core sdist:', sdist['url']); urllib.request.urlretrieve(sdist['url'], '/tmp/pydantic_core_dl/sdist.tar.gz'); tar = tarfile.open('/tmp/pydantic_core_dl/sdist.tar.gz'); tar.extractall('/tmp/pydantic_core_dl'); tar.close()"
    CORE_DIR=$(find /tmp/pydantic_core_dl -mindepth 1 -maxdepth 1 -type d | head -n 1)
    cd "$CORE_DIR"
    cargo build --release --target aarch64-linux-android --features pyo3/extension-module
    mkdir -p "${DESTDIR}${PREFIX}/lib/python3/dist-packages/pydantic_core"
    [ -d python/pydantic_core ] && cp -r python/pydantic_core/* "${DESTDIR}${PREFIX}/lib/python3/dist-packages/pydantic_core/" || cp -r pydantic_core/* "${DESTDIR}${PREFIX}/lib/python3/dist-packages/pydantic_core/" 2>/dev/null || true
    SO_FILE=$(find target/aarch64-linux-android/release -maxdepth 1 \( -name "*pydantic_core*.so" -o -name "lib_pydantic_core.so" \) | head -n 1)
    if [ -n "$SO_FILE" ]; then
      cp "$SO_FILE" "${DESTDIR}${PREFIX}/lib/python3/dist-packages/pydantic_core/_pydantic_core.so"
      echo "✓ Staged pydantic-core binary extension: $SO_FILE"
    else
      echo "::error:: _pydantic_core.so not found after cargo build!"
      exit 1
    fi
    cd "$SRC_DIR"
    python3 -m pip install --break-system-packages --target="${DESTDIR}${PREFIX}/lib/python3/dist-packages" typing-extensions annotated-types
    python3 -m pip install --break-system-packages --no-deps --target="${DESTDIR}${PREFIX}/lib/python3/dist-packages" .
  install: |
    echo "Installed pydantic site-packages into staging"
  test: |
    python3 -c "import pydantic; print('pydantic ok')"
