name: pydantic
version: "2.13.4"
revision: 0
arch: aarch64
description: Data validation using Python type hints
license: MIT
homepage: https://github.com/pydantic/pydantic
maintainer: SjnExe

formats:
  - apt
  - pip

channels:
  latest:
    auto_update: true
    update_strategy: pypi
    source_url: https://files.pythonhosted.org/packages/source/p/pydantic/pydantic-{version}.tar.gz

build_system: custom
phases:
  prepare: |
    PY_VER="$(python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')"
    export MATURIN_PEP517_ARGS="--interpreter python${PY_VER}"
    export PYO3_PYTHON="$(which python${PY_VER})"
    python3 -m pip install --break-system-packages maturin
  make: |
    PY_VER="$(python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')"
    export MATURIN_PEP517_ARGS="--interpreter python${PY_VER}"
    export PYO3_PYTHON="$(which python${PY_VER})"
    python3 -m pip wheel . -w output/ || true
    python3 -m pip install --break-system-packages --no-binary pydantic-core --target="${DESTDIR}${PREFIX}/lib/python3/dist-packages" .
  install: |
    echo "Installed pydantic site-packages into staging"
  test: |
    python3 -c "import pydantic; print('pydantic ok')"
