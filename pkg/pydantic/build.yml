name: pydantic
version: "2.13.4"
revision: 0
architecture: aarch64
description: Data validation using Python type hints
license: MIT
homepage: https://github.com/pydantic/pydantic
maintainer: SjnExe

formats:
  - apt
  - pip

channels:
  latest:
    version: "2.13.4"
    auto_update: true
    update_strategy: pypi
    source_url: https://files.pythonhosted.org/packages/source/p/pydantic/pydantic-2.10.6.tar.gz

build_system: custom
phases:
  make: |
    python3 -m pip wheel . --no-deps -w output/ || true
    python3 -m pip install --target="${DESTDIR}${PREFIX}/lib/python3/dist-packages" . --no-deps
  install: |
    echo "Installed pydantic site-packages into staging"
