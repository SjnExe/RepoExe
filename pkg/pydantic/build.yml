name: pydantic
version: "2.13.4"
revision: 0
arch: aarch64
description: Data validation using Python type hints
license: MIT
homepage: https://github.com/pydantic/pydantic
maintainer: SjnExe

formats:
  - apt
  - pip

channels:
  latest:
    auto_update: true
    update_strategy: pypi
    source_url: https://files.pythonhosted.org/packages/source/p/pydantic/pydantic-{version}.tar.gz

build_system: custom
phases:
  prepare: |
    PYTHON_BIN="$(realpath $(command -v python3))"
    $PYTHON_BIN -m pip install --break-system-packages maturin hatchling hatch-fancy-pypi-readme hatch-vcs
  make: |
    export PATH="$HOME/.local/bin:$PATH"
    PYTHON_BIN="$(realpath $(command -v python3))"
    export PYO3_PYTHON="$PYTHON_BIN"
    export CARGO_BUILD_TARGET="aarch64-linux-android"
    $PYTHON_BIN -m pip install --break-system-packages --no-build-isolation --no-binary pydantic-core --target="${DESTDIR}${PREFIX}/lib/python3/dist-packages" pydantic-core
    $PYTHON_BIN -m pip install --break-system-packages --target="${DESTDIR}${PREFIX}/lib/python3/dist-packages" .
  install: |
    echo "Installed pydantic site-packages into staging"
  test: |
    PYTHON_BIN="$(realpath $(command -v python3))"
    $PYTHON_BIN -c "import pydantic; print('pydantic ok')"
