name: pydantic
version: "2.13.4"
revision: 0
arch: aarch64
description: Data validation using Python type hints
license: MIT
homepage: https://github.com/pydantic/pydantic
maintainer: SjnExe

formats:
  - apt
  - pip

channels:
  latest:
    auto_update: true
    update_strategy: pypi
    source_url: https://files.pythonhosted.org/packages/source/p/pydantic/pydantic-{version}.tar.gz

build_system: custom
phases:
  prepare: |
    python3 -m pip install --break-system-packages maturin hatchling hatch-fancy-pypi-readme hatch-vcs
  make: |
    export PATH="$HOME/.local/bin:$PATH"
    export PYO3_PYTHON="$(command -v python3)"
    export NDK_CLANG=$(find /opt/android-ndk -name "aarch64-linux-android24-clang" 2>/dev/null | head -n 1)
    if [ -z "$NDK_CLANG" ]; then NDK_CLANG="aarch64-linux-android24-clang"; fi
    export CARGO_BUILD_TARGET="aarch64-linux-android"
    export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_CLANG"
    export RUSTFLAGS="-C linker=$NDK_CLANG -C link-arg=-fuse-ld=lld -C link-arg=-static-libgcc -C link-arg=-Wl,-z,max-page-size=16384"
    export CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS="$RUSTFLAGS"
    python3 -m pip install --break-system-packages --no-build-isolation --no-binary pydantic-core --target="${DESTDIR}${PREFIX}/lib/python3/dist-packages" pydantic-core
    python3 -m pip install --break-system-packages --target="${DESTDIR}${PREFIX}/lib/python3/dist-packages" .
    find "${DESTDIR}${PREFIX}/lib/python3/dist-packages/pydantic_core" -name "_pydantic_core*.so" -exec sh -c 'f="$1"; dir=$(dirname "$f"); cp "$f" "$dir/_pydantic_core.so"' _ {} \;
  install: |
    echo "Installed pydantic site-packages into staging"
  test: |
    python3 -c "import pydantic; print('pydantic ok')"
