name: ruff
version: 0.16.2
revision: 0
arch: aarch64
description: Fast Python linter and code formatter written in Rust
license: MIT
homepage: https://github.com/astral-sh/ruff
maintainer: SjnExe
formats:
- apt
- pacman
- apk
- pip
channels:
  latest:
    auto_update: true
    update_strategy: github_release
    source_url: https://github.com/astral-sh/ruff/releases/download/{version}/ruff-aarch64-unknown-linux-musl.tar.gz
    version: 0.16.2
    revision: 0
build_system: custom

toolchains:
  rust: "stable"
phases:
  install: 'install -Dm755 ruff "${DESTDIR}${PREFIX}/bin/ruff"

    '
