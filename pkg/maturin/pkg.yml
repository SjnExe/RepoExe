name: maturin
version: 1.15.0
revision: 0
arch: aarch64
description: Build and publish crates with pyo3, rust-cpython, cffi, and uniffi bindings
license: Apache-2.0 OR MIT
homepage: https://github.com/PyO3/maturin
maintainer: SjnExe

formats:
  - pip

channels:
  latest:
    auto_update: true
    update_strategy: pypi
    source: https://files.pythonhosted.org/packages/source/m/maturin/maturin-{version}.tar.gz

build_system: custom
toolchains:
  python: "3.14"
  rust: stable

phases:
  prepare: |
    python3 -m pip install --break-system-packages setuptools setuptools-rust
  make: |
    CLANG_BIN="${CC:-clang}"
    if [ -z "$CLANG_BIN" ] || ! command -v "$CLANG_BIN" >/dev/null 2>&1; then
      CLANG_BIN=$(find "${NDK:-/opt/android-ndk}" -type f -name "aarch64-linux-android*-clang" 2>/dev/null | head -n 1)
    fi
    if [ -z "$CLANG_BIN" ]; then
      CLANG_BIN="clang"
    fi

    rm -rf /tmp/pylib /tmp/pyo3_config.ini
    mkdir -p /tmp/pylib
    printf "void* _Py_NoneStruct = 0;\n" | "$CLANG_BIN" -shared -Wl,-soname,libpython3.14.so -o /tmp/pylib/libpython3.14.so -x c -
    cp /tmp/pylib/libpython3.14.so /tmp/pylib/libpython3.so 2>/dev/null || true

    printf "implementation=CPython\nversion=3.14\nshared=true\nabi3=false\nlib_name=python3.14\nlib_dir=/tmp/pylib\npointer_width=64\nbuild_flags=\nsuppress_build_script_link_lines=false\n" > /tmp/pyo3_config.ini

    PYO3_CONFIG_FILE=/tmp/pyo3_config.ini \
    RUSTFLAGS="${RUSTFLAGS:-} -L /tmp/pylib -C link-arg=-Wl,-rpath-link,/tmp/pylib" \
    LIBRARY_PATH="/tmp/pylib:${LIBRARY_PATH:-}" \
    cargo build --release --target aarch64-linux-android --bin maturin

    mkdir -p "${DESTDIR}${PREFIX}/bin" "${DESTDIR}${PREFIX}/lib/python3/dist-packages/maturin"
    cp target/aarch64-linux-android/release/maturin "${DESTDIR}${PREFIX}/bin/maturin"
    [ -d maturin ] && cp -r maturin/* "${DESTDIR}${PREFIX}/lib/python3/dist-packages/maturin/" 2>/dev/null || true
  install: |
    echo "Installed maturin binary and site-packages into staging"
  test: |
    python3 -c "import maturin; print('maturin ok')"
