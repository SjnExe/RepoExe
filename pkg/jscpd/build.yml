name: jscpd
version: "5.0.14"
revision: 0
arch: aarch64
description: Copy/paste code detector compiled natively in Rust for Termux
license: MIT
homepage: https://jscpd.dev
maintainer: SjnExe
auto_update: true
update_strategy: crates
source_url: https://static.crates.io/crates/jscpd/jscpd-{version}.crate
build_system: cargo
formats:
  - npm
  - apt
  - pacman

phases:
  install: |
    mkdir -p "${DESTDIR}${PREFIX}/bin"
    cargo build --release
    BIN_PATH=$(find target -type f -name jscpd | grep release | head -n 1)
    if [ -z "$BIN_PATH" ]; then
      BIN_PATH=$(find target -type f -name cpd | grep release | head -n 1)
    fi
    cp "$BIN_PATH" "${DESTDIR}${PREFIX}/bin/jscpd"
    chmod +x "${DESTDIR}${PREFIX}/bin/jscpd"
  test: |
    jscpd --version
