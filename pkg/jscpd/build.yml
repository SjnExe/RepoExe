name: jscpd
version: "5.0.14"
revision: 0
arch: aarch64
desc: Copy/paste code detector compiled natively for Termux
license: MIT
homepage: https://github.com/kucherenko/jscpd
maintainer: SjnExe
source: https://github.com/kucherenko/jscpd/archive/refs/tags/v5.0.14.tar.gz
build_system: cargo
formats:
  - npm
  - apt
  - pacman

phases:
  install: |
    mkdir -p "${DESTDIR}${PREFIX}/bin"
    if [ -f "target/aarch64-linux-android/release/jscpd" ]; then
      cp target/aarch64-linux-android/release/jscpd "${DESTDIR}${PREFIX}/bin/jscpd"
    elif [ -f "target/release/jscpd" ]; then
      cp target/release/jscpd "${DESTDIR}${PREFIX}/bin/jscpd"
    else
      cargo build --release
      cp target/release/jscpd "${DESTDIR}${PREFIX}/bin/jscpd"
    fi
    chmod +x "${DESTDIR}${PREFIX}/bin/jscpd"
  test: |
    jscpd --version
