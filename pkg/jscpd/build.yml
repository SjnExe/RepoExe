name: jscpd
version: "3.4.5"
revision: 0
arch: aarch64
description: Copy/paste code detector compiled natively in Rust for Termux
license: MIT
homepage: https://jscpd.dev
maintainer: SjnExe
source_url: https://github.com/kucherenko/jscpd/archive/refs/tags/v3.4.5.tar.gz
build_system: custom
formats:
  - npm
  - apt
  - pacman

phases:
  install: |
    mkdir -p "${DESTDIR}${PREFIX}/bin"
    npm install -g --prefix="${DESTDIR}${PREFIX}" jscpd@3.4.5
  test: |
    jscpd --version
