name: jscpd
version: "5.0.14"
revision: 0
architecture: aarch64
description: Copy/paste detector for programming code (static Rust ARM64 build)
license: MIT
homepage: https://github.com/SjnExe/RepoExe
maintainer: SjnExe

formats:
  - apt
  - pacman
  - apk
  - npm

channels:
  latest:
    version: "5.0.14"
    auto_update: true
    update_strategy: github_tag
    source_url: https://github.com/vv-bogdanov/jscpd-rs/archive/refs/heads/main.tar.gz

build_system: cargo
phases:
  make: |
    cargo build --release --target aarch64-unknown-linux-musl
  install: |
    install -Dm755 target/aarch64-unknown-linux-musl/release/jscpd "${DESTDIR}${PREFIX}/bin/jscpd"
