name: jscpd
version: "5.0.14"
revision: 1
arch: aarch64
desc: Copy/paste code detector compiled natively in Rust for Termux
license: MIT
homepage: https://jscpd.dev
maintainer: SjnExe
source: https://crates.io/api/v1/crates/jscpd/5.0.14/download
build_system: cargo
formats:
  - npm
  - apt
  - pacman

phases:
  install: |
    mkdir -p "${DESTDIR}${PREFIX}/bin"
    if [ -f "target/aarch64-linux-android/release/jscpd" ]; then
      cp target/aarch64-linux-android/release/jscpd "${DESTDIR}${PREFIX}/bin/jscpd"
    elif [ -f "target/release/jscpd" ]; then
      cp target/release/jscpd "${DESTDIR}${PREFIX}/bin/jscpd"
    else
      cargo build --release
      cp target/release/jscpd "${DESTDIR}${PREFIX}/bin/jscpd"
    fi
    chmod +x "${DESTDIR}${PREFIX}/bin/jscpd"
  test: |
    jscpd --version
