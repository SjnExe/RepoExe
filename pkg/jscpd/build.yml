name: jscpd
version: "5.0.15"
revision: 0
arch: aarch64
desc: Copy/paste code detector compiled natively in Rust for aarch64 Android/Termux
license: MIT
homepage: https://github.com/kucherenko/jscpd
maintainer: SjnExe
source: https://github.com/kucherenko/jscpd/archive/refs/tags/v5.0.14.tar.gz
build_system: cargo
formats:
  - npm
  - apt
  - pacman

phases:
  install: |
    mkdir -p "${DESTDIR}${PREFIX}/bin"
    CARGO_MANIFEST=$(find . -name Cargo.toml | head -n 1)
    if [ -n "$CARGO_MANIFEST" ]; then
      cd "$(dirname "$CARGO_MANIFEST")"
    fi
    cargo build --release
    BIN_SRC=$(find target/ -type f -name jscpd 2>/dev/null | grep -v "\.d$" | head -n 1)
    if [ -z "$BIN_SRC" ]; then
      BIN_SRC=$(find . -type f -name jscpd 2>/dev/null | grep -v "\.d$" | head -n 1)
    fi
    cp "$BIN_SRC" "${DESTDIR}${PREFIX}/bin/jscpd"
    chmod +x "${DESTDIR}${PREFIX}/bin/jscpd"
  test: |
    jscpd --version
