name: jscpd
version: "5.0.14"
revision: 0
arch: all
desc: Copy/paste code detector bundled for universal Node/Bun/Termux execution
license: MIT
homepage: https://github.com/kucherenko/jscpd
maintainer: SjnExe
source: https://registry.npmjs.org/jscpd/-/jscpd-5.0.14.tgz
build_system: custom
formats:
  - npm
  - apt
  - pacman

phases:
  install: |
    mkdir -p "${DESTDIR}${PREFIX}/bin"
    npm install
    npm install --no-save esbuild
    npx esbuild bin/jscpd.js --bundle --platform=node --target=node18 --banner:js='#!/usr/bin/env node' --outfile="${DESTDIR}${PREFIX}/bin/jscpd"
    chmod +x "${DESTDIR}${PREFIX}/bin/jscpd"
  test: |
    jscpd --version
