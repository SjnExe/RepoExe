name: bun
version: "1.3.14"
revision: 0
arch: aarch64
description: Incredibly fast JavaScript runtime, bundler, test runner, and package manager
homepage: https://bun.sh
license: MIT
maintainer: SjnExe
build_system: custom

toolchains:
  clang: ">=21.0.0"
  rust: "stable"

deps:
  - libstdc++
  - zlib
  - libandroid-support
  - libandroid-shmem
  - libandroid-exec

formats:
  - apt
  - pacman
  - apk

channels:
  latest:
    auto_update: true
    update_strategy: github_tag
    source_url: https://github.com/oven-sh/bun/archive/refs/tags/bun-v{version}.tar.gz

phases:
  prepare: |
    set -e
    echo "⚡ Preparing Bun Bionic build environment..."
    sudo apt-get update && sudo apt-get install -y cmake ninja-build pkg-config build-essential libssl-dev ruby ruby-dev bison flex gperf libicu-dev lld unzip wget gnupg

    echo "⚡ Installing host Bun CLI runtime for build codegen..."
    curl -fsSL https://bun.sh/install | bash || true

    echo "⚡ Dynamically resolving oven-sh/zig custom compiler release..."
    python3 -c "import sys, textwrap; exec(textwrap.dedent(sys.stdin.read()))" << 'PY_ZIG_EOF'
    import os, re, urllib.request, json, subprocess

    tag = None
    for candidate in ['src/deps/zig/tag.txt', 'src/deps/zig_tag.txt', 'Makefile']:
        if os.path.exists(candidate):
            with open(candidate, 'r', encoding='utf-8', errors='ignore') as f:
                content = f.read()
            if 'tag.txt' in candidate:
                tag = content.strip()
                if tag: break
            else:
                m = re.search(r'ZIG_TAG\s*\??=\s*(\S+)', content)
                if m:
                    tag = m.group(1).strip()
                    break

    if not tag:
        req = urllib.request.Request('https://api.github.com/repos/oven-sh/zig/releases', headers={'User-Agent': 'RepoExe'})
        with urllib.request.urlopen(req, timeout=10) as resp:
            releases = json.loads(resp.read().decode('utf-8'))
            tag = releases[0]['tag_name']

    print(f'🔒 Bun target Zig tag: {tag}')
    os.makedirs('/tmp/zig-custom', exist_ok=True)
    dl_url = None
    try:
        req = urllib.request.Request(f'https://api.github.com/repos/oven-sh/zig/releases/tags/{tag}', headers={'User-Agent': 'RepoExe'})
        with urllib.request.urlopen(req, timeout=10) as resp:
            rel = json.loads(resp.read().decode('utf-8'))
            for a in rel.get('assets', []):
                if ('aarch64' in a['name'] or 'arm64' in a['name']) and (a['name'].endswith('.zip') or a['name'].endswith('.tar.xz')):
                    dl_url = a['browser_download_url']
                    break
    except Exception:
        pass

    if not dl_url:
        dl_url = f'https://github.com/oven-sh/zig/releases/download/{tag}/bootstrap-aarch64-linux-musl.zip'

    archive_path = '/tmp/zig_dl' + ('.tar.xz' if dl_url.endswith('.tar.xz') else '.zip')
    req = urllib.request.Request(dl_url, headers={'User-Agent': 'RepoExe'})
    with urllib.request.urlopen(req, timeout=30) as resp, open(archive_path, 'wb') as f:
        f.write(resp.read())

    if archive_path.endswith('.tar.xz'):
        subprocess.run(['tar', '-xf', archive_path, '-C', '/tmp/zig-custom/'], check=True)
    else:
        subprocess.run(['unzip', '-q', '-o', archive_path, '-d', '/tmp/zig-custom/'], check=True)
    PY_ZIG_EOF

    echo "⚡ Dynamically resolving exact WebKit commit SHA from Bun source..."
    WEBKIT_SHA=$(python3 -c "import sys, textwrap; exec(textwrap.dedent(sys.stdin.read()))" << 'PY_WK_EOF'
    import os, re, subprocess, urllib.request, json

    sha = None
    try:
        res = subprocess.run(['git', 'ls-tree', 'HEAD', 'submodules/WebKit'], capture_output=True, text=True)
        if res.returncode == 0 and res.stdout.strip():
            sha = res.stdout.split()[2]
    except Exception:
        pass

    if not sha:
        for candidate in ['scripts/build/deps/webkit.ts', 'Makefile', 'src/deps/webkit_tag.txt', '.gitmodules']:
            if os.path.exists(candidate):
                with open(candidate, 'r', encoding='utf-8', errors='ignore') as f:
                    content = f.read()
                m = re.search(r'[a-f0-9]{40}', content)
                if m:
                    sha = m.group(0)
                    break

    if not sha:
        req = urllib.request.Request('https://api.github.com/repos/oven-sh/webkit/commits/main', headers={'User-Agent': 'RepoExe'})
        with urllib.request.urlopen(req, timeout=10) as resp:
            sha = json.loads(resp.read().decode('utf-8'))['sha']

    print(sha)
    PY_WK_EOF
    )
    echo "🔒 Target WebKit SHA: ${WEBKIT_SHA}"

    JSC_CACHE_DIR="/home/builder/RepoExe/.cache/bun-jsc-${WEBKIT_SHA}"
    mkdir -p "${DESTDIR}${PREFIX}/lib" "${DESTDIR}${PREFIX}/include/JavaScriptCore"

    if [ -f "${JSC_CACHE_DIR}/lib/libJavaScriptCore.a" ]; then
      echo "✓ WebKit cache hit for SHA ${WEBKIT_SHA}. Restoring headers and libraries..."
      cp -a "${JSC_CACHE_DIR}/lib/"* "${DESTDIR}${PREFIX}/lib/" 2>/dev/null || true
      cp -a "${JSC_CACHE_DIR}/include/"* "${DESTDIR}${PREFIX}/include/" 2>/dev/null || true
    else
      echo "⚡ WebKit cache miss. Compiling JavaScriptCore natively for Bionic (SHA ${WEBKIT_SHA})..."
      WK_SRC="/tmp/webkit-src"
      mkdir -p "$WK_SRC"
      git init "$WK_SRC"
      git -C "$WK_SRC" remote add origin https://github.com/oven-sh/webkit.git
      git -C "$WK_SRC" fetch --depth 1 origin "$WEBKIT_SHA"
      git -C "$WK_SRC" checkout FETCH_HEAD

      python3 -c "from pathlib import Path; import re; p = Path('/tmp/webkit-src/Source/cmake/OptionsJSCOnly.cmake'); stub = 'add_library(ICU::uc UNKNOWN IMPORTED)\nset_target_properties(ICU::uc PROPERTIES IMPORTED_LOCATION /usr/lib/aarch64-linux-gnu/libicuuc.so INTERFACE_INCLUDE_DIRECTORIES /tmp/icu-include)\nadd_library(ICU::i18n UNKNOWN IMPORTED)\nset_target_properties(ICU::i18n PROPERTIES IMPORTED_LOCATION /usr/lib/aarch64-linux-gnu/libicui18n.so INTERFACE_INCLUDE_DIRECTORIES /tmp/icu-include)\nadd_library(ICU::data UNKNOWN IMPORTED)\nset_target_properties(ICU::data PROPERTIES IMPORTED_LOCATION /usr/lib/aarch64-linux-gnu/libicudata.so INTERFACE_INCLUDE_DIRECTORIES /tmp/icu-include)\nset(ICU_FOUND TRUE)\nset(ICU_INCLUDE_DIRS /tmp/icu-include)\nset(ICU_LIBRARIES /usr/lib/aarch64-linux-gnu/libicuuc.so /usr/lib/aarch64-linux-gnu/libicui18n.so /usr/lib/aarch64-linux-gnu/libicudata.so)\nset(ENABLE_BUN ON CACHE BOOL "" FORCE)\nset(ENABLE_BUN_JSC ON CACHE BOOL "" FORCE)\nset(USE_BUN_JSC_ADDITIONS ON CACHE BOOL "" FORCE)'; p.exists() and p.write_text(re.sub(r'find_package\(ICU[^\)]*\)', stub, p.read_text()) + '\nset(ENABLE_BUN ON CACHE BOOL "" FORCE)\nset(ENABLE_BUN_JSC ON CACHE BOOL "" FORCE)\nset(USE_BUN_JSC_ADDITIONS ON CACHE BOOL "" FORCE)\n')"

      mkdir -p /tmp/icu-include && ln -sfn /usr/include/unicode /tmp/icu-include/unicode
      mkdir -p "${WK_SRC}/build" && cd "${WK_SRC}/build"
      cmake -G Ninja ..         -DCMAKE_TOOLCHAIN_FILE="${NDK:-/opt/android-ndk}/build/cmake/android.toolchain.cmake"         -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH         -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=BOTH         -DANDROID_ABI=arm64-v8a         -DANDROID_PLATFORM=android-31         -DCMAKE_BUILD_TYPE=Release         -DPORT=JSCOnly         -DENABLE_STATIC_JSC=ON         -DENABLE_BUN=ON         -DENABLE_BUN_JSC=ON         -DUSE_BUN_JSC_ADDITIONS=ON         -DDEVELOPER_MODE=OFF         -DUSE_THINLTO=OFF         -DENABLE_SAMPLING_PROFILER=OFF         -DENABLE_REMOTE_INSPECTOR=OFF         -DENABLE_EXTRA_BYTECODE_VERIFICATION=OFF         -DENABLE_JIT=ON         -DENABLE_DFG_JIT=ON         -DENABLE_FTL_JIT=ON         -DENABLE_YARR_JIT=ON         -DENABLE_WEBASSEMBLY=ON         -DENABLE_C_LOOP=OFF         -DCMAKE_C_FLAGS="-O3 -DNDEBUG -D_GNU_SOURCE -fPIC -include /tmp/bionic_stub.h -DENABLE_BUN=1 -DENABLE_BUN_JSC=1 -DBUN_JSC=1 -Wno-unavailable-declarations -Wno-error=unavailable-declarations"         -DCMAKE_CXX_FLAGS="-O3 -DNDEBUG -D_GNU_SOURCE -fPIC -include /tmp/bionic_stub.h -DENABLE_BUN=1 -DENABLE_BUN_JSC=1 -DBUN_JSC=1 -Wno-undefined-var-template -Wno-error=undefined-var-template -Wno-unavailable-declarations -Wno-error=unavailable-declarations"
      ninja -j4 JavaScriptCore

      mkdir -p "${JSC_CACHE_DIR}/lib" "${JSC_CACHE_DIR}/include/JavaScriptCore"
      cp -a lib/lib* "${JSC_CACHE_DIR}/lib/" 2>/dev/null || true
      cp -a "${WK_SRC}/Source/JavaScriptCore/API/"*.h "${JSC_CACHE_DIR}/include/JavaScriptCore/" 2>/dev/null || true
      cp -a JavaScriptCore/Headers/* "${JSC_CACHE_DIR}/include/JavaScriptCore/" 2>/dev/null || true
      cp -a JavaScriptCore/PrivateHeaders/* "${JSC_CACHE_DIR}/include/JavaScriptCore/" 2>/dev/null || true
      cp -a JavaScriptCore/DerivedSources/JavaScriptCore/* "${JSC_CACHE_DIR}/include/JavaScriptCore/" 2>/dev/null || true
      cp -a WTF/Headers/* "${JSC_CACHE_DIR}/include/" 2>/dev/null || true
      cp -a bmalloc/Headers/* "${JSC_CACHE_DIR}/include/" 2>/dev/null || true

      cp -a "${JSC_CACHE_DIR}/lib/"* "${DESTDIR}${PREFIX}/lib/" 2>/dev/null || true
      cp -a "${JSC_CACHE_DIR}/include/"* "${DESTDIR}${PREFIX}/include/" 2>/dev/null || true
      cd /home/builder/RepoExe
    fi

  make: |
    set -e
    ZIG_BIN_DIR=$(find /tmp/zig-custom -type f -name "zig" -exec dirname {} \; | head -n 1)
    NDK_LLVM_BIN="${NDK:-/opt/android-ndk}/toolchains/llvm/prebuilt/linux-arm64/bin"
    export PATH="${NDK_LLVM_BIN}:${ZIG_BIN_DIR}:$HOME/.bun/bin:${PATH}"
    export CC="${NDK_LLVM_BIN}/clang"
    export CXX="${NDK_LLVM_BIN}/clang++"
    export LD="${NDK_LLVM_BIN}/ld.lld"

    echo "⚡ Configuring Android Bionic & 16KB page size compiler flags..."
    export CFLAGS="${CFLAGS:-} -O3 -DNDEBUG -D_GNU_SOURCE -fPIC -include /tmp/bionic_stub.h"
    export CXXFLAGS="${CXXFLAGS:-} -O3 -DNDEBUG -D_GNU_SOURCE -fPIC -include /tmp/bionic_stub.h -Wno-undefined-var-template -Wno-error=undefined-var-template -Wno-dangling -Wno-error=dangling"
    export LDFLAGS="${LDFLAGS:-} -fuse-ld=lld -Wl,-z,max-page-size=16384 -Wl,-z,relro -Wl,-z,now -landroid-support -landroid-exec -llog -lm"

    if [ -f rust-toolchain.toml ]; then
      rustup show
    fi

    echo "⚡ Adapting Bun build scripts for Android NDK toolchain..."
    python3 -c '
    import os
    for root, _, files in os.walk("."):
        for fname in files:
            fpath = os.path.join(root, fname)
            try:
                with open(fpath, "r", encoding="utf-8", errors="ignore") as f:
                    txt = f.read()
                mod = txt
                mod = mod.replace("21.1.8", "21.0.0").replace("21.1.0", "21.0.0").replace("21.1.", "21.0.").replace(">=21.1", ">=21.0").replace(">= 21.1", ">= 21.0")
                mod = mod.replace('"-Werror"', '"-Wno-error"').replace("'-Werror'", "'-Wno-error'")
                mod = mod.replace("-Wno-character-conversion", "-Wno-unknown-warning-option")
                if mod != txt:
                    with open(fpath, "w", encoding="utf-8") as f:
                        f.write(mod)
            except Exception:
                pass
    '

    echo "⚡ Executing Bun Bionic release build..."
    bun scripts/build.ts --profile=release --ci=true

  install: |
    mkdir -p "${DESTDIR}${PREFIX}/bin"
    BUN_BIN=$(find build -type f \( -name "bun" -o -name "bun-profile" \) -executable 2>/dev/null | grep -v "node_modules" | head -n 1)
    if [ -z "$BUN_BIN" ]; then
      BUN_BIN=$(find . -type f \( -name "bun" -o -name "bun-profile" \) -executable 2>/dev/null | grep -v "node_modules" | head -n 1)
    fi

    if [ -n "$BUN_BIN" ]; then
      install -Dm755 "$BUN_BIN" "${DESTDIR}${PREFIX}/bin/bun"
      if command -v termux-elf-cleaner >/dev/null 2>&1; then
        termux-elf-cleaner "${DESTDIR}${PREFIX}/bin/bun" || true
      fi
    else
      echo "::error::bun executable binary not found after build!"
      exit 1
    fi

  test: |
    bun --version
    bun -e "console.log('Bun Android Bionic Runtime OK')"
    bun -e "import { xxhash64 } from 'bun'; console.log('xxhash:', xxhash64('android'))"
    bun --version

vars:
  RUSTC_BOOTSTRAP: "1"
