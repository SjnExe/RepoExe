name: bun
version: 1.3.14
channel: latest
description: Incredibly fast JavaScript runtime, bundler, test runner, and package manager
homepage: https://bun.sh
license: MIT
build_system: custom

update_strategy: github_tag
source_url: https://github.com/oven-sh/bun/archive/refs/tags/bun-v1.3.14.tar.gz

phases:
  prepare: |
    echo "⚡ Preparing Bun build environment..."
    if ! command -v clang-21 >/dev/null 2>&1; then
      sudo apt-get update && sudo apt-get install -y lsb-release software-properties-common wget gnupg
      wget -O /tmp/llvm.sh https://apt.llvm.org/llvm.sh
      chmod +x /tmp/llvm.sh
      sudo /tmp/llvm.sh 21 || sudo apt-get install -y clang-21 lld-21 || true
    fi

    echo "⚡ Installing host Bun CLI runtime for build codegen..."
    curl -fsSL https://bun.sh/install | bash -s "bun-v1.3.14" || true

  make: |
    export PATH="$HOME/.bun/bin:${PATH}"
    export CC="/usr/lib/llvm-21/bin/clang"

    echo "⚡ Creating dynamic CXX wrapper to resolve bun-zig.o at link time..."
    python3 -c '
    import os
    wrapper_script = """#!/bin/bash
    if [[ "$*" == *"bun-zig.o"* ]] || [[ "$*" == *"@bun-profile.rsp"* ]]; then
        if [ ! -f "bun-zig.o" ]; then
            FOUND=$(find /home/builder/RepoExe/build/build_bun/src -name "bun-zig.o" -type f 2>/dev/null | head -n 1)
            if [ -n "$FOUND" ]; then
                cp -f "$FOUND" ./bun-zig.o
                echo "[CXX Wrapper] Successfully located and synced bun-zig.o from $FOUND"
            fi
        fi
    fi
    exec /usr/lib/llvm-21/bin/clang++ "$@"
    """
    with open("/tmp/clang++-wrapper", "w", encoding="utf-8") as f:
        f.write(wrapper_script)
    os.chmod("/tmp/clang++-wrapper", 0o755)
    '
    export CXX="/tmp/clang++-wrapper"

    if [ -f rust-toolchain.toml ]; then
      rustup show
    fi

    echo "⚡ Suppressing Clang 21 C++23 template warnings in bindings..."
    python3 -c '
    import glob, os
    for cpp in glob.glob("src/jsc/bindings/**/*.cpp", recursive=True) + glob.glob("src/jsc/bindings/*.cpp"):
        if os.path.isfile(cpp):
            with open(cpp, "r", encoding="utf-8") as f:
                code = f.read()
            pragma = "#pragma clang diagnostic ignored \"-Wundefined-var-template\"\n"
            if pragma not in code:
                with open(cpp, "w", encoding="utf-8") as f:
                    f.write(pragma + code)
    '

    echo "⚡ Executing Bun release build with --ci=true..."
    bun scripts/build.ts --profile=release --ci=true

  install: |
    mkdir -p "${DESTDIR}/usr/bin"
    BUN_BIN=$(find build -type f \( -name "bun" -o -name "bun-profile" \) -executable 2>/dev/null | grep -v "node_modules" | head -n 1)
    if [ -z "$BUN_BIN" ]; then
      BUN_BIN=$(find . -type f \( -name "bun" -o -name "bun-profile" \) -executable 2>/dev/null | grep -v "node_modules" | head -n 1)
    fi

    if [ -n "$BUN_BIN" ]; then
      install -Dm755 "$BUN_BIN" "${DESTDIR}/usr/bin/bun"
    else
      echo "::error::bun executable binary not found after build!"
      exit 1
    fi

  test: |
    "${DESTDIR}/usr/bin/bun" --version || true
