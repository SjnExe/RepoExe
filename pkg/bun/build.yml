name: bun
version: 1.3.14
channel: latest
description: Incredibly fast JavaScript runtime, bundler, test runner, and package manager
homepage: https://bun.sh
license: MIT
build_system: custom

update_strategy: github_tag
source_url: https://github.com/oven-sh/bun/archive/refs/tags/bun-v1.3.14.tar.gz

phases:
  prepare: |
    echo "⚡ Preparing Bun build environment..."
    if ! command -v clang-21 >/dev/null 2>&1; then
      sudo apt-get update && sudo apt-get install -y lsb-release software-properties-common wget gnupg
      wget -O /tmp/llvm.sh https://apt.llvm.org/llvm.sh
      chmod +x /tmp/llvm.sh
      sudo /tmp/llvm.sh 21 || sudo apt-get install -y clang-21 lld-21 || true
    fi

    echo "⚡ Installing host Bun CLI runtime for build codegen..."
    curl -fsSL https://bun.sh/install | bash -s "bun-v1.3.14" || true

  make: |
    export PATH="$HOME/.bun/bin:${PATH}"
    export CC="/usr/lib/llvm-21/bin/clang"
    export CXX="/usr/lib/llvm-21/bin/clang++"

    if [ -f rust-toolchain.toml ]; then
      rustup show
    fi

    echo "⚡ Patching scripts/build.ts to suppress Clang 21 warnings and sync bun-zig.o path..."
    python3 -c '
    import glob, os, shutil

    # 1. Patch scripts/build.ts warning flags and ensure bun-zig.o is synced to release dir
    if os.path.isfile("scripts/build.ts"):
        with open("scripts/build.ts", "r", encoding="utf-8") as f:
            content = f.read()
        
        # Inject warning suppression flags
        content = content.replace("\"-Wno-character-conversion\"", "\"-Wno-character-conversion\", \"-Wno-undefined-var-template\", \"-Wno-error=undefined-var-template\"")
        content = content.replace("\"-Werror\"", "\"-Werror\", \"-Wno-undefined-var-template\", \"-Wno-error=undefined-var-template\"")

        # Inject automatic bun-zig.o relocation logic into build.ts
        sync_code = """
    // Automatically ensure bun-zig.o is synced to release directory
    for (const searchPath of ["bun-zig.o", "zig-out/lib/bun-zig.o", "zig-out/bin/bun-zig.o"]) {
      if (require("fs").existsSync(searchPath)) {
        require("fs").mkdirSync("build/release", { recursive: true });
        require("fs").copyFileSync(searchPath, "build/release/bun-zig.o");
        break;
      }
    }
    """
        if "bun-zig.o" not in content or "copyFileSync" not in content:
            content = content.replace("await runNinja(", sync_code + "\n    await runNinja(");

        with open("scripts/build.ts", "w", encoding="utf-8") as f:
            f.write(content)

    # 2. Inject diagnostic pragmas directly into C++ binding files
    for cpp in glob.glob("src/jsc/bindings/**/*.cpp", recursive=True) + glob.glob("src/jsc/bindings/*.cpp"):
        if os.path.isfile(cpp):
            with open(cpp, "r", encoding="utf-8") as f:
                code = f.read()
            pragma = "#pragma clang diagnostic ignored \"-Wundefined-var-template\"\n"
            if pragma not in code:
                with open(cpp, "w", encoding="utf-8") as f:
                    f.write(pragma + code)
    '

    echo "⚡ Executing Bun release build with --ci=true..."
    bun scripts/build.ts --profile=release --ci=true

  install: |
    mkdir -p "${DESTDIR}/usr/bin"
    BUN_BIN=$(find build -type f \( -name "bun" -o -name "bun-profile" \) -executable 2>/dev/null | grep -v "node_modules" | head -n 1)
    if [ -z "$BUN_BIN" ]; then
      BUN_BIN=$(find . -type f \( -name "bun" -o -name "bun-profile" \) -executable 2>/dev/null | grep -v "node_modules" | head -n 1)
    fi

    if [ -n "$BUN_BIN" ]; then
      install -Dm755 "$BUN_BIN" "${DESTDIR}/usr/bin/bun"
    else
      echo "::error::bun executable binary not found after build!"
      exit 1
    fi

  test: |
    "${DESTDIR}/usr/bin/bun" --version || true
