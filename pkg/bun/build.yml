name: bun
version: "1.2.2"
revision: 0
arch: aarch64
description: Incredibly fast JavaScript runtime, bundler, test runner, and package manager
homepage: https://bun.sh
license: MIT
maintainer: SjnExe
build_system: custom

deps:
  - libstdc++
  - zlib

formats:
  - apt
  - pacman
  - apk

channels:
  latest:
    auto_update: true
    update_strategy: github_tag
    source_url: https://github.com/oven-sh/bun/archive/refs/tags/bun-v{version}.tar.gz

phases:
  prepare: |
    set -e
    echo "⚡ Preparing Bun build environment..."
    if ! command -v clang-21 >/dev/null 2>&1; then
      sudo apt-get update && sudo apt-get install -y lsb-release software-properties-common wget gnupg
      wget -O /tmp/llvm.sh https://apt.llvm.org/llvm.sh
      chmod +x /tmp/llvm.sh
      sudo /tmp/llvm.sh 21 || sudo apt-get install -y clang-21 lld-21 || true
    fi

    echo "⚡ Installing host Bun CLI runtime for build codegen..."
    curl -fsSL https://bun.sh/install | bash || true

  make: |
    set -e
    export PATH="$HOME/.bun/bin:${PATH}"

    echo "⚡ Configuring Android Bionic & 16KB page size compiler flags..."
    export CFLAGS="${CFLAGS:-} -O3 -DNDEBUG -D__ANDROID_API__=24 -D_GNU_SOURCE -fPIC"
    export CXXFLAGS="${CXXFLAGS:-} -O3 -DNDEBUG -D__ANDROID_API__=24 -D_GNU_SOURCE -fPIC -Wno-undefined-var-template -Wno-error=undefined-var-template"
    export LDFLAGS="${LDFLAGS:-} -fuse-ld=lld -Wl,-z,max-page-size=16384 -Wl,-z,relro -Wl,-z,now"

    echo "⚡ Installing system-level LLVM 21 clang++ interceptor wrapper..."
    sudo python3 -c '
    import os, shutil, glob

    clang_bin = "/usr/lib/llvm-21/bin/clang++"
    clang_real = "/usr/lib/llvm-21/bin/clang++.real"

    if not os.path.exists(clang_real):
        if os.path.islink(clang_bin):
            real_target = os.path.realpath(clang_bin)
            os.unlink(clang_bin)
            os.symlink(real_target, clang_real)
        else:
            shutil.move(clang_bin, clang_real)

    wrapper_content = "\n".join([
        "#!/bin/bash",
        "if [[ \"$*\" == *\"@bun-profile.rsp\"* ]] || [[ \"$*\" == *\"bun-zig.o\"* ]]; then",
        "    if [ ! -f \"bun-zig.o\" ]; then",
        "        ZIG_OBJ=$(find /home/builder /tmp -name \"bun-zig.o\" -type f -size +0 2>/dev/null | head -n 1)",
        "        if [ -z \"$ZIG_OBJ\" ]; then",
        "            ZIG_OBJ=$(find /home/builder /tmp -name \"*zig*.o\" -type f -size +0 2>/dev/null | head -n 1)",
        "        fi",
        "        if [ -n \"$ZIG_OBJ\" ]; then",
        "            cp -f \"$ZIG_OBJ\" ./bun-zig.o",
        "            echo \"[LLVM Interceptor] Successfully copied $ZIG_OBJ to $(pwd)/bun-zig.o\"",
        "        fi",
        "    fi",
        "fi",
        "exec /usr/lib/llvm-21/bin/clang++.real -Wno-undefined-var-template -Wno-error=undefined-var-template -Wno-unused-command-line-argument \"$@\" -lm -lstdc++",
        ""
    ])
    with open(clang_bin, "w", encoding="utf-8") as f:
        f.write(wrapper_content)
    os.chmod(clang_bin, 0o755)

    for p in glob.glob("**/CMakeLists.txt", recursive=True):
        if os.path.isfile(p):
            with open(p, "a", encoding="utf-8") as f:
                f.write("\nadd_compile_options(-Wno-undefined-var-template)\n")
    '

    export CC="/usr/lib/llvm-21/bin/clang"
    export CXX="/usr/lib/llvm-21/bin/clang++"

    if [ -f rust-toolchain.toml ]; then
      rustup show
    fi

    echo "⚡ Executing Bun release build with --ci=true..."
    bun scripts/build.ts --profile=release --ci=true

  install: |
    mkdir -p "${DESTDIR}/usr/bin"
    BUN_BIN=$(find build -type f \( -name "bun" -o -name "bun-profile" \) -executable 2>/dev/null | grep -v "node_modules" | head -n 1)
    if [ -z "$BUN_BIN" ]; then
      BUN_BIN=$(find . -type f \( -name "bun" -o -name "bun-profile" \) -executable 2>/dev/null | grep -v "node_modules" | head -n 1)
    fi

    if [ -n "$BUN_BIN" ]; then
      install -Dm755 "$BUN_BIN" "${DESTDIR}/usr/bin/bun"
    else
      echo "::error::bun executable binary not found after build!"
      exit 1
    fi

  test: |
    "${DESTDIR}/usr/bin/bun" --version
    "${DESTDIR}/usr/bin/bun" eval "console.log('Bun Android Bionic Runtime OK')"
    "${DESTDIR}/usr/bin/bun" eval "import { xxhash64 } from 'bun'; console.log('xxhash:', xxhash64('android'))"
    "${DESTDIR}/usr/bin/bun" --version
