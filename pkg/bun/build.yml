name: bun
version: "1.3.14"
revision: 0
architecture: aarch64
description: Fast JavaScript & TypeScript runtime
license: MIT
homepage: https://bun.sh
maintainer: SjnExe
build_system: custom

source_url: https://github.com/oven-sh/bun/archive/refs/tags/bun-v1.3.14.tar.gz

formats:
  - apt
  - pacman
  - apk

build_deps:
  - bun-jsc

phases:
  prepare: |
    echo "⚡ Downloading standalone Zig compiler..."
    curl -fsSL "https://ziglang.org/download/0.13.0/zig-linux-aarch64-0.13.0.tar.xz" | tar -xJ -C /tmp
    export PATH="/tmp/zig-linux-aarch64-0.13.0:$PATH"
  make: |
    export PATH="/tmp/zig-linux-aarch64-0.13.0:$PATH"
    mkdir -p build
    zig build -Doptimize=ReleaseFast -Dtarget=aarch64-linux-android
  install: |
    mkdir -p "${DESTDIR}${PREFIX}/bin"
    cp zig-out/bin/bun 2>/dev/null || cp zig-out/bin/bun 2>/dev/null || cp zig-out/bin/bun 2>/dev/null || cp build/bun "${DESTDIR}${PREFIX}/bin/bun"
    ln -sf bun "${DESTDIR}${PREFIX}/bin/bunx"
    if command -v termux-elf-cleaner >/dev/null 2>&1; then
      termux-elf-cleaner "${DESTDIR}${PREFIX}/bin/bun"
    fi
  test: |
    bun --version
