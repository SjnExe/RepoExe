name: bun
version: "1.3.14"
revision: 0
arch: aarch64
description: Incredibly fast JavaScript runtime, bundler, test runner, and package manager
homepage: https://bun.sh
license: MIT
maintainer: SjnExe
build_system: custom

deps:
  - libstdc++
  - zlib
  - libandroid-support
  - libandroid-shmem
  - libandroid-exec

formats:
  - apt
  - pacman
  - apk

channels:
  latest:
    auto_update: true
    update_strategy: github_tag
    source_url: https://github.com/oven-sh/bun/archive/refs/tags/bun-v{version}.tar.gz

phases:
  prepare: |
    set -e
    echo "⚡ Preparing Bun Bionic build environment..."
    sudo apt-get update && sudo apt-get install -y cmake ninja-build pkg-config build-essential libssl-dev ruby ruby-dev bison flex gperf libicu-dev lld unzip wget gnupg

    echo "⚡ Installing host Bun CLI runtime for build codegen..."
    curl -fsSL https://bun.sh/install | bash || true

    echo "⚡ Dynamically resolving oven-sh/zig custom compiler release..."
    python3 -c "import sys, textwrap; exec(textwrap.dedent(sys.stdin.read()))" << 'PY_ZIG_EOF'
    import os, re, urllib.request, json, subprocess

    tag = None
    for candidate in ['src/deps/zig/tag.txt', 'src/deps/zig_tag.txt', 'Makefile']:
        if os.path.exists(candidate):
            with open(candidate, 'r', encoding='utf-8', errors='ignore') as f:
                content = f.read()
            if 'tag.txt' in candidate:
                tag = content.strip()
                if tag: break
            else:
                m = re.search(r'ZIG_TAG\s*\??=\s*(\S+)', content)
                if m:
                    tag = m.group(1).strip()
                    break

    if not tag:
        req = urllib.request.Request('https://api.github.com/repos/oven-sh/zig/releases', headers={'User-Agent': 'RepoExe'})
        with urllib.request.urlopen(req, timeout=10) as resp:
            releases = json.loads(resp.read().decode('utf-8'))
            tag = releases[0]['tag_name']

    print(f'🔒 Bun target Zig tag: {tag}')
    os.makedirs('/tmp/zig-custom', exist_ok=True)
    dl_url = f'https://github.com/oven-sh/zig/releases/download/{tag}/bootstrap-aarch64-linux-musl.zip'
    zip_path = '/tmp/zig.zip'
    try:
        urllib.request.urlretrieve(dl_url, zip_path)
        subprocess.run(['unzip', '-q', '-o', zip_path, '-d', '/tmp/zig-custom/'], check=True)
    except Exception:
        dl_url_fallback = f'https://github.com/oven-sh/zig/releases/download/{tag}/zig-linux-aarch64.zip'
        urllib.request.urlretrieve(dl_url_fallback, zip_path)
        subprocess.run(['unzip', '-q', '-o', zip_path, '-d', '/tmp/zig-custom/'], check=True)
    PY_ZIG_EOF

    echo "⚡ Dynamically resolving exact WebKit commit SHA from Bun source..."
    WEBKIT_SHA=$(python3 -c "import sys, textwrap; exec(textwrap.dedent(sys.stdin.read()))" << 'PY_WK_EOF'
    import os, re, subprocess, urllib.request, json

    sha = None
    try:
        res = subprocess.run(['git', 'ls-tree', 'HEAD', 'submodules/WebKit'], capture_output=True, text=True)
        if res.returncode == 0 and res.stdout.strip():
            sha = res.stdout.split()[2]
    except Exception:
        pass

    if not sha:
        for candidate in ['scripts/build/deps/webkit.ts', 'Makefile', 'src/deps/webkit_tag.txt', '.gitmodules']:
            if os.path.exists(candidate):
                with open(candidate, 'r', encoding='utf-8', errors='ignore') as f:
                    content = f.read()
                m = re.search(r'[a-f0-9]{40}', content)
                if m:
                    sha = m.group(0)
                    break

    if not sha:
        req = urllib.request.Request('https://api.github.com/repos/oven-sh/webkit/commits/main', headers={'User-Agent': 'RepoExe'})
        with urllib.request.urlopen(req, timeout=10) as resp:
            sha = json.loads(resp.read().decode('utf-8'))['sha']

    print(sha)
    PY_WK_EOF
    )
    echo "🔒 Target WebKit SHA: ${WEBKIT_SHA}"

    JSC_CACHE_DIR="/home/builder/RepoExe/.cache/bun-jsc-${WEBKIT_SHA}"
    mkdir -p "${DESTDIR}${PREFIX}/lib" "${DESTDIR}${PREFIX}/include/JavaScriptCore"

    if [ -f "${JSC_CACHE_DIR}/lib/libJavaScriptCore.a" ]; then
      echo "✓ WebKit cache hit for SHA ${WEBKIT_SHA}. Restoring headers and libraries..."
      cp -a "${JSC_CACHE_DIR}/lib/"* "${DESTDIR}${PREFIX}/lib/" 2>/dev/null || true
      cp -a "${JSC_CACHE_DIR}/include/"* "${DESTDIR}${PREFIX}/include/" 2>/dev/null || true
    else
      echo "⚡ WebKit cache miss. Compiling JavaScriptCore natively for Bionic (SHA ${WEBKIT_SHA})..."
      WK_SRC="/tmp/webkit-src"
      mkdir -p "$WK_SRC"
      git init "$WK_SRC"
      git -C "$WK_SRC" remote add origin https://github.com/oven-sh/webkit.git
      git -C "$WK_SRC" fetch --depth 1 origin "$WEBKIT_SHA"
                  git -C "$WK_SRC" checkout FETCH_HEAD

      echo "⚡ Patching WebKit CMake ICU requirements..."
      python3 -c "
import glob, re
for p in glob.glob('$WK_SRC/Source/cmake/**/*.cmake', recursive=True):
    with open(p, 'r', encoding='utf-8', errors='ignore') as f:
        c = f.read()
    if 'find_package(ICU' in c:
        c = re.sub(r'find_package\(ICU[^\)]*\)', 'set(ICU_FOUND TRUE)\\nset(ICU_INCLUDE_DIRS /usr/include)\\nset(ICU_LIBRARIES /usr/lib/aarch64-linux-gnu/libicuuc.so /usr/lib/aarch64-linux-gnu/libicui18n.so /usr/lib/aarch64-linux-gnu/libicudata.so)', c)
        with open(p, 'w', encoding='utf-8') as f:
            f.write(c)
" 


    mkdir -p "${WK_SRC}/build" && cd "${WK_SRC}/build"
    cmake -G Ninja ..         -DCMAKE_TOOLCHAIN_FILE="${NDK:-/opt/android-ndk}/build/cmake/android.toolchain.cmake"         -DANDROID_ABI=arm64-v8a         -DANDROID_PLATFORM=android-24         -DCMAKE_BUILD_TYPE=Release         -DPORT=JSCOnly         -DENABLE_STATIC_JSC=ON         -DENABLE_BUN=ON         -DENABLE_BUN_JSC=ON         -DDEVELOPER_MODE=OFF         -DUSE_THINLTO=OFF         -DENABLE_SAMPLING_PROFILER=OFF         -DENABLE_REMOTE_INSPECTOR=OFF         -DENABLE_EXTRA_BYTECODE_VERIFICATION=OFF         -DENABLE_JIT=ON         -DENABLE_DFG_JIT=ON         -DENABLE_FTL_JIT=ON         -DENABLE_YARR_JIT=ON         -DENABLE_WEBASSEMBLY=ON         -DENABLE_C_LOOP=OFF         -DCMAKE_C_FLAGS="-O3 -DNDEBUG -D__ANDROID_API__=24 -D_GNU_SOURCE -fPIC -include /tmp/bionic_stub.h -DENABLE_BUN=1 -DENABLE_BUN_JSC=1 -DBUN_JSC=1"         -DCMAKE_CXX_FLAGS="-O3 -DNDEBUG -D__ANDROID_API__=24 -D_GNU_SOURCE -fPIC -include /tmp/bionic_stub.h -DENABLE_BUN=1 -DENABLE_BUN_JSC=1 -DBUN_JSC=1 -Wno-undefined-var-template -Wno-error=undefined-var-template" -DCMAKE_FIND_ROOT_PATH="/usr;/usr/lib/aarch64-linux-gnu;/opt/android-ndk" -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=BOTH -DICU_ROOT=/usr -DICU_INCLUDE_DIR=/usr/include
    ninja -j4 jsc

    mkdir -p "${JSC_CACHE_DIR}/lib" "${JSC_CACHE_DIR}/include/JavaScriptCore"
    cp -a lib/lib* "${JSC_CACHE_DIR}/lib/" 2>/dev/null || true
    cp -a "${WK_SRC}/Source/JavaScriptCore/API/"*.h "${JSC_CACHE_DIR}/include/JavaScriptCore/" 2>/dev/null || true
    cp -a JavaScriptCore/Headers/* "${JSC_CACHE_DIR}/include/JavaScriptCore/" 2>/dev/null || true
    cp -a JavaScriptCore/PrivateHeaders/* "${JSC_CACHE_DIR}/include/JavaScriptCore/" 2>/dev/null || true
    cp -a JavaScriptCore/DerivedSources/JavaScriptCore/* "${JSC_CACHE_DIR}/include/JavaScriptCore/" 2>/dev/null || true
    cp -a WTF/Headers/* "${JSC_CACHE_DIR}/include/" 2>/dev/null || true
    cp -a bmalloc/Headers/* "${JSC_CACHE_DIR}/include/" 2>/dev/null || true

    cp -a "${JSC_CACHE_DIR}/lib/"* "${DESTDIR}${PREFIX}/lib/" 2>/dev/null || true
    cp -a "${JSC_CACHE_DIR}/include/"* "${DESTDIR}${PREFIX}/include/" 2>/dev/null || true
    cd /home/builder/RepoExe
    fi

  make: |
    set -e
    ZIG_BIN_DIR=$(find /tmp/zig-custom -type f -name "zig" -exec dirname {} \; | head -n 1)
    export PATH="$HOME/.bun/bin:${ZIG_BIN_DIR}:${PATH}"

    echo "⚡ Configuring Android Bionic & 16KB page size compiler flags..."
    export CFLAGS="${CFLAGS:-} -O3 -DNDEBUG -D__ANDROID_API__=24 -D_GNU_SOURCE -fPIC -include /tmp/bionic_stub.h"
    export CXXFLAGS="${CXXFLAGS:-} -O3 -DNDEBUG -D__ANDROID_API__=24 -D_GNU_SOURCE -fPIC -include /tmp/bionic_stub.h -Wno-undefined-var-template -Wno-error=undefined-var-template"
    export LDFLAGS="${LDFLAGS:-} -fuse-ld=lld -Wl,-z,max-page-size=16384 -Wl,-z,relro -Wl,-z,now -landroid-support -landroid-exec -llog -lm"

    if [ -f rust-toolchain.toml ]; then
      rustup show
    fi

    echo "⚡ Executing Bun Bionic release build..."
    bun scripts/build.ts --profile=release --ci=true

  install: |
    mkdir -p "${DESTDIR}${PREFIX}/bin"
    BUN_BIN=$(find build -type f \( -name "bun" -o -name "bun-profile" \) -executable 2>/dev/null | grep -v "node_modules" | head -n 1)
    if [ -z "$BUN_BIN" ]; then
      BUN_BIN=$(find . -type f \( -name "bun" -o -name "bun-profile" \) -executable 2>/dev/null | grep -v "node_modules" | head -n 1)
    fi

    if [ -n "$BUN_BIN" ]; then
      install -Dm755 "$BUN_BIN" "${DESTDIR}${PREFIX}/bin/bun"
      if command -v termux-elf-cleaner >/dev/null 2>&1; then
        termux-elf-cleaner "${DESTDIR}${PREFIX}/bin/bun" || true
      fi
    else
      echo "::error::bun executable binary not found after build!"
      exit 1
    fi

  test: |
    bun --version
    bun -e "console.log('Bun Android Bionic Runtime OK')"
    bun -e "import { xxhash64 } from 'bun'; console.log('xxhash:', xxhash64('android'))"
    bun --version

vars:
  RUSTC_BOOTSTRAP: "1"
