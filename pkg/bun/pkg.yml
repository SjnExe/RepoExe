name: bun
version: "1.3.14"
revision: 0
arch: aarch64
description: Incredibly fast JavaScript runtime, bundler, test runner, and package manager
homepage: https://bun.sh
license: MIT
maintainer: SjnExe
build_system: custom

resources:
  tmpfs: 10
  zram: 0
  swap: 0

toolchains:
  clang: ">=21.0.0"
  rust: "stable"

deps:
  - libstdc++
  - zlib
  - libandroid-support
  - libandroid-shmem
  - libandroid-exec

formats:
  - apt
  - pacman
  - apk

channels:
  latest:
    auto_update: true
    update_strategy: github_tag
    source_url: https://github.com/oven-sh/bun/archive/refs/tags/bun-v{version}.tar.gz

phases:
  prepare: |
    set -e
    echo "⚡ Preparing Bun host tools..."
    curl -fsSL https://bun.sh/install | bash || true

    echo "⚡ Dynamically resolving exact WebKit commit SHA from Bun source..."
    export WEBKIT_SHA=$(python3 -c "import re, pathlib; p = pathlib.Path; print(next((m.group(1) for f in p('.').rglob('*') if f.suffix in ('.ts', '.js', '.zig', '.cmake', '.txt') and 'node_modules' not in str(f) for m in [re.search(r'(?:webkit[_-]version|webkit_sha|WebKit/releases/download/autobuild-)([0-9a-fA-F]{40})', f.read_text('utf-8', 'ignore'))] if m), '5488984d20e0dbfe4be2c3ba8fb18eb81a5e0e8b'))")
    echo "🔒 Target WebKit SHA: ${WEBKIT_SHA}"

    CMAKE_FLAGS="-DCMAKE_TOOLCHAIN_FILE=${NDK:-/opt/android-ndk}/build/cmake/android.toolchain.cmake -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=BOTH -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 -DCMAKE_SYSTEM_VERSION=24 -DCMAKE_BUILD_TYPE=Release -DPORT=JSCOnly -DENABLE_STATIC_JSC=ON -DENABLE_BUN=ON -DENABLE_BUN_JSC=ON -DUSE_BUN_JSC_ADDITIONS=ON -DDEVELOPER_MODE=OFF -DENABLE_API_TESTS=OFF -DENABLE_TEST_SUPPORT=OFF -DBUILD_TESTING=OFF -DENABLE_SAMPLING_PROFILER=OFF -DENABLE_REMOTE_INSPECTOR=OFF -DENABLE_JIT=ON -DENABLE_DFG_JIT=ON -DENABLE_FTL_JIT=ON -DENABLE_WEBASSEMBLY=ON -DENABLE_C_LOOP=OFF"
    COMPAT_HASH=$(sha256sum /home/builder/RepoExe/scripts/compat/bionic_compat.c /home/builder/RepoExe/scripts/compat/bionic_stub.h 2>/dev/null | sha256sum | head -c 8)
    CONFIG_HASH=$(echo "${CMAKE_FLAGS}-${COMPAT_HASH}-v5" | sha256sum | head -c 8)
    export JSC_CACHE_DIR="/home/builder/RepoExe/.cache/bun-jsc-${WEBKIT_SHA}-${CONFIG_HASH}"

    mkdir -p "${DESTDIR}${PREFIX}/lib" "${DESTDIR}${PREFIX}/include/JavaScriptCore"

    if [ -f "${JSC_CACHE_DIR}/lib/libJavaScriptCore.a" ]; then
      echo "✓ WebKit cache hit for SHA ${WEBKIT_SHA} (Config: ${CONFIG_HASH}). Restoring headers and libraries..."
      cp -a "${JSC_CACHE_DIR}/lib/"* "${DESTDIR}${PREFIX}/lib/" 2>/dev/null || true
      cp -a "${JSC_CACHE_DIR}/include/"* "${DESTDIR}${PREFIX}/include/" 2>/dev/null || true
      tar -czf /tmp/bun-webkit-bionic.tar.gz -C "${JSC_CACHE_DIR}" . 2>/dev/null || true
    else
      echo "⚡ WebKit cache miss. Compiling JavaScriptCore natively for Bionic API 24 with sparse checkout..."
      WK_SRC="/tmp/webkit-src"
      rm -rf "$WK_SRC" 2>/dev/null || true
      mkdir -p "$WK_SRC"
      git init "$WK_SRC"
      git -C "$WK_SRC" remote add origin https://github.com/oven-sh/webkit.git
      git -C "$WK_SRC" config core.sparseCheckout true
      printf "Source/\ncmake/\nCMakeLists.txt\n" > "$WK_SRC/.git/info/sparse-checkout"
      git -C "$WK_SRC" fetch --depth 1 origin "$WEBKIT_SHA"
      git -C "$WK_SRC" checkout FETCH_HEAD

      sed -i '/add_subdirectory(Tools)/d; /add_subdirectory(Source\/ThirdParty\/gtest)/d' "$WK_SRC/CMakeLists.txt" 2>/dev/null || true

      python3 -c "from pathlib import Path; import re; p = Path('/tmp/webkit-src/Source/cmake/OptionsJSCOnly.cmake'); stub = 'add_library(ICU::uc UNKNOWN IMPORTED)\\nset_target_properties(ICU::uc PROPERTIES IMPORTED_LOCATION /usr/lib/aarch64-linux-gnu/libicuuc.so INTERFACE_INCLUDE_DIRECTORIES /tmp/icu-include)\\nadd_library(ICU::i18n UNKNOWN IMPORTED)\\nset_target_properties(ICU::i18n PROPERTIES IMPORTED_LOCATION /usr/lib/aarch64-linux-gnu/libicui18n.so INTERFACE_INCLUDE_DIRECTORIES /tmp/icu-include)\\nadd_library(ICU::data UNKNOWN IMPORTED)\\nset_target_properties(ICU::data PROPERTIES IMPORTED_LOCATION /usr/lib/aarch64-linux-gnu/libicudata.so INTERFACE_INCLUDE_DIRECTORIES /tmp/icu-include)\\nset(ICU_FOUND TRUE)\\nset(ICU_INCLUDE_DIRS /tmp/icu-include)\\nset(ICU_LIBRARIES /usr/lib/aarch64-linux-gnu/libicuuc.so /usr/lib/aarch64-linux-gnu/libicui18n.so /usr/lib/aarch64-linux-gnu/libicudata.so)\\nset(ENABLE_BUN ON CACHE BOOL \"\" FORCE)\\nset(ENABLE_BUN_JSC ON CACHE BOOL \"\" FORCE)\\nset(USE_BUN_JSC_ADDITIONS ON CACHE BOOL \"\" FORCE)\\nset(ENABLE_API_TESTS OFF CACHE BOOL \"\" FORCE)\\nset(BUILD_TESTING OFF CACHE BOOL \"\" FORCE)'; p.exists() and p.write_text(re.sub(r'find_package\\(ICU[^\\)]*\\)', stub, p.read_text()) + '\\nset(ENABLE_BUN ON CACHE BOOL \"\" FORCE)\\nset(ENABLE_BUN_JSC ON CACHE BOOL \"\" FORCE)\\nset(USE_BUN_JSC_ADDITIONS ON CACHE BOOL \"\" FORCE)\\nset(ENABLE_API_TESTS OFF CACHE BOOL \"\" FORCE)\\nset(BUILD_TESTING OFF CACHE BOOL \"\" FORCE)\\n')"
      mkdir -p /tmp/icu-include && ln -sfn /usr/include/unicode /tmp/icu-include/unicode
      mkdir -p "${WK_SRC}/build" && cd "${WK_SRC}/build"
      cmake -G Ninja .. \
        -DCMAKE_TOOLCHAIN_FILE="${NDK:-/opt/android-ndk}/build/cmake/android.toolchain.cmake" \
        -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH \
        -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=BOTH \
        -DANDROID_ABI=arm64-v8a \
        -DANDROID_PLATFORM=android-24 \
        -DCMAKE_SYSTEM_VERSION=24 \
        -DCMAKE_BUILD_TYPE=Release \
        -DPORT=JSCOnly \
        -DENABLE_STATIC_JSC=ON \
        -DENABLE_BUN=ON \
        -DENABLE_BUN_JSC=ON \
        -DUSE_BUN_JSC_ADDITIONS=ON \
        -DDEVELOPER_MODE=OFF \
        -DENABLE_API_TESTS=OFF \
        -DENABLE_TEST_SUPPORT=OFF \
        -DBUILD_TESTING=OFF \
        -DENABLE_SAMPLING_PROFILER=OFF \
        -DENABLE_REMOTE_INSPECTOR=OFF \
        -DENABLE_JIT=ON \
        -DENABLE_DFG_JIT=ON \
        -DENABLE_FTL_JIT=ON \
        -DENABLE_WEBASSEMBLY=ON \
        -DENABLE_C_LOOP=OFF \
        -DCMAKE_C_FLAGS="-O3 -DNDEBUG -D_GNU_SOURCE -D__ANDROID_UNAVAILABLE_SYMBOLS_ARE_WEAK__=1 -fPIC -I/tmp -include /tmp/bionic_stub.h -DENABLE_BUN=1 -DENABLE_BUN_JSC=1 -DBUN_JSC=1 -DBUN_MACOSX=0 -Wno-unsafe-buffer-usage -Wno-unsafe-buffer-usage-in-container -Wno-format -Wno-unused-variable -Wno-unavailable-declarations -Wno-unguarded-availability -Wno-macro-redefined" \
        -DCMAKE_CXX_FLAGS="-O3 -DNDEBUG -D_GNU_SOURCE -D__ANDROID_UNAVAILABLE_SYMBOLS_ARE_WEAK__=1 -fPIC -I/tmp -include /tmp/bionic_stub.h -DENABLE_BUN=1 -DENABLE_BUN_JSC=1 -DBUN_JSC=1 -DBUN_MACOSX=0 -Wno-unsafe-buffer-usage -Wno-unsafe-buffer-usage-in-container -Wno-format -Wno-unused-variable -Wno-undefined-var-template -Wno-unavailable-declarations -Wno-unguarded-availability -Wno-macro-redefined"
      ninja -j4 JavaScriptCore

      python3 -c "import os, pathlib, shutil; jsc = pathlib.Path(os.environ.get('JSC_CACHE_DIR', '/home/builder/RepoExe/.cache/bun-jsc')); wk = pathlib.Path('/tmp/webkit-src'); inc = jsc / 'include'; lib = jsc / 'lib'; inc.mkdir(parents=True, exist_ok=True); lib.mkdir(parents=True, exist_ok=True); [shutil.copy2(f, lib / f.name) for f in (wk / 'build' / 'lib').glob('lib*')]; [(shutil.copytree((hdir / comp if (hdir / comp).exists() else hdir), inc / comp, dirs_exist_ok=True) if hdir.exists() else None) for comp in ('JavaScriptCore', 'WTF', 'bmalloc') for hdir in (wk / 'build' / comp / 'Headers', wk / 'build' / comp / 'PrivateHeaders', wk / 'build' / comp / 'DerivedSources')]; [(lambda c=comp, s=wk / 'Source' / comp: [shutil.copy2(h, (inc / c / h.relative_to(s)).parent.mkdir(parents=True, exist_ok=True) or (inc / c / h.relative_to(s))) for h in s.rglob('*.h')] if s.exists() else None)() for comp in ('JavaScriptCore', 'WTF', 'bmalloc')]"

      cp -a "${JSC_CACHE_DIR}/lib/"* "${DESTDIR}${PREFIX}/lib/" 2>/dev/null || true
      cp -a "${JSC_CACHE_DIR}/include/"* "${DESTDIR}${PREFIX}/include/" 2>/dev/null || true
      tar -czf /tmp/bun-webkit-bionic.tar.gz -C "${JSC_CACHE_DIR}" . 2>/dev/null || true

      cd /home/builder/RepoExe
      rm -rf "$WK_SRC" /tmp/icu-include 2>/dev/null || true
      echo "✓ Reclaimed memory from WebKit build tree"
    fi

  make: |
    set -e
    mkdir -p /home/builder/RepoExe/.cache/zig /tmp/fake-clang
    export ZIG_GLOBAL_CACHE_DIR=/home/builder/RepoExe/.cache/zig
    export ZIG_LOCAL_CACHE_DIR=/tmp/zig-cache

    export WEBKIT_SHA=$(python3 -c "import re, pathlib; p = pathlib.Path; print(next((m.group(1) for f in p('.').rglob('*') if f.suffix in ('.ts', '.js', '.zig', '.cmake', '.txt') and 'node_modules' not in str(f) for m in [re.search(r'(?:webkit[_-]version|webkit_sha|WebKit/releases/download/autobuild-)([0-9a-fA-F]{40})', f.read_text('utf-8', 'ignore'))] if m), '5488984d20e0dbfe4be2c3ba8fb18eb81a5e0e8b'))")
    CMAKE_FLAGS="-DCMAKE_TOOLCHAIN_FILE=${NDK:-/opt/android-ndk}/build/cmake/android.toolchain.cmake -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=BOTH -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 -DCMAKE_SYSTEM_VERSION=24 -DCMAKE_BUILD_TYPE=Release -DPORT=JSCOnly -DENABLE_STATIC_JSC=ON -DENABLE_BUN=ON -DENABLE_BUN_JSC=ON -DUSE_BUN_JSC_ADDITIONS=ON -DDEVELOPER_MODE=OFF -DENABLE_API_TESTS=OFF -DENABLE_TEST_SUPPORT=OFF -DBUILD_TESTING=OFF -DENABLE_SAMPLING_PROFILER=OFF -DENABLE_REMOTE_INSPECTOR=OFF -DENABLE_JIT=ON -DENABLE_DFG_JIT=ON -DENABLE_FTL_JIT=ON -DENABLE_WEBASSEMBLY=ON -DENABLE_C_LOOP=OFF"
    COMPAT_HASH=$(sha256sum /home/builder/RepoExe/scripts/compat/bionic_compat.c /home/builder/RepoExe/scripts/compat/bionic_stub.h 2>/dev/null | sha256sum | head -c 8)
    CONFIG_HASH=$(echo "${CMAKE_FLAGS}-${COMPAT_HASH}-v5" | sha256sum | head -c 8)
    export JSC_CACHE_DIR="/home/builder/RepoExe/.cache/bun-jsc-${WEBKIT_SHA}-${CONFIG_HASH}"
    export SHORT_SHA=$(echo "${WEBKIT_SHA}" | cut -c1-16)

    echo "⚡ Pre-seeding Bun WebKit cache (${SHORT_SHA}) with native Bionic JavaScriptCore..."
    python3 -c "import glob, os, pathlib, shutil; jsc = pathlib.Path(os.environ.get('JSC_CACHE_DIR', '/home/builder/RepoExe/.cache/bun-jsc')); short_sha = os.environ.get('SHORT_SHA', ''); full_sha = os.environ.get('WEBKIT_SHA', ''); [(lambda d=pathlib.Path(base) / name: [d.mkdir(parents=True, exist_ok=True), shutil.copytree(jsc / 'lib', d / 'lib', dirs_exist_ok=True) if (jsc / 'lib').exists() else None, shutil.copytree(jsc / 'include', d / 'include', dirs_exist_ok=True) if (jsc / 'include').exists() else None])() for base in ('build/release/cache', 'build/cache', 'build/release/deps', 'build/deps') for name in (f'webkit-{short_sha}-arm64', f'webkit-{full_sha}-arm64', f'webkit-{short_sha}-linux-arm64', f'webkit-{short_sha}-android-arm64', f'webkit-{short_sha}', f'webkit-{full_sha}')]"

    python3 -c "import glob, os, pathlib, re
    ndk = os.environ.get('NDK', '/opt/android-ndk')
    sysroots = [p for p in glob.glob(f'{ndk}/**/sysroot', recursive=True) if os.path.isdir(os.path.join(p, 'usr', 'include'))]
    sysroot = sysroots[0] if sysroots else f'{ndk}/toolchains/llvm/prebuilt/linux-arm64/sysroot'
    print(f'🔒 Resolved NDK sysroot: {sysroot}')

    for d in ('/tmp', '/tmp/fake-clang'):
        os.makedirs(d, exist_ok=True)
        pathlib.Path(f'{d}/android_lf.h').write_text('#pragma once\n#include <sys/types.h>\n')
        pathlib.Path(f'{d}/spawn.h').write_text('#pragma once\n#include \"/tmp/bionic_stub.h\"\n')

    cfg_h = '#pragma once\n#define HAVE_STDINT_H 1\n#define HAVE_INTTYPES_H 1\n#define HAVE_SYS_PARAM_H 1\n#define HAVE_SYS_TIME_H 1\n#define HAVE_SYS_MMAN_H 1\n#define WTF_OS_LINUX 1\n#define WTF_OS_ANDROID 1\n#define JSC_OBJC_API_ENABLED 0\n#define STATICALLY_LINKED_WITH_JavaScriptCore 1\n#define STATICALLY_LINKED_WITH_BMALLOC 1\n'

    for d in list(pathlib.Path('.').rglob('include')) + list(pathlib.Path('.').rglob('JavaScriptCore')) + [pathlib.Path('/tmp'), pathlib.Path('/tmp/fake-clang'), pathlib.Path('src/jsc/bindings'), pathlib.Path('src/jsc/bindings/webcore')]:
        if d.is_dir():
            (d / 'cmakeconfig.h').write_text(cfg_h, encoding='utf-8')

    shim = '#!/bin/bash\ncmd=\"$(basename \"$0\")\"\nif [[ \"$*\" == *\"codegen-tool\"* ]] || [[ \"$*\" == *\"-DC2STR\"* ]] || [[ \"$*\" == *\"conftest.c\"* ]]; then\n  exec \"/usr/bin/$cmd\" \"$@\"\nfi\nNDK_BIN=\"${NDK:-/opt/android-ndk}/toolchains/llvm/prebuilt/linux-arm64/bin\"\n[ -d \"$NDK_BIN\" ] || NDK_BIN=$(find \"${NDK:-/opt/android-ndk}\" -type f -name \"clang\" -exec dirname {} \\; 2>/dev/null | head -n 1)\nif [[ \"$1\" =~ ^(-v|--version|-version)$ ]]; then\n  [[ \"$cmd\" =~ lld$ ]] && echo \"LLD 21.1.0\" || echo \"Ubuntu clang version 21.1.0-repoexe\"\n  exit 0\nfi\nARGS=()\nIS_COMPILE=0\nIS_ASM=0\nfor a in \"$@\"; do\n  case \"$a\" in\n    -Werror|-Werror=*) ;;\n    -c|-E|-S) IS_COMPILE=1; ARGS+=(\"$a\") ;;\n    *.s|*.S) IS_ASM=1; ARGS+=(\"$a\") ;;\n    -fno-pic|-fno-PIC|-fno-pie|-fno-PIE) ARGS+=(\"-fPIC\" \"-fPIE\") ;;\n    -Wl,-no-pie|-Wl,-nopie|-no-pie|-nopie) ARGS+=(\"-pie\") ;;\n    *) ARGS+=(\"$a\") ;;\n  esac\ndone\nEXTRA=\"\"\nif [ \"$IS_COMPILE\" = \"0\" ] && [ -f /tmp/bionic_compat.o ]; then\n  EXTRA=\"/tmp/bionic_compat.o -L/tmp -lbionic_compat\"\nfi\nINC_FLAG=\"\"\nif [ \"$IS_ASM\" = \"0\" ]; then\n  INC_FLAG=\"-I/tmp -include /tmp/bionic_stub.h\"\nfi\nif [[ \"$cmd\" =~ ^clang ]]; then\n  exec \"$NDK_BIN/$cmd\" \"${ARGS[@]}\" --target=aarch64-linux-android24 $INC_FLAG -Wno-error -Wno-undefined-var-template -Wno-dangling -Wno-unknown-warning-option -Wno-unsafe-buffer-usage -Wno-unsafe-buffer-usage-in-container $EXTRA\nelif [[ \"$cmd\" =~ lld$ ]]; then\n  exec \"$NDK_BIN/$cmd\" \"${ARGS[@]}\" $EXTRA\nelse\n  exec \"$NDK_BIN/$cmd\" \"${ARGS[@]}\"\nfi\n'
    shim_p = pathlib.Path('/tmp/fake-clang/version_shim')
    shim_p.write_text(shim)
    shim_p.chmod(0o755)

    for f in pathlib.Path('.').rglob('*'):
        if f.is_file() and f.suffix in ('.ts', '.js', '.zig', '.cmake', '.json', '.h', '.c', '.cpp') and 'node_modules' not in str(f):
            try:
                t = f.read_text('utf-8', 'ignore')
                n = t
                if '#include \"android_lf.h\"' in n:
                    n = n.replace('#include \"android_lf.h\"', '/* #include \"android_lf.h\" */')
                if 'alloc-override.c' in f.name or 'mimalloc' in str(f):
                    n = re.sub(r'void\*\s*reallocarray\s*\([^)]*\)\s*\{[^}]*\}', '/* void* reallocarray disabled */', n)
                n = re.sub(r'aarch64-linux-gnu(?:\.[0-9\.]+)?', 'aarch64-linux-android', n)
                n = re.sub(r'linux-aarch64-gnu(?:\.[0-9\.]+)?', 'linux-aarch64-android', n)
                n = re.sub(r'\"linux-aarch64-gnu\"', '\"linux-aarch64-android\"', n)
                n = re.sub(r\"'linux-aarch64-gnu'\", \"'linux-aarch64-android'\", n)
                n = re.sub(r'[`\"]https://github\.com/oven-sh/WebKit/releases/download/[^`\"]*[`\"]', '\"file:///tmp/bun-webkit-bionic.tar.gz\"', n)
                if '-Dtarget=aarch64-linux-gnu' in n:
                    n = n.replace('-Dtarget=aarch64-linux-gnu', f'-Dtarget=aarch64-linux-android -Dandroid_ndk_sysroot={sysroot}')
                if '-Dtarget=aarch64-linux-android' in n and '-Dandroid_ndk_sysroot' not in n:
                    n = n.replace('-Dtarget=aarch64-linux-android', f'-Dtarget=aarch64-linux-android -Dandroid_ndk_sysroot={sysroot}')
                if n != t:
                    f.write_text(n, 'utf-8')
            except Exception:
                pass

    stub = 'extern \"c\" fn system(command: [*:0]const u8) c_int;\npub fn exec(ctx: anytype) !void {\n    @branchHint(.cold);\n    _ = ctx;\n    _ = system(\"pkg install -y bun || apt-get install --only-upgrade -y bun || pacman -Sy --noconfirm bun || apk add --upgrade bun\");\n    return;\n}\n'
    for f in glob.glob('src/**/upgrade*.zig', recursive=True):
        try:
            s = open(f, 'r').read()
            idx = s.find('pub fn exec(')
            if idx != -1:
                b = s.find('{', idx)
                depth, i = 0, b
                while i < len(s):
                    if s[i] == '{': depth += 1
                    elif s[i] == '}':
                        depth -= 1
                        if depth == 0: break
                    i += 1
                open(f, 'w').write(s[:idx] + stub + s[i+1:])
                print(f'✓ Patched upgrade exec in {f}')
        except Exception:
            pass
    "

    mkdir -p build/release/stamps build/stamps
    touch build/release/stamps/webkit build/stamps/webkit 2>/dev/null || true

    ln -sfn /tmp/fake-clang/version_shim /tmp/fake-clang/clang
    ln -sfn /tmp/fake-clang/version_shim /tmp/fake-clang/clang++
    ln -sfn /tmp/fake-clang/version_shim /tmp/fake-clang/ld.lld
    ln -sfn /tmp/fake-clang/version_shim /tmp/fake-clang/lld

    export PATH="/tmp/fake-clang:$HOME/.bun/bin:${PATH}"
    export CC="/tmp/fake-clang/clang"
    export CXX="/tmp/fake-clang/clang++"
    export LD="/tmp/fake-clang/ld.lld"

    export CFLAGS="${CFLAGS:-} -O3 -DNDEBUG -D_GNU_SOURCE -fPIC -fPIE -I/tmp -include /tmp/bionic_stub.h"
    export CXXFLAGS="${CXXFLAGS:-} -O3 -DNDEBUG -D_GNU_SOURCE -fPIC -fPIE -I/tmp -include /tmp/bionic_stub.h"
    export LDFLAGS="${LDFLAGS:-} -pie -fuse-ld=lld -Wl,--allow-multiple-definition -Wl,-z,max-page-size=16384 -Wl,-z,relro -Wl,-z,now -landroid-support -landroid-exec -llog -lm /tmp/bionic_compat.o -L/tmp -lbionic_compat"

    find . -type f \( -name "*.ts" -o -name "*.js" -o -name "*.zig" -o -name "*.cmake" -o -name "CMakeLists.txt" \) -exec sed -i 's/-fno-pic/-fPIC/g; s/-Wl,-no-pie/-Wl,-pie/g; s/-no-pie/-pie/g' {} + 2>/dev/null || true

    echo "⚡ Disabling host smoke-test in Bun build scripts for Bionic target..."
    find scripts -type f \( -name "*.ts" -o -name "*.js" \) -exec sed -i 's/env BUN_DEBUG_QUIET_LOGS=1/true || env BUN_DEBUG_QUIET_LOGS=1/g' {} + 2>/dev/null || true

    export BUN_VERSION="${VERSION:-1.3.14}"
    export BUN_RELEASE=1
    export BUN_CANARY=0
    export BUN_TAG="bun-v${VERSION:-1.3.14}"
    unset JSC_CACHE_DIR
    bun scripts/build.ts --profile=release --ci=true

  install: |
    mkdir -p "${DESTDIR}${PREFIX}/bin"
    BUN_BIN=$(find build -type f \( -name "bun" -o -name "bun-profile" \) -executable 2>/dev/null | grep -v "node_modules" | head -n 1)
    [ -z "$BUN_BIN" ] && BUN_BIN=$(find . -type f \( -name "bun" -o -name "bun-profile" \) -executable 2>/dev/null | grep -v "node_modules" | head -n 1)
    if [ -n "$BUN_BIN" ]; then
      install -Dm755 "$BUN_BIN" "${DESTDIR}${PREFIX}/bin/bun"
    else
      echo "::error::bun executable binary not found after build!"
      exit 1
    fi

  test: |
    bun --version
    bun -e "console.log('Arch/Platform:', process.arch, process.platform)"
    bun -e "let x=0; for(let i=0;i<1e5;i++) x+=i; console.log('JIT Loop OK:', x)"
    bun -e "import crypto from 'node:crypto'; console.log('BoringSSL UUID:', crypto.randomUUID())"
    bun -e "import { Database } from 'bun:sqlite'; const db = new Database(':memory:'); db.run('CREATE TABLE t(x);'); console.log('SQLite OK')"
    bun -e "import { spawnSync } from 'node:child_process'; const p = spawnSync('echo', ['Bionic spawn OK']); console.log(p.stdout.toString().trim())"
    bun -e "import { xxhash64 } from 'bun'; console.log('xxhash:', xxhash64('android'))"

vars:
  RUSTC_BOOTSTRAP: "1"
