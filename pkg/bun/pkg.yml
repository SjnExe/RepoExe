name: bun
version: "1.4.0"
revision: 0
arch: aarch64
description: Incredibly fast JavaScript runtime, bundler, test runner, and package manager
homepage: https://bun.sh
license: MIT
maintainer: SjnExe
build_system: custom

formats:
  - apt
  - pacman
  - apk

channels:
  latest:
    auto_update: true
    update_strategy: github_release
    source_url: https://github.com/oven-sh/bun/releases/download/bun-v{version}/bun-linux-aarch64-android.zip

phases:
  install: |
    mkdir -p "${DESTDIR}${PREFIX}/bin"
    BUN_BIN=$(find . -name bun -type f | head -n 1)
    if [ -n "$BUN_BIN" ]; then
      chmod +x "$BUN_BIN"
      install -Dm755 "$BUN_BIN" "${DESTDIR}${PREFIX}/bin/bun"
    else
      echo "::error::bun executable not found in release archive"
      exit 1
    fi
  test: |
    bun --version
    bun -e "console.log('Arch:', process.arch, 'Platform:', process.platform)"
