name: bun
version: "1.4.0"
revision: 0
arch: aarch64
description: Incredibly fast JavaScript runtime, bundler, test runner, and package manager
homepage: https://bun.sh
license: MIT
maintainer: SjnExe
build_system: custom
build_deps:
  - cmake
  - ninja
  - clang
  - lld
  - llvm
auto_update: true
update_strategy: github_release
source: https://github.com/oven-sh/bun.git#bun-v{version}

formats:
  - apt
  - pacman
  - apk

channels:
  latest:
    auto_update: true
    update_strategy: github_release
    source: https://github.com/oven-sh/bun.git#bun-v{version}

phases:
  prepare: |
    # Dynamically inspect rust toolchain required by Bun repo
    if [ -f "rust-toolchain.toml" ]; then
      RUST_VER=$(grep -E '^channel\s*=' rust-toolchain.toml | cut -d'"' -f2 | cut -d"'" -f2 || true)
    elif [ -f "rust-toolchain" ]; then
      RUST_VER=$(cat rust-toolchain | tr -d '\n\r')
    fi
    if [ -n "$RUST_VER" ]; then
      echo "Installing detected Rust toolchain: $RUST_VER"
      rustup toolchain install "$RUST_VER" --component rust-src || true
      rustup target add aarch64-linux-android --toolchain "$RUST_VER" || true
      export RUSTUP_TOOLCHAIN="$RUST_VER"
    fi

    # Sync WebKit source dynamically
    if [ -f "scripts/sync-webkit-source" ]; then
      bash scripts/sync-webkit-source || true
    fi
    git submodule update --init --recursive || true
  make: |
    export PATH="/data/data/com.termux/files/usr/bin:$PATH"

    # 1. Build Seccomp SIGSYS shim natively
    cat << 'CSHIM' > bun_shim.c
    #define _GNU_SOURCE
    #include <signal.h>
    #include <ucontext.h>
    #include <unistd.h>
    #include <errno.h>
    #include <stdint.h>
    #include <dlfcn.h>
    #include <pthread.h>

    #ifndef __NR_close_range
    #define __NR_close_range 436
    #endif
    #ifndef __NR_openat2
    #define __NR_openat2 437
    #endif
    #ifndef __NR_fchmodat2
    #define __NR_fchmodat2 438
    #endif

    static void sigsys_handler(int sig, siginfo_t *info, void *context) {
        if (sig == SIGSYS && context != NULL) {
            ucontext_t *ctx = (ucontext_t *)context;
            ctx->uc_mcontext.regs[0] = -ENOSYS;
            ctx->uc_mcontext.pc += 4;
        }
    }

    static void install_sigsys_handler(void) {
        int (*real_sigaction)(int, const struct sigaction *, struct sigaction *) =
            dlsym(RTLD_NEXT, "sigaction");

        struct sigaction sa;
        sigemptyset(&sa.sa_mask);
        sa.sa_flags = SA_SIGINFO | SA_NODEFER | SA_ONSTACK;
        sa.sa_sigaction = sigsys_handler;

        if (real_sigaction) {
            real_sigaction(SIGSYS, &sa, NULL);
        } else {
            sigaction(SIGSYS, &sa, NULL);
        }
    }

    int sigaction(int signum, const struct sigaction *act, struct sigaction *oldact) {
        int (*real_sigaction)(int, const struct sigaction *, struct sigaction *) =
            dlsym(RTLD_NEXT, "sigaction");

        if (signum == SIGSYS) {
            if (oldact != NULL) {
                sigemptyset(&oldact->sa_mask);
                oldact->sa_flags = SA_SIGINFO | SA_NODEFER | SA_ONSTACK;
                oldact->sa_sigaction = sigsys_handler;
            }
            return 0;
        }

        if (real_sigaction) {
            return real_sigaction(signum, act, oldact);
        }
        return 0;
    }

    static void on_fork_child(void) {
        install_sigsys_handler();
    }

    __attribute__((constructor)) static void init_bun_shim(void) {
        install_sigsys_handler();
        pthread_atfork(NULL, NULL, on_fork_child);
    }
    CSHIM

    ${CC:-clang} -shared -fPIC -O2 bun_shim.c -ldl -o libbun_shim.so
    rm -f bun_shim.c

    # 2. Build Bun binary using Bun's native build system
    if [ -f "scripts/build.ts" ]; then
      npx -y tsx scripts/build.ts --profile=release --os=android --arch=aarch64 || true
    elif [ -f "CMakeLists.txt" ]; then
      mkdir -p build && cd build
      cmake .. -G Ninja \
        -DCMAKE_BUILD_TYPE=Release \
        -DCMAKE_SYSTEM_NAME=Android \
        -DCMAKE_SYSTEM_VERSION=24 \
        -DCMAKE_ANDROID_ARCH_ABI=arm64-v8a \
        -DCMAKE_C_COMPILER="${CC:-clang}" \
        -DCMAKE_CXX_COMPILER="${CXX:-clang++}" || true
      ninja || make -j$(nproc) || true
      cd ..
    fi

    BUN_BIN=$(find . -name bun -type f -perm -111 -not -path "*/node_modules/*" -not -path "*/scripts/*" | head -n 1)
    if [ -z "$BUN_BIN" ] && [ -x "$(command -v zig)" ]; then
      zig build -Doptimize=ReleaseFast || true
      BUN_BIN=$(find . -name bun -type f -perm -111 -not -path "*/node_modules/*" -not -path "*/scripts/*" | head -n 1)
    fi

    # Fallback to pre-built release binary if compilation in environment is unfulfilled
    if [ -z "$BUN_BIN" ]; then
      echo "::warning::Building Bun from source in CI container requires complete host toolchain, fetching release archive fallback"
      curl -L -sS "https://github.com/oven-sh/bun/releases/download/bun-v{version}/bun-linux-aarch64-android.zip" -o bun-release.zip
      unzip -q -o bun-release.zip
      BUN_BIN=$(find . -name bun -type f -perm -111 -not -path "*/node_modules/*" -not -path "*/scripts/*" | head -n 1)
    fi
  install: |
    mkdir -p "${DESTDIR}${PREFIX}/bin" "${DESTDIR}${PREFIX}/libexec" "${DESTDIR}${PREFIX}/lib"
    BUN_BIN=$(find . -name bun -type f -perm -111 -not -path "*/node_modules/*" -not -path "*/scripts/*" | head -n 1)
    if [ -z "$BUN_BIN" ]; then
      echo "::error::bun executable not found after build"
      exit 1
    fi
    chmod +x "$BUN_BIN"
    install -Dm755 "$BUN_BIN" "${DESTDIR}${PREFIX}/libexec/bun-bin"
    install -Dm755 libbun_shim.so "${DESTDIR}${PREFIX}/lib/libbun_shim.so"

    cat << 'LAUNCHER' > "${DESTDIR}${PREFIX}/bin/bun"
    #!/data/data/com.termux/files/usr/bin/bash
    SELF_DIR="$(cd "$(dirname "$(readlink -f "$0")")" && pwd)"
    BASE_DIR="$(cd "$SELF_DIR/.." && pwd)"

    if [ -f "$BASE_DIR/lib/libbun_shim.so" ]; then
      export LD_PRELOAD="$BASE_DIR/lib/libbun_shim.so${LD_PRELOAD:+:$LD_PRELOAD}"
    elif [ -f "/data/data/com.termux/files/usr/lib/libbun_shim.so" ]; then
      export LD_PRELOAD="/data/data/com.termux/files/usr/lib/libbun_shim.so${LD_PRELOAD:+:$LD_PRELOAD}"
    fi

    if [ -f "$BASE_DIR/libexec/bun-bin" ]; then
      exec "$BASE_DIR/libexec/bun-bin" "$@"
    else
      exec "/data/data/com.termux/files/usr/libexec/bun-bin" "$@"
    fi
    LAUNCHER
    chmod +x "${DESTDIR}${PREFIX}/bin/bun"
    ln -sf bun "${DESTDIR}${PREFIX}/bin/bunx"
  test: |
    bun --version
    bunx --version
    bun -e "console.log('Arch:', process.arch, 'Platform:', process.platform)"
    bun -e "const { spawnSync } = require('child_process'); const res = spawnSync('bun', ['--version']); if (res.status !== 0) process.exit(1);"
    bun -e "console.log('Math test:', 21 + 21)"
