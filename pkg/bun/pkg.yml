name: bun
version: "1.4.0"
revision: 0
arch: aarch64
description: Incredibly fast JavaScript runtime, bundler, test runner, and package manager
homepage: https://bun.sh
license: MIT
maintainer: SjnExe
build_system: custom
build_deps:
  - cmake
  - ninja
  - clang
  - lld
  - llvm
auto_update: true
update_strategy: github_release
source: https://github.com/oven-sh/bun.git#bun-v{version}

formats:
  - apt
  - pacman
  - apk

channels:
  latest:
    auto_update: true
    update_strategy: github_release
    source: https://github.com/oven-sh/bun.git#bun-v{version}

phases:
  prepare: |
    # 1. Ensure host LLVM 21, nasm, and host Bun runner are installed
    if ! command -v clang-21 >/dev/null 2>&1; then
      curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null || true
      echo "deb https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm.list
      sudo apt-get update -qq || true
      sudo apt-get install -yq clang-21 lld-21 llvm-21 nasm || true
    fi

    HOST_ARCH="$(uname -m)"
    if [ "$HOST_ARCH" = "aarch64" ] || [ "$HOST_ARCH" = "arm64" ]; then
      BUN_ARCH="aarch64"
    else
      BUN_ARCH="x64"
    fi
    mkdir -p /tmp/host-bun
    curl -fsSL "https://github.com/oven-sh/bun/releases/download/bun-v1.4.0/bun-linux-${BUN_ARCH}.zip" -o /tmp/host-bun/bun.zip
    unzip -q -o /tmp/host-bun/bun.zip -d /tmp/host-bun
    mv /tmp/host-bun/bun-linux-${BUN_ARCH}/bun /tmp/host-bun/bun 2>/dev/null || true
    chmod +x /tmp/host-bun/bun
    export PATH="/tmp/host-bun:$PATH"

    # 2. Fix NDK prebuilt directory symlinks for Bun build system & host LLVM 21 compiler-rt
    if [ -d "${NDK:-/opt/android-ndk}" ]; then
      NDK_PATH="${NDK:-/opt/android-ndk}"
      PREBUILT_DIR=$(ls "${NDK_PATH}/toolchains/llvm/prebuilt" 2>/dev/null | head -n1 || true)
      if [ -n "$PREBUILT_DIR" ]; then
        sudo ln -sf "${NDK_PATH}/toolchains/llvm/prebuilt/${PREBUILT_DIR}" "${NDK_PATH}/toolchains/llvm/prebuilt/linux-x86_64" 2>/dev/null || true
        sudo ln -sf "${NDK_PATH}/toolchains/llvm/prebuilt/${PREBUILT_DIR}" "${NDK_PATH}/toolchains/llvm/prebuilt/linux-aarch64" 2>/dev/null || true

        BUILTINS_A=$(find "${NDK_PATH}" -name "libclang_rt.builtins-aarch64-android.a" 2>/dev/null | head -n1 || true)
        LIBUNWIND_A=$(find "${NDK_PATH}" -name "libunwind.a" 2>/dev/null | grep -i "aarch64" | head -n1 || true)

        if [ -n "$BUILTINS_A" ] && [ -d "/usr/lib/llvm-21" ]; then
          sudo mkdir -p "/usr/lib/llvm-21/lib/clang/21/lib/aarch64-unknown-linux-android28"
          sudo mkdir -p "/usr/lib/llvm-21/lib/clang/21/lib/linux/aarch64"
          sudo ln -sf "$BUILTINS_A" "/usr/lib/llvm-21/lib/clang/21/lib/aarch64-unknown-linux-android28/libclang_rt.builtins.a"
          sudo ln -sf "$BUILTINS_A" "/usr/lib/llvm-21/lib/clang/21/lib/linux/libclang_rt.builtins-aarch64-android.a"
          if [ -n "$LIBUNWIND_A" ]; then
            sudo ln -sf "$LIBUNWIND_A" "/usr/lib/llvm-21/lib/clang/21/lib/aarch64-unknown-linux-android28/libunwind.a"
            sudo ln -sf "$LIBUNWIND_A" "/usr/lib/llvm-21/lib/clang/21/lib/linux/aarch64/libunwind.a"
          fi
        fi
      fi
    fi

    # 3. Dynamically inspect Rust toolchain required by Bun repo
    if [ -f "rust-toolchain.toml" ]; then
      RUST_VER=$(grep -E '^channel\s*=' rust-toolchain.toml | cut -d'"' -f2 | cut -d"'" -f2 || true)
    elif [ -f "rust-toolchain" ]; then
      RUST_VER=$(cat rust-toolchain | tr -d '\n\r')
    fi
    if [ -n "$RUST_VER" ]; then
      echo "Installing detected Rust toolchain: $RUST_VER"
      rustup toolchain install "$RUST_VER" --component rust-src || true
      rustup target add aarch64-linux-android --toolchain "$RUST_VER" || true
      export RUSTUP_TOOLCHAIN="$RUST_VER"
    fi

    # 4. Sync WebKit source dynamically
    git submodule update --init --recursive || true
    if [ -f "scripts/sync-webkit-source" ]; then
      bash scripts/sync-webkit-source || true
    fi
  make: |
    export PATH="/tmp/host-bun:$PATH"
    export ANDROID_NDK_ROOT="${NDK:-/opt/android-ndk}"

    if [ -f "scripts/build.ts" ]; then
      bun scripts/build.ts --profile=android-release
    elif [ -f "CMakeLists.txt" ]; then
      mkdir -p build && cd build
      cmake .. -G Ninja \
        -DCMAKE_BUILD_TYPE=Release \
        -DCMAKE_SYSTEM_NAME=Android \
        -DCMAKE_SYSTEM_VERSION=24 \
        -DCMAKE_ANDROID_ARCH_ABI=arm64-v8a \
        -DCMAKE_C_COMPILER="${CC:-clang}" \
        -DCMAKE_CXX_COMPILER="${CXX:-clang++}"
      ninja || make -j$(nproc)
      cd ..
    elif [ -x "$(command -v zig)" ]; then
      zig build -Doptimize=ReleaseFast
    fi
  install: |
    mkdir -p "${DESTDIR}${PREFIX}/bin"
    BUN_BIN=$(find . -name bun -type f -perm -111 -not -path "*/node_modules/*" -not -path "*/scripts/*" | head -n 1)
    if [ -z "$BUN_BIN" ]; then
      echo "::error::bun executable not found after build"
      exit 1
    fi
    chmod +x "$BUN_BIN"

    STRIP_TOOL=""
    if [ -d "${NDK:-/opt/android-ndk}" ]; then
      STRIP_TOOL=$(find "${NDK:-/opt/android-ndk}" -name "llvm-strip" 2>/dev/null | head -n 1 || true)
    fi
    if [ -z "$STRIP_TOOL" ]; then
      STRIP_TOOL="$(command -v llvm-strip || command -v aarch64-linux-gnu-strip || command -v strip || echo "")"
    fi

    if [ -n "$STRIP_TOOL" ]; then
      echo "Stripping debug symbols from $BUN_BIN using $STRIP_TOOL..."
      "$STRIP_TOOL" --strip-all --strip-debug --discard-all --remove-section=.comment --remove-section=.note "$BUN_BIN" || "$STRIP_TOOL" --strip-all "$BUN_BIN" || "$STRIP_TOOL" "$BUN_BIN" || true
    fi

    install -Dm755 "$BUN_BIN" "${DESTDIR}${PREFIX}/bin/bun"
    ln -sf bun "${DESTDIR}${PREFIX}/bin/bunx"

    if [ -n "$STRIP_TOOL" ]; then
      echo "Stripping installed binary ${DESTDIR}${PREFIX}/bin/bun..."
      "$STRIP_TOOL" --strip-all --strip-debug --discard-all --remove-section=.comment --remove-section=.note "${DESTDIR}${PREFIX}/bin/bun" || "$STRIP_TOOL" --strip-all "${DESTDIR}${PREFIX}/bin/bun" || "$STRIP_TOOL" "${DESTDIR}${PREFIX}/bin/bun" || true
    fi
  test: |
    bun --version
    bunx --version
    bun -e "console.log('Arch:', process.arch, 'Platform:', process.platform)"
    bun -e "const { spawnSync } = require('child_process'); const res = spawnSync('bun', ['--version']); if (res.status !== 0) process.exit(1);"
    bun -e "console.log('Math test:', 21 + 21)"
    bun -e "
      const path = '/tmp/bun_test_file.txt';
      await Bun.write(path, 'Hello Termux!');
      const content = await Bun.file(path).text();
      if (content !== 'Hello Termux!') process.exit(1);
      console.log('File I/O test passed:', content);
    "
    bun -e "
      import { Database } from 'bun:sqlite';
      const db = new Database(':memory:');
      db.query('CREATE TABLE foo (bar TEXT)').run();
      db.query('INSERT INTO foo VALUES (?)').run('hello');
      const row = db.query('SELECT * FROM foo').get();
      if (row.bar !== 'hello') process.exit(1);
      console.log('SQLite test passed:', row);
    "
    bun -e "
      const server = Bun.serve({
        port: 0,
        fetch(req) {
          return new Response('Hello from Bun HTTP!');
        },
      });
      const res = await fetch(\`http://\${server.hostname}:\${server.port}\`);
      const text = await res.text();
      server.stop();
      if (text !== 'Hello from Bun HTTP!') process.exit(1);
      console.log('HTTP Server & Fetch test passed:', text);
    "
