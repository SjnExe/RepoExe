name: bun-jsc
version: "1.3.14"
revision: 0
architecture: aarch64
description: Custom JavaScriptCore WebKit engine compiled specifically for Bun
license: LGPL-2.1
homepage: https://github.com/oven-sh/webkit
maintainer: SjnExe
build_system: custom

source_url: https://github.com/oven-sh/webkit.git

resources:
  zram: 24
  swap: 10
  free_space: true

vars:
  NINJA_JOBS: "2"
  CFLAGS: "-O2 -g0"
  CXXFLAGS: "-O2 -g0"
  LDFLAGS: "-fuse-ld=lld -Wl,--thread-count=2 -Wl,-z,max-page-size=65536"

formats:
  - apt
  - pacman
  - apk

phases:
  prepare: |
    if ! command -v cmake >/dev/null 2>&1 || ! command -v ninja >/dev/null 2>&1; then
      sudo apt-get update && sudo apt-get install -y cmake ninja-build ruby ruby-full
    fi
  configure: |
    cmake -B build -G Ninja \
      -DCMAKE_BUILD_TYPE=Release \
      -DCMAKE_INSTALL_PREFIX="${PREFIX}" \
      -DPORT=JSCOnly \
      -DENABLE_STATIC_JSC=ON \
      -DENABLE_C_LOOP=OFF
  make: |
    cmake --build build -j2
  install: |
    DESTDIR="${DESTDIR}" cmake --install build
