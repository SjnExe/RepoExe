name: bun-jsc
version: "1.3.14"
revision: 0
architecture: aarch64
description: Custom JavaScriptCore WebKit engine compiled specifically for Bun
license: LGPL-2.1
homepage: https://github.com/oven-sh/webkit
maintainer: SjnExe
build_system: custom
auto_update: false

source_url: https://github.com/oven-sh/webkit.git

resources:
  zram: 24
  swap: 10
  free_space: true

vars:
  NINJA_JOBS: "4"
  CFLAGS: "-O2 -g0 -pipe -Wno-undef -Wno-format -Wno-format-truncation"
  CXXFLAGS: "-O2 -g0 -pipe -Wno-undef -Wno-format -Wno-format-truncation"
  LDFLAGS: "-fuse-ld=lld -Wl,--thread-count=4 -Wl,-z,max-page-size=65536"

formats:
  - apt
  - pacman
  - apk

phases:
  prepare: |
    sudo apt-get update && sudo apt-get install -y cmake ninja-build ruby-full gperf bison flex libicu-dev lld
    echo "⚡ Fetching and checking out pinned WebKit commit (512b0afff969a81c97dd02524d1438c95114089f)..."
    git fetch --depth 1 origin 512b0afff969a81c97dd02524d1438c95114089f || git fetch origin 512b0afff969a81c97dd02524d1438c95114089f
    git checkout -f 512b0afff969a81c97dd02524d1438c95114089f

  configure: |
    cmake -B build -G Ninja \
      -DCMAKE_BUILD_TYPE=Release \
      -DCMAKE_INSTALL_PREFIX="${PREFIX}" \
      -DPORT=JSCOnly \
      -DENABLE_STATIC_JSC=ON \
      -DENABLE_C_LOOP=OFF \
      -DUSE_BUN_JSC_ADDITIONS=ON \
      -DUSE_BUN_EVENT_LOOP=OFF \
      -DENABLE_BUN_SKIP_FAILING_ASSERTIONS=ON \
      -DALLOW_LINE_AND_COLUMN_NUMBER_IN_BUILTINS=ON \
      -DENABLE_REMOTE_INSPECTOR=ON \
      -DENABLE_MEDIA_SOURCE=OFF \
      -DENABLE_MEDIA_STREAM=OFF \
      -DENABLE_WEB_RTC=OFF \
      -DENABLE_TOOLS=OFF \
      -DENABLE_TESTS=OFF \
      -DENABLE_API_TESTS=OFF \
      -DENABLE_GTEST=OFF \
      -DBUILD_TESTING=OFF
  make: |
    cmake --build build -j4
  install: |
    DESTDIR="${DESTDIR}" cmake --install build
