name: bun-jsc
version: 1.3.14
channel: latest
description: JavaScriptCore engine compiled specifically for Bun
homepage: https://github.com/oven-sh/webkit
license: LGPL-2.1
build_system: custom

update_strategy: github_tag
source_url: https://github.com/oven-sh/webkit.git

vars:
  NINJA_JOBS: "4"

phases:
  prepare: |
    echo "⚡ Preparing WebKit build environment..."
    sudo apt-get update && sudo apt-get install -y cmake ninja-build pkg-config build-essential libssl-dev ruby ruby-dev bison flex gperf libicu-dev lld
    
    # Exact WebKit commit pinned by Bun v1.3.14 in scripts/build/deps/webkit.ts
    WEBKIT_SHA="5488984d20e0dbfe4be2c3ba8fb18eb81a5e0e8b"
    echo "⚡ Performing shallow fetch for WebKit commit ${WEBKIT_SHA}..."
    git fetch --depth 1 origin "${WEBKIT_SHA}" || git fetch origin "${WEBKIT_SHA}"
    git checkout -f "${WEBKIT_SHA}"

  make: |
    echo "⚡ Compiling JavaScriptCore for Bun..."
    mkdir -p build && cd build
    cmake -G Ninja .. \
      -DCMAKE_BUILD_TYPE=Release \
      -DPORT=JSCOnly \
      -DENABLE_STATIC_JSC=ON \
      -DENABLE_SAMPLING_PROFILER=OFF
    ninja -j"${NINJA_JOBS}" jsc

  install: |
    mkdir -p "${DESTDIR}/usr/lib" "${DESTDIR}/usr/include/JavaScriptCore"
    cp -a build/lib/lib* "${DESTDIR}/usr/lib/" 2>/dev/null || true
    cp -a Source/JavaScriptCore/API/*.h "${DESTDIR}/usr/include/JavaScriptCore/" 2>/dev/null || true

  test: |
    ./build/bin/jsc --help || true
