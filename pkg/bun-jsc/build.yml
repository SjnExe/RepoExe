name: bun-jsc
version: "1.3.14"
revision: 0
architecture: aarch64
description: Custom JavaScriptCore WebKit engine compiled specifically for Bun
license: LGPL-2.1
homepage: https://github.com/oven-sh/webkit
maintainer: SjnExe
build_system: custom
auto_update: false

source_url: https://github.com/oven-sh/webkit.git

resources:
  zram: 24
  swap: 10
  free_space: true

vars:
  NINJA_JOBS: "4"
  CFLAGS: "-O2 -g0 -pipe -Wno-undef -Wno-format -Wno-format-truncation"
  CXXFLAGS: "-O2 -g0 -pipe -Wno-undef -Wno-format -Wno-format-truncation"
  LDFLAGS: "-fuse-ld=lld -Wl,--thread-count=4 -Wl,-z,max-page-size=65536"

formats:
  - apt
  - pacman
  - apk

phases:
  prepare: |
    sudo apt-get update && sudo apt-get install -y cmake ninja-build ruby-full gperf bison flex libicu-dev lld

  configure: |
    cmake -B build -G Ninja \
      -DCMAKE_BUILD_TYPE=Release \
      -DCMAKE_INSTALL_PREFIX="${PREFIX}" \
      -DPORT=JSCOnly \
      -DENABLE_STATIC_JSC=ON \
      -DENABLE_C_LOOP=OFF \
      -DUSE_BUN_JSC_ADDITIONS=ON \
      -DUSE_BUN_EVENT_LOOP=ON \
      -DENABLE_TOOLS=OFF
  make: |
    cmake --build build -j4
  install: |
    DESTDIR="${DESTDIR}" cmake --install build
