name: aisleriot
version: "3.22.24"
revision: 0
arch: aarch64
description: Solitaire card games collection compiled for Termux X11
license: GPL-3.0-or-later
homepage: https://wiki.gnome.org/Apps/AisleRiot
maintainer: SjnExe
build_system: custom

source_url: https://gitlab.gnome.org/GNOME/aisleriot.git#{version}

formats:
  - apt
  - pacman
  - apk

build_deps:
  - gtk3
  - guile
  - librsvg
  - libcanberra
  - libxml2
  - desktop-file-utils
  - shared-mime-info

deps:
  - gtk3
  - guile
  - librsvg
  - libcanberra
  - libxml2

phases:
  configure: |
    export SCCACHE_DISABLE=1
    meson setup build \
      --cross-file /tmp/meson-cross.ini \
      --prefix="${PREFIX}" \
      --libdir="${PREFIX}/lib" \
      -Dguile=3.0 \
      -Dtheme_kde=false
  make: |
    ninja -C build -j4 -k 0
  install: |
    DESTDIR="${DESTDIR}" ninja -C build install
    if command -v termux-elf-cleaner >/dev/null 2>&1; then
      termux-elf-cleaner "${DESTDIR}${PREFIX}/bin/sol" 2>/dev/null || true
      termux-elf-cleaner "${DESTDIR}${PREFIX}/lib/aisleriot/ar-cards/"*.so 2>/dev/null || true
    fi
  test: |
    readelf -h "${PREFIX}/bin/sol" || readelf -h "$(find ${DESTDIR:-/tmp} -name sol -type f 2>/dev/null | head -n 1)"
