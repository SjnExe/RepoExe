name: pyyaml
version: "6.0.3"
revision: 0
architecture: aarch64
description: Canonical YAML parser and emitter for Python
license: MIT
homepage: https://github.com/yaml/pyyaml
maintainer: SjnExe

formats:
  - apt
  - pip

channels:
  latest:
    version: "6.0.3"
    auto_update: true
    update_strategy: pypi
    source_url: https://files.pythonhosted.org/packages/source/p/pyyaml/pyyaml-6.0.2.tar.gz

build_system: custom
phases:
  make: |
    python3 -m pip wheel . --no-deps -w output/ || true
    python3 -m pip install --target="$(python3 -c "import site; print(site.getsitepackages()[0])")" . --no-deps || true
  install: |
    echo "Installed pyyaml site-packages"
