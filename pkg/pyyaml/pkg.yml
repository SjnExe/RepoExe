name: pyyaml
version: "6.0.3"
revision: 0
arch: aarch64
description: Canonical YAML parser and emitter for Python
license: MIT
homepage: https://github.com/yaml/pyyaml
maintainer: SjnExe

formats:
  - apt
  - pip

channels:
  latest:
    auto_update: true
    update_strategy: pypi
    source: https://files.pythonhosted.org/packages/source/p/pyyaml/pyyaml-{version}.tar.gz

build_system: custom
phases:
  make: |
    python3 -m pip wheel . --no-deps -w output/ || true
    python3 -m pip install --target="${DESTDIR}${PREFIX}/lib/python3/dist-packages" . --no-deps
  install: |
    echo "Installed pyyaml site-packages into staging"
  test: |
    python3 -c "import yaml; print('pyyaml ok')"
