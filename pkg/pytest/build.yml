name: pytest
version: "8.3.4"
revision: 0
arch: aarch64
desc: Simple powerful testing framework for Python
license: MIT
homepage: https://pytest.org
maintainer: SjnExe
url: https://files.pythonhosted.org/packages/source/p/pytest/pytest-8.3.4.tar.gz
build_system: custom
formats:
  - pip
  - apt

phases:
  install: |
    mkdir -p "${DESTDIR}${PREFIX}"
    for dir in */; do
      if [ -f "${dir}pyproject.toml" ] || [ -f "${dir}setup.py" ]; then
        cd "$dir"
        break
      fi
    done
    python3 -m pip install --no-deps --prefix="${DESTDIR}${PREFIX}" .
