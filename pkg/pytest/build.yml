name: pytest
version: "8.3.4"
revision: 0
arch: aarch64
description: Simple powerful testing framework for Python
license: MIT
homepage: https://pytest.org
maintainer: SjnExe
auto_update: true
update_strategy: pypi
source_url: https://files.pythonhosted.org/packages/source/p/pytest/pytest-{version}.tar.gz
build_system: custom
formats:
  - pip
  - apt

phases:
  install: |
    mkdir -p "${DESTDIR}${PREFIX}"
    python3 -m pip install --ignore-installed --prefix="${DESTDIR}${PREFIX}" .
  test: |
    pytest --version

vars:
  SETUPTOOLS_SCM_PRETEND_VERSION: "8.3.4"
