name: pytest
type: pip
version: 9.1.1
revision: 0
arch: aarch64
description: Simple powerful testing framework for Python
license: MIT
homepage: https://pytest.org
maintainer: SjnExe
auto_update: true
update_strategy: pypi
source: https://files.pythonhosted.org/packages/source/p/pytest/pytest-{version}.tar.gz
build_system: custom
formats:
  - apt
  - pacman
  - apk
phases:
  install: |
    git config --global --add safe.directory "*" || true
    export SETUPTOOLS_SCM_PRETEND_VERSION="8.3.4"
    mkdir -p "${DESTDIR}${PREFIX}/bin" "${DESTDIR}${PREFIX}/share/repoexe/manifests"
    BINARY_NAME="pytest"
    if [ "${ACTIVE_CHANNEL:-latest}" != "latest" ]; then
      BINARY_NAME="pytest-${ACTIVE_CHANNEL}"
    fi
    python3 -m pip install --ignore-installed --prefix="${DESTDIR}${PREFIX}" .
    if [ "${ACTIVE_CHANNEL:-latest}" != "latest" ] && [ -f "${DESTDIR}${PREFIX}/bin/pytest" ]; then
      mv "${DESTDIR}${PREFIX}/bin/pytest" "${DESTDIR}${PREFIX}/bin/${BINARY_NAME}"
      ln -sf "${BINARY_NAME}" "${DESTDIR}${PREFIX}/bin/pytest" 2>/dev/null || true
    fi
    cat << EOF > "${DESTDIR}${PREFIX}/share/repoexe/manifests/${BINARY_NAME}.json"
    {
      "name": "${BINARY_NAME}",
      "version": "${RECIPE_VERSION:-8.3.4}",
      "patched_version_range": "${RECIPE_PATCHED_RANGE:->=8.0.0}",
      "channel": "${ACTIVE_CHANNEL:-latest}"
    }
    EOF
  test: |
    pytest --version
vars:
  SETUPTOOLS_SCM_PRETEND_VERSION: 8.3.4
