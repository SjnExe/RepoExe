name: packaging
version: "26.3"
revision: 0
arch: aarch64
description: Core utilities for Python packages
license: Apache-2.0 OR BSD-2-Clause
homepage: https://github.com/pypa/packaging
maintainer: SjnExe

formats:
  - pip

channels:
  latest:
    auto_update: true
    update_strategy: pypi
    source: https://files.pythonhosted.org/packages/source/p/packaging/packaging-{version}.tar.gz

build_system: custom
phases:
  make: |
    python3 -m pip install --target="${DESTDIR}${PREFIX}/lib/python3/dist-packages" . --no-deps
  install: |
    echo "Installed packaging site-packages into staging"
  test: |
    python3 -c "import packaging; print('packaging ok')"
