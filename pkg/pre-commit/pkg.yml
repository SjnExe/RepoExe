name: pre-commit
type: pip
version: 4.6.2
revision: 0
arch: aarch64
description: Framework for managing and maintaining multi-language pre-commit hooks
license: MIT
homepage: https://pre-commit.com
maintainer: SjnExe
auto_update: true
update_strategy: pypi
source: https://files.pythonhosted.org/packages/source/p/pre-commit/pre_commit-{version}.tar.gz
build_system: custom
formats:
  - apt
  - pacman
  - apk
phases:
  install: |
    mkdir -p "${DESTDIR}${PREFIX}/bin" "${DESTDIR}${PREFIX}/share/repoexe/manifests"
    BINARY_NAME="pre-commit"
    if [ "${ACTIVE_CHANNEL:-latest}" != "latest" ]; then
      BINARY_NAME="pre-commit-${ACTIVE_CHANNEL}"
    fi
    python3 -m pip install --ignore-installed --prefix="${DESTDIR}${PREFIX}" .
    if [ "${ACTIVE_CHANNEL:-latest}" != "latest" ] && [ -f "${DESTDIR}${PREFIX}/bin/pre-commit" ]; then
      mv "${DESTDIR}${PREFIX}/bin/pre-commit" "${DESTDIR}${PREFIX}/bin/${BINARY_NAME}"
      ln -sf "${BINARY_NAME}" "${DESTDIR}${PREFIX}/bin/pre-commit" 2>/dev/null || true
    fi
    # Delete host-compiled C-extensions to enforce pure-Python mode without glibc
    find "${DESTDIR}${PREFIX}" -name "*_yaml*.so" -delete 2>/dev/null || true
    cat << EOF > "${DESTDIR}${PREFIX}/share/repoexe/manifests/${BINARY_NAME}.json"
    {
      "name": "${BINARY_NAME}",
      "version": "${RECIPE_VERSION:-4.6.2}",
      "patched_version_range": "${RECIPE_PATCHED_RANGE:->=4.0.0}",
      "channel": "${ACTIVE_CHANNEL:-latest}"
    }
    EOF
  test: |
    pre-commit --version
