name: pre-commit
version: "4.1.0"
revision: 0
arch: aarch64
desc: Framework for managing and maintaining multi-language pre-commit hooks
license: MIT
homepage: https://pre-commit.com
maintainer: SjnExe
source: https://files.pythonhosted.org/packages/source/p/pre-commit/pre_commit-4.1.0.tar.gz
build_system: custom
formats:
  - pip
  - apt

phases:
  install: |
    mkdir -p "${DESTDIR}${PREFIX}"
    python3 -m pip install --ignore-installed --prefix="${DESTDIR}${PREFIX}" .
  test: |
    pre-commit --version
