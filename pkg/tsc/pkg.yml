name: tsc
version: "7.0.2"
revision: 0
arch: aarch64
description: Fast TypeScript compiler written in Go with Seccomp sandbox patches
license: Apache-2.0
homepage: https://github.com/SjnExe/RepoExe
maintainer: SjnExe

formats:
  - npm

channels:
  latest:
    auto_update: true
    update_strategy: github_tag
    source: https://github.com/microsoft/typescript-go.git#typescript/v{version}

build_system: go

toolchains:
  go: ">=1.22"
patched_version_range: ">=5.0.0"

vars:
  GOOS: "android"
  GOARCH: "arm64"
  CGO_ENABLED: "0"
  GOTOOLCHAIN: "local"
  npm_name: "@typescript/typescript-android-arm64"
  npm_bin_dir: "lib"
  patched_target: "typescript"

phases:
  prepare: |
    [ -f go.mod ] && sed -i 's/^go 1\.[0-9]*/go 1.22/' go.mod || true
  make: |
    go mod tidy || true
    go build -buildvcs=false -ldflags="-s -w" -o tsc ./cmd/tsgo
  install: |
    install -Dm755 tsc "${DESTDIR}${PREFIX}/bin/tsc"
