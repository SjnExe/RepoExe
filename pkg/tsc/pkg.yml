name: tsc
version: "7.0.2"
revision: 0
arch: aarch64
description: Fast TypeScript compiler written in Go with Seccomp sandbox patches
license: Apache-2.0
homepage: https://github.com/SjnExe/RepoExe
maintainer: SjnExe

formats:
  - apt
  - pacman
  - apk
  - npm

channels:
  latest:
    auto_update: true
    update_strategy: github_tag
    source: https://github.com/microsoft/typescript-go.git#typescript/v{version}

build_system: go

toolchains:
  go: ">=1.22"
vars:
  GOOS: "android"
  GOARCH: "arm64"
  CGO_ENABLED: "0"
  GOTOOLCHAIN: "local"
  npm_name: "@typescript/typescript-android-arm64"
  npm_bin_dir: "lib"

phases:
  prepare: |
    [ -f go.mod ] && sed -i 's/^go 1\.[0-9]*/go 1.22/' go.mod || true
  make: |
    echo "Patching fanotify for Android Seccomp compatibility..."
    python3 -c '
    import re
    with open("go.mod", "r") as f:
        content = f.read()
    content = re.sub(r"(?s)\b(tool|ignore)\s*\(.*?\)", "", content)
    with open("go.mod", "w") as f:
        f.write(content)

    p = "internal/fswatch/fanotify_linux.go"
    try:
        with open(p, "r") as f:
            code = f.read()
        code = re.sub(r"func fanotifyAvailable\(\)\s*bool\s*\{.*?\n\}", "func fanotifyAvailable() bool {\n\treturn false\n}", code, flags=re.DOTALL)
        with open(p, "w") as f:
            f.write(code)
        print("✓ Successfully patched fanotifyAvailable in " + p)
    except Exception as e:
        print("Notice: " + str(e))
    '
    go mod tidy || true
    go build -buildvcs=false -ldflags="-s -w" -o tsc ./cmd/tsgo
  install: |
    install -Dm755 tsc "${DESTDIR}${PREFIX}/bin/tsc"
