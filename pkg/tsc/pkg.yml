name: tsc
type: npm
version: "7.0.2"
revision: 0
arch: aarch64
description: Fast TypeScript compiler written in Go with Seccomp sandbox patches
license: Apache-2.0
homepage: https://github.com/SjnExe/RepoExe
maintainer: SjnExe

formats:
  - apt
  - pacman
  - apk

channels:
  latest:
    auto_update: true
    update_strategy: github_tag
    source: https://github.com/microsoft/typescript-go.git#typescript/v{version}

build_system: go

toolchains:
  go: ">=1.22"
patched_version_range: ">=5.0.0"

vars:
  GOOS: "android"
  GOARCH: "arm64"
  CGO_ENABLED: "0"
  GOTOOLCHAIN: "local"

phases:
  prepare: |
    [ -f go.mod ] && sed -i 's/^go 1\.[0-9]*/go 1.22/' go.mod || true
  make: |
    go mod tidy || true
    go build -buildvcs=false -ldflags="-s -w" -o tsc ./cmd/tsgo
  install: |
    mkdir -p "${DESTDIR}${PREFIX}/bin" "${DESTDIR}${PREFIX}/share/repoexe/manifests"
    BINARY_NAME="tsc"
    if [ "${ACTIVE_CHANNEL:-latest}" != "latest" ]; then
      BINARY_NAME="tsc-${ACTIVE_CHANNEL}"
    fi
    install -Dm755 tsc "${DESTDIR}${PREFIX}/bin/${BINARY_NAME}"
    if [ "${ACTIVE_CHANNEL:-latest}" != "latest" ]; then
      ln -sf "${BINARY_NAME}" "${DESTDIR}${PREFIX}/bin/tsc" 2>/dev/null || true
    fi
    cat << EOF > "${DESTDIR}${PREFIX}/share/repoexe/manifests/${BINARY_NAME}.json"
    {
      "name": "${BINARY_NAME}",
      "version": "${RECIPE_VERSION:-7.0.2}",
      "patched_version_range": "${RECIPE_PATCHED_RANGE:->=5.0.0}",
      "channel": "${ACTIVE_CHANNEL:-latest}"
    }
    EOF
