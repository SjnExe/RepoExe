name: typing-extensions
type: pip
version: 4.16.0
revision: 0
arch: aarch64
description: Backported and experimental type hints for Python
license: PSF-2.0
homepage: https://github.com/python/typing_extensions
maintainer: SjnExe

formats:
  - apt
  - pacman
  - apk

channels:
  latest:
    auto_update: true
    update_strategy: pypi
    source: https://files.pythonhosted.org/packages/source/t/typing-extensions/typing_extensions-{version}.tar.gz

build_system: custom
phases:
  make: |
    python3 -m pip install --break-system-packages --no-deps --target="${DESTDIR}${PREFIX}/lib/python3/dist-packages" .
  install: |
    echo "Installed typing-extensions site-packages into staging"
  test: |
    python3 -c "import typing_extensions; print('typing-extensions ok')"
