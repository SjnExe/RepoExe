name: uv
version: 0.12.3
revision: 0
arch: aarch64
description: Fast Python package installer and resolver written in Rust
license: Apache-2.0
homepage: https://github.com/astral-sh/uv
maintainer: SjnExe
formats:
- apt
- pacman
- apk
- pip
deps:
- zstd
channels:
  latest:
    auto_update: true
    update_strategy: github_release
    source_url: https://github.com/astral-sh/uv/releases/download/{version}/uv-aarch64-unknown-linux-musl.tar.gz
    version: 0.12.3
    revision: 0
build_system: custom

toolchains:
  rust: "stable"
phases:
  install: 'install -Dm755 uv "${DESTDIR}${PREFIX}/bin/uv"

    install -Dm755 uvx "${DESTDIR}${PREFIX}/bin/uvx" 2>/dev/null || true

    '
