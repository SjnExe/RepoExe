[project]
name = "RepoExe"
version = "0.1.0"
description = "Micro-modular Python orchestrator for RepoExe"
readme = "../README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.0.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "PyYAML>=6.0",
]

[project.scripts]
repoexe = "core.build:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
addopts = "--cov=core --cov-report=term-missing"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["core"]
