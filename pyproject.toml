[project]
name = "repoexe-orchestrator"
version = "0.1.0"
description = "Micro-modular Python orchestrator for RepoExe"
requires-python = ">=3.10"
dependencies = [
    "packaging>=24.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "requests>=2.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts/builders", "scripts/utils", "scripts/cli"]

[tool.uv]
link-mode = "symlink"

[dependency-groups]
dev = [
    "mypy>=1.10.0",
    "pytest>=8.0.0",
]

[tool.ruff.lint]
ignore = ["BLE001", "S110"]
