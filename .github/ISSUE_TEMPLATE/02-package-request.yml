name: "Package Request"
description: "Suggest a new standalone package or tool for RepoExe"
title: "[Request]: "
labels: [untriaged, "package request"]
type: 'feature'
body:
  - type: markdown
    attributes:
      value: |
        RepoExe is primarily focused on custom tools and standalone packages rather than general purpose Linux software. Ensure your package request aligns with this scope. Root and X11 packages will be rejected.
  - type: textarea
    attributes:
      label: Package Details
      description: |
        Please provide the package name, upstream URL, and a brief description of what it does and why it is useful for RepoExe.
    validations:
      required: true
