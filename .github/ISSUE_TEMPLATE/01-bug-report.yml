name: "Bug report"
description: "Create a report to help us improve"
title: "[Bug]: "
labels: [untriaged, "bug report"]
type: 'bug'
body:
  - type: markdown
    attributes:
      value: |
        This is the bug tracker for RepoExe packages. Please do not report issues of third-party upstream software here unless it is directly related to how the package is built or behaves within the RepoExe environment.

        Use search to check whether your issue has been already reported and perhaps solved.

        To submit a bug report, fill the form below. Provide as much information as possible about the encountered issue.
  - type: textarea
    attributes:
      label: Problem description
      description: |
        A clear and concise description of what the problem is.
    validations:
      required: true
  - type: textarea
    attributes:
      label: What steps will reproduce the bug?
    validations:
      required: true
  - type: textarea
    attributes:
      label: What is the expected behavior?
  - type: textarea
    attributes:
      label: System information
      description: Provide output of the command `termux-info` or relevant environment details.
      render: shell
    validations:
      required: true