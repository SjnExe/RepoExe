name: 'Setup Swap Space'
description: 'Allocates and activates swap space for heavy builds'
inputs:
  size:
    description: 'Size of swap file (e.g., 4G, 8G)'
    required: false
    default: '4G'

runs:
  using: 'composite'
  steps:
    - name: Create and Enable Swap File
      shell: bash
      run: |
        echo "⚡ Allocating ${{ inputs.size }} swap file..."
        SWAPFILE="/swapfile_${{ inputs.size }}"
        if [ ! -f "$SWAPFILE" ]; then
          sudo fallocate -l ${{ inputs.size }} "$SWAPFILE" || sudo dd if=/dev/zero of="$SWAPFILE" bs=1M count=4096
          sudo chmod 600 "$SWAPFILE"
          sudo mkswap "$SWAPFILE"
        fi
        sudo swapon "$SWAPFILE" || true
        sudo swapon --show
