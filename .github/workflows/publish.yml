name: Publish Repo

on:
  workflow_run:
    workflows: ['Build']
    types:
      - completed
  workflow_dispatch:
    inputs:
      test_only:
        description: 'Test Mode: Build packages but skip publishing to the repository.'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write
  packages: write

jobs:
  check-decision:
    runs-on: ubuntu-latest
    if: always()
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
    steps:
      - name: Check for publish decision artifact
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" != "workflow_run" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RUN_ID="${{ github.event.workflow_run.id }}"
          echo "Checking run $RUN_ID for publish_decision artifact..."

          ARTIFACTS=$(gh api repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts --jq '.artifacts[].name' || true)

          if echo "$ARTIFACTS" | grep -q "publish_decision"; then
            echo "Publish decision artifact found."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Publish decision artifact NOT found. Skipping publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: [check-decision]
    runs-on: ubuntu-latest
    if: |
      always() && (
        (github.event_name == 'workflow_dispatch' && !inputs.test_only) ||
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && needs.check-decision.outputs.should_publish == 'true')
      )

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: 'latest'

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Extract metadata from GitHub Releases without downloading all packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts
          echo "Fetching all release tags"
          TAGS=$(gh release list --limit 1000 --json tagName --jq '.[].tagName' || true)
          for tag in $TAGS; do
            echo "Processing tag $tag..."
            gh release download "$tag" --dir artifacts || echo "No .deb found in $tag"
            gh release download "$tag" --pattern "metadata.json" --output "artifacts/${tag}_metadata.json" || echo "No metadata found in $tag"
            gh release view "$tag" --json assets > "artifacts/${tag}_assets.json" || true
          done

      - name: Inject Signing Keys
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          ALPINE_PRIVATE_KEY: ${{ secrets.ALPINE_PRIVATE_KEY }}
        run: |
          mkdir -p scripts/keys
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "$GPG_PRIVATE_KEY" > scripts/keys/repoexe.gpg
          fi
          if [ -n "$ALPINE_PRIVATE_KEY" ]; then
            echo "$ALPINE_PRIVATE_KEY" > scripts/keys/repoexe.rsa
          fi

      - name: Prune Old Assets and Zombie Tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd scripts
          uv run python core/prune.py

      - name: Generate Static Metadata and Pages Assets
        run: |
          cd scripts
          uv sync

          mkdir -p ../site/apt

          echo "Attempting to fetch previous Packages files to allow Pdiff generation..."
          for arch in aarch64 arm x86_64 i686 riscv64 wasm32-wasi; do
            mkdir -p "apt_staging/dists/stable/main/binary-$arch/Packages.diff"
            curl -sL --fail "https://sjnexe.github.io/RepoExe/apt/dists/stable/main/binary-$arch/Packages" > "apt_staging/dists/stable/main/binary-$arch/Packages" || true
            curl -sL --fail "https://sjnexe.github.io/RepoExe/apt/dists/stable/main/binary-$arch/Packages.diff/Index" > "apt_staging/dists/stable/main/binary-$arch/Packages.diff/Index" || true

            if [ -f "apt_staging/dists/stable/main/binary-$arch/Packages.diff/Index" ]; then
               PATCHES=$(grep "^ " "apt_staging/dists/stable/main/binary-$arch/Packages.diff/Index" | awk '{print $3}' | sort -u)
               for p in $PATCHES; do
                 if [ -n "$p" ] && [ "$p" != "Index" ]; then
                   curl -sL --fail "https://sjnexe.github.io/RepoExe/apt/dists/stable/main/binary-$arch/Packages.diff/$p.gz" > "apt_staging/dists/stable/main/binary-$arch/Packages.diff/$p.gz" || true
                 fi
               done
            fi
          done

          find ../artifacts -name "*.deb" -exec cp {} apt_staging/ \; 2>/dev/null || true

          cat << 'PY_EOF' > generate_meta.py
          import os
          import glob
          import shutil
          import glob, shutil
          from core.metadata import generate_packages_json
          from core.pip import generate_pip_index
          from core.npm import generate_npm_index

          os.makedirs("../site/pacman", exist_ok=True)
          os.makedirs("../site/alpine", exist_ok=True)
          os.makedirs("../site/pip", exist_ok=True)
          os.makedirs("../site/npm", exist_ok=True)

          for f in glob.glob("../artifacts/*"):
              if f.endswith(".pkg.tar.zst") or f.endswith(".pkg.tar.xz"):
                  shutil.copy(f, "../site/pacman/")
              elif f.endswith(".apk"):
                  shutil.copy(f, "../site/alpine/")
              elif f.endswith(".whl"):
                  shutil.copy(f, "../site/pip/")
              elif f.endswith(".tgz"):
                  shutil.copy(f, "../site/npm/")

          generate_pip_index("../site")
          generate_npm_index("../site")
          generate_packages_json('packages', '../site/packages.json')
          from core.debian import generate_apt_metadata

          output_dir = "apt_staging"
          deb_files = glob.glob(os.path.join(output_dir, "*.deb"))
          arches = set()
          for f in deb_files:
              arch = f.split('_')[-1].replace('.deb', '')
              if arch != 'all':
                  arches.add(arch)

          if not arches:
              arches.add('aarch64')

          for arch in arches:
              print(f"Generating APT metadata for {arch}...")
              generate_apt_metadata(output_dir, component='main', arch=arch)

          from core.debian import generate_release_file
          generate_release_file(output_dir, suite='stable', component='main')

          os.makedirs("../site/apt", exist_ok=True)
          os.system("cp -r apt_staging/dists ../site/apt/")

          from core.pip import generate_pip_index
          from core.npm import generate_npm_index
          generate_pip_index("../site")
          generate_npm_index("../site")
          

          for deb in glob.glob(os.path.join(output_dir, "*.deb")):
              shutil.copy(deb, "../site/apt/")

          PY_EOF

          uv run python generate_meta.py

          mkdir -p ../site/pacman
          mkdir -p ../site/alpine

          # Copy install script to site root and /install endpoint
          INSTALL_SCRIPT=""
          if [ -f "site/install" ]; then INSTALL_SCRIPT="site/install";
          elif [ -f "../scripts/site/install" ]; then INSTALL_SCRIPT="../scripts/site/install";
          elif [ -f "../install.sh" ]; then INSTALL_SCRIPT="../install.sh";
          elif [ -f "install.sh" ]; then INSTALL_SCRIPT="install.sh";
          fi

          if [ -n "$INSTALL_SCRIPT" ]; then
            cp "$INSTALL_SCRIPT" ../site/install
            cp "$INSTALL_SCRIPT" ../site/install.sh
            touch ../site/.nojekyll
            echo "✓ Installed installer script to site/install"
          else
            echo "Error: Installer script not found!" >&2
            exit 1
          fi

          # Copy static frontend store site files
          mkdir -p ../site
          mkdir -p ../site
          if [ -d "site" ]; then cp -r site/* ../site/;
          elif [ -d "../scripts/site" ]; then cp -r ../scripts/site/* ../site/;
          fi
          
          # Export binary and ascii public keys to site root
          KEY_SRC=""
          if [ -f "keys/repoexe.gpg" ]; then KEY_SRC="keys/repoexe.gpg";
          elif [ -f "scripts/keys/repoexe.gpg" ]; then KEY_SRC="scripts/keys/repoexe.gpg";
          fi

          if [ -n "$KEY_SRC" ]; then
            gpg --batch --import "$KEY_SRC" 2>/dev/null || true
            gpg --batch --export > ../site/repoexe.gpg
            gpg --batch --armor --export > ../site/repoexe.asc
            echo "✓ Exported repoexe.gpg and repoexe.asc to site/"
          else
            echo "Error: GPG key file not found!" >&2
            exit 1
          fi

          if [ ! -s "../site/repoexe.gpg" ]; then
            echo "Error: ../site/repoexe.gpg is missing or empty after export!" >&2
            exit 1
          fi
          echo "Metadata generation executed."

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
