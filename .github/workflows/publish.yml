name: Publish Repo

on:
  workflow_run:
    workflows: ['Build']
    types:
      - completed
  workflow_dispatch:
    inputs:
      test_only:
        description: 'Test Mode: Build packages but skip publishing to the repository.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write
  packages: write

jobs:
  check-decision:
    runs-on: ubuntu-latest
    if: always()
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
    steps:
      - name: Check for publish decision artifact
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Try to download the artifact from the triggering workflow
          if [ "${{ github.event_name }}" != "workflow_run" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RUN_ID="${{ github.event.workflow_run.id }}"
          echo "Checking run $RUN_ID for publish_decision artifact..."

          # gh run download doesn't fail cleanly if no artifacts exist sometimes, so we list first
          ARTIFACTS=$(gh api repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts --jq '.artifacts[].name' || true)

          if echo "$ARTIFACTS" | grep -q "publish_decision"; then
            echo "Publish decision artifact found."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Publish decision artifact NOT found. Skipping publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: [check-decision]
    runs-on: ubuntu-latest
    if: |
      always() && (
        (github.event_name == 'workflow_dispatch' && !inputs.test_only) ||
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && needs.check-decision.outputs.should_publish == 'true')
      )

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: 'latest'

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Extract metadata from GitHub Releases without downloading all packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts
          echo "Fetching all release tags"
          TAGS=$(gh release list --limit 1000 --json tagName --jq '.[].tagName' || true)
          for tag in $TAGS; do
            echo "Processing tag $tag..."
            # We can download just the metadata.json instead of all files
            gh release download "$tag" --dir artifacts --pattern "metadata.json" || echo "No metadata found in $tag"

            # To serve packages using GitHub release asset URLs, the index generation logic
            # will need to know the download URLs of the assets.
            # We can dump the asset list and URLs.
            gh release view "$tag" --json assets > "artifacts/${tag}_assets.json" || true
          done

      - name: Inject Signing Keys
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          ALPINE_PRIVATE_KEY: ${{ secrets.ALPINE_PRIVATE_KEY }}
        run: |
          mkdir -p scripts/keys
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "$GPG_PRIVATE_KEY" > scripts/keys/repoexe.gpg
          fi
          if [ -n "$ALPINE_PRIVATE_KEY" ]; then
            echo "$ALPINE_PRIVATE_KEY" > scripts/keys/repoexe.rsa
          fi

      - name: Prune Old Assets and Zombie Tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd scripts
          uv run python core/prune.py

      - name: Generate Static Metadata
        run: |
          cd scripts
          uv sync
          # Integrate metadata generation with python orchestrator
          cat << 'PY_EOF' > generate_meta.py
          import os
          from core.packagers.debian import generate_apt_metadata

          PY_EOF

          mkdir -p ../site/apt

          # Fetch the existing Packages files from GitHub Pages (or the site) so that we can do Pdiff
          # Since the site is hosted on gh-pages branch or deployed via Pages, we can curl it.
          echo "Attempting to fetch previous Packages files to allow Pdiff generation..."
          for arch in aarch64 arm x86_64 i686 riscv64 wasm32-wasi; do
            mkdir -p "apt_staging/dists/stable/main/binary-$arch"
            curl -sL --fail "https://sjnexe.github.io/RepoExe/apt/dists/stable/main/binary-$arch/Packages" > "apt_staging/dists/stable/main/binary-$arch/Packages" || true
            curl -sL --fail "https://sjnexe.github.io/RepoExe/apt/dists/stable/main/binary-$arch/Packages.diff/Index" > "apt_staging/dists/stable/main/binary-$arch/Packages.diff/Index" --create-dirs || true

            # also fetch old patches if present so we don't lose them when pruning
            if [ -f "apt_staging/dists/stable/main/binary-$arch/Packages.diff/Index" ]; then
               PATCHES=$(grep "^ " "apt_staging/dists/stable/main/binary-$arch/Packages.diff/Index" | awk '{print $3}' | sort -u)
               for p in $PATCHES; do
                 if [ -n "$p" ] && [ "$p" != "Index" ]; then
                   curl -sL --fail "https://sjnexe.github.io/RepoExe/apt/dists/stable/main/binary-$arch/Packages.diff/$p.gz" > "apt_staging/dists/stable/main/binary-$arch/Packages.diff/$p.gz" || true
                 fi
               done
            fi
          done

          # Find all deb files in artifacts and copy them to a staging dir for APT
          find ../artifacts -name "*.deb" -exec cp {} apt_staging/ \;

          cat << 'PY_EOF' > generate_meta.py
          import os
          import glob
          import shutil
          from core.packagers.debian import generate_apt_metadata

          output_dir = "apt_staging"
          # Get unique architectures
          deb_files = glob.glob(os.path.join(output_dir, "*.deb"))
          arches = set()
          for f in deb_files:
              # Filename format: name_version_arch.deb
              arch = f.split('_')[-1].replace('.deb', '')
              if arch != 'all':
                  arches.add(arch)

          if not arches:
              arches.add('aarch64') # Default fallback

          for arch in arches:
              print(f"Generating APT metadata for {arch}...")
              generate_apt_metadata(output_dir, component='main', arch=arch)

          # Move everything to site
          os.makedirs("../site/apt", exist_ok=True)
          os.system("cp -r apt_staging/dists ../site/apt/")

          # Copy .deb packages too to the root of apt
          for deb in glob.glob(os.path.join(output_dir, "*.deb")):
              shutil.copy(deb, "../site/apt/")

          PY_EOF

          uv run python generate_meta.py

          mkdir -p ../site/pacman
          mkdir -p ../site/alpine
          echo "Metadata generation executed."

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
