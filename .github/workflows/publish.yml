name: Publish Repo

on:
  workflow_run:
    workflows: ['Build']
    types:
      - completed
  workflow_dispatch:
    inputs:
      test_only:
        description: 'Test Mode: Skip publishing to Pages'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  check-decision:
    runs-on: ubuntu-latest
    if: always()
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
    steps:
      - name: Check for publish decision artifact
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" != "workflow_run" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RUN_ID="${{ github.event.workflow_run.id }}"
          ARTIFACTS=$(gh api repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts --jq '.artifacts[].name' || true)

          if echo "$ARTIFACTS" | grep -q "publish_decision"; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: [check-decision]
    runs-on: ubuntu-latest
    if: |
      always() && (
        (github.event_name == 'workflow_dispatch' && !inputs.test_only) ||
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && needs.check-decision.outputs.should_publish == 'true')
      )

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Extract metadata from GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts
          TAGS=$(gh release list --limit 1000 --json tagName --jq '.[].tagName' || true)
          for tag in $TAGS; do
            gh release download "$tag" --dir artifacts || true
          done

      - name: Generate Static Metadata and Repositories
        env:
          PYTHONPATH: scripts
        run: |
          uv sync
          mkdir -p site/apt site/pacman site/alpine site/pip site/npm apt_staging

          cat << 'PY_EOF' > generate_meta.py
          import sys, os, glob, shutil
          from pathlib import Path

          sys.path.insert(0, str(Path("scripts").resolve()))

          from core.debian import generate_apt_metadata, generate_release_file
          from core.metadata import generate_packages_json
          from core.pip import generate_pip_index
          from core.npm import generate_npm_index

          os.makedirs("site/apt", exist_ok=True)
          os.makedirs("site/pacman", exist_ok=True)
          os.makedirs("site/alpine", exist_ok=True)
          os.makedirs("site/pip", exist_ok=True)
          os.makedirs("site/npm", exist_ok=True)

          for f in glob.glob("artifacts/*"):
              if f.endswith(".deb"):
                  shutil.copy(f, "apt_staging/")
                  shutil.copy(f, "site/apt/")
              elif f.endswith(".pkg.tar.zst") or f.endswith(".pkg.tar.gz"):
                  shutil.copy(f, "site/pacman/")
              elif f.endswith(".apk"):
                  shutil.copy(f, "site/alpine/")
              elif f.endswith(".whl"):
                  shutil.copy(f, "site/pip/")
              elif f.endswith(".tgz"):
                  shutil.copy(f, "site/npm/")

          output_dir = "apt_staging"
          deb_files = glob.glob(os.path.join(output_dir, "*.deb"))
          arches = set()
          for f in deb_files:
              arch = f.split('_')[-1].replace('.deb', '')
              if arch != 'all':
                  arches.add(arch)

          if not arches:
              arches.add('aarch64')

          for arch in arches:
              generate_apt_metadata(output_dir, component='main', arch=arch)

          generate_release_file(output_dir, suite='stable', component='main')
          os.system("cp -r apt_staging/dists site/apt/")

          generate_pip_index("site")
          generate_npm_index("site")
          generate_packages_json("packages", "site/packages.json")
          PY_EOF

          uv run python generate_meta.py
          touch site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
