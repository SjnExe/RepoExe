name: CI Checks & Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - 'refactor/**'
  workflow_dispatch:

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff pydantic pyyaml requests

      - name: Run Ruff Linter
        run: ruff check .

      - name: Repository Health Check
        run: |
          PYTHONPATH=scripts python3 scripts/build.py check

      - name: Run Pytest
        run: |
          PYTHONPATH=scripts pytest scripts/tests/
