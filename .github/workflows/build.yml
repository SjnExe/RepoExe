name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      packages:
        description: 'Target specs (e.g. "aisleriot bun", "all@all", "type:npm !tsc")'
        required: false
        type: string
        default: 'all@all'
      publish:
        description: 'Publish release assets & update GitHub Pages site'
        required: false
        type: boolean
        default: true
      skip_build:
        description: 'Skip compilation step and re-index existing releases'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate-matrix:
    name: Matrix
    runs-on: ubuntu-latest
    outputs:
      layer_0: ${{ steps.matrix.outputs.layer_0 }}       layer_1:${{ steps.matrix.outputs.layer_1 }}
      layer_2: ${{ steps.matrix.outputs.layer_2 }}       layer_3:${{ steps.matrix.outputs.layer_3 }}
      should_publish: ${{ steps.decision.outputs.should_publish }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true

      - name: Install Dependencies
        run: |
          uv pip install --system -r pyproject.toml || true
          pip install pytest ruff pydantic pyyaml

      - name: Audit & Health Check
        env:
          PYTHONPATH: scripts
        run: |
          python scripts/cli/build.py check
          pytest scripts/tests/

      - name: Determine Publish Decision
        id: decision
        run: |
          if { [ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; } && [ "${{ inputs.publish }}" != "false" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Matrix Layers
        id: matrix
        env:
          TARGET_INPUT: ${{ inputs.packages || 'auto' }}
          PYTHONPATH: scripts
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          JSON_OUT="$(python scripts/cli/generate_shards.py)"
          L0="$(echo "$JSON_OUT" | jq -c '.layer_0')"
          L1="$(echo "$JSON_OUT" | jq -c '.layer_1')"
          L2="$(echo "$JSON_OUT" | jq -c '.layer_2')"
          L3="$(echo "$JSON_OUT" | jq -c '.layer_3')"
          
          # shellcheck disable=SC2129
          echo "layer_0=${L0}" >> "$GITHUB_OUTPUT"
          echo "layer_1=${L1}" >> "$GITHUB_OUTPUT"
          echo "layer_2=${L2}" >> "$GITHUB_OUTPUT"
          echo "layer_3=${L3}" >> "$GITHUB_OUTPUT"

  build-layer-0:
    name: "0:${{ matrix.package }}@${{ matrix.channel }}"
    needs: [generate-matrix]
    if: ${{ !inputs.skip_build && needs.generate-matrix.outputs.layer_0 != '[]' }}
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-matrix.outputs.layer_0) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare Workspace Permissions
        run: |
          mkdir -p build output build_logs .sccache .gocache .gomodcache .cargoregistry .cargogit
          sudo chmod -R 777 .

      - name: Verify Docker Image Freshness
        if: github.event_name != 'workflow_dispatch'
        run: |
          BASE_REF="${GITHUB_BASE_REF:-main}"
          REF_NAME="${GITHUB_REF_NAME:-}"
          if [ "${REF_NAME\%\%/*}" != "refactor" ] && git diff --name-only "origin/${BASE_REF}...HEAD" 2>/dev/null | grep -qE '^scripts/docker/|^\.github/workflows/docker\.yml'; then
            echo "::error::Docker environment files modified in branch."
          fi

      - name: Free Disk Space
        if: matrix.free_space
        uses: ./.github/actions/free-space

      - name: Setup Memory & Swap
        if: matrix.zram > 0 || matrix.swap > 0
        uses: ./.github/actions/setup-memory
        with:
          zram: ${{ matrix.zram }}
          swap: ${{ matrix.swap }}

      - name: Restore Toolchain & Build Caches
        uses: actions/cache/restore@v6
        with:
          path: |
            .sccache
            .gocache
            .gomodcache
            .cargoregistry
            .cargogit
          key: build-cache-${{ matrix.build_system }}-${{ matrix.package }}-${{ matrix.channel }}-${{ github.sha }}
          restore-keys: |
            build-cache-${{ matrix.build_system }}-${{ matrix.package }}-${{ matrix.channel }}-
            build-cache-${{ matrix.build_system }}-${{ matrix.package }}-
            build-cache-${{ matrix.build_system }}-
            build-cache-

      - name: Fix Cache Permissions
        run: |
          mkdir -p .sccache .gocache .gomodcache .cargoregistry .cargogit
          sudo chmod -R 777 .sccache .gocache .gomodcache .cargoregistry .cargogit 2>/dev/null || true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile Package Payload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG_NAME: ${{ matrix.package }}
          CHANNEL: ${{ matrix.channel }}
        run: |
          set -o pipefail
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          LOG_FILE="build_logs/${PKG_NAME}_${CHANNEL}.log"
          mkdir -p build_logs
          echo "=== STAGE: COMPILE ===" >> "${LOG_FILE}"

          docker run --rm \
            --volume "${{ github.workspace }}:/home/builder/RepoExe" \
            --workdir /home/builder/RepoExe \
            --env GH_TOKEN="${GH_TOKEN}" \
            --env PYTHONPATH="scripts" \
            --env GITHUB_WORKSPACE="${{ github.workspace }}" \
            --env SCCACHE_DIR="/home/builder/.cache/sccache" \
            --env GOCACHE="/home/builder/.cache/go-build" \
            --env GOMODCACHE="/home/builder/go/pkg/mod" \
            --volume "${{ github.workspace }}/.sccache:/home/builder/.cache/sccache" \
            --volume "${{ github.workspace }}/.gocache:/home/builder/.cache/go-build" \
            --volume "${{ github.workspace }}/.gomodcache:/home/builder/go/pkg/mod" \
            --volume "${{ github.workspace }}/.cargoregistry:/home/builder/.cargo/registry" \
            --volume "${{ github.workspace }}/.cargogit:/home/builder/.cargo/git" \
            "ghcr.io/${OWNER}/repoexe-builder:latest" \
            python3 scripts/cli/build.py compile "pkg/${PKG_NAME}" --channel "${CHANNEL}" 2>&1 \vert{} tee -a "${LOG_FILE}"

      - name: Profile Build Memory Peak
        if: always()
        run: |
          RAM_STR="N/A"
          SWAP_STR="N/A"
          CG_DIR="/sys/fs/cgroup$(awk -F: '$2=="" || $2=="{systemd}" {print $3}' /proc/self/cgroup 2>/dev/null)"
          [ -d "$CG_DIR" ] || CG_DIR="/sys/fs/cgroup"
          if [ -f "$CG_DIR/memory.peak" ]; then
            BYTES="$(cat "$CG_DIR/memory.peak" 2>/dev/null || echo 0)"
            if [ "$BYTES" -gt 0 ] 2>/dev/null; then
              RAM_STR="$(awk -v b="$BYTES" 'BEGIN {printf "%.2f GB (%d bytes)", b/1073741824, b}')"
            fi
          elif [ -f "/sys/fs/cgroup/memory/memory.max_usage_in_bytes" ]; then
            BYTES="$(cat "/sys/fs/cgroup/memory/memory.max_usage_in_bytes" 2>/dev/null || echo 0)"
            if [ "$BYTES" -gt 0 ] 2>/dev/null; then
              RAM_STR="$(awk -v b="$BYTES" 'BEGIN {printf "%.2f GB (%d bytes)", b/1073741824, b}')"
            fi
          fi
          if [ -f "$CG_DIR/memory.swap.peak" ]; then
            SBYTES="$(cat "$CG_DIR/memory.swap.peak" 2>/dev/null || echo 0)"
            if [ "$SBYTES" -gt 0 ] 2>/dev/null; then
              SWAP_STR="$(awk -v b="$SBYTES" 'BEGIN {printf "%.2f GB (%d bytes)", b/1073741824, b}')"
            fi
          fi
          # shellcheck disable=SC2129
          echo "### 📊 Peak Memory Consumption (${{ matrix.package }})" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "Peak RAM Usage:  ${RAM_STR}" >> "$GITHUB_STEP_SUMMARY"
          echo "Peak Swap Usage: ${SWAP_STR}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Assemble Package Archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG_NAME: ${{ matrix.package }}
          CHANNEL: ${{ matrix.channel }}
        run: |
          set -o pipefail
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          LOG_FILE="build_logs/${PKG_NAME}_${CHANNEL}.log"
          echo "=== STAGE: PACK ===" >> "${LOG_FILE}"

          docker run --rm \
            --volume "${{ github.workspace }}:/home/builder/RepoExe" \
            --workdir /home/builder/RepoExe \
            --env GH_TOKEN="${GH_TOKEN}" \
            --env PYTHONPATH="scripts" \
            --env GITHUB_WORKSPACE="${{ github.workspace }}" \
            --env SCCACHE_DIR="/home/builder/.cache/sccache" \
            --env GOCACHE="/home/builder/.cache/go-build" \
            --env GOMODCACHE="/home/builder/go/pkg/mod" \
            --volume "${{ github.workspace }}/.sccache:/home/builder/.cache/sccache" \
            --volume "${{ github.workspace }}/.gocache:/home/builder/.cache/go-build" \
            --volume "${{ github.workspace }}/.gomodcache:/home/builder/go/pkg/mod" \
            --volume "${{ github.workspace }}/.cargoregistry:/home/builder/.cargo/registry" \
            --volume "${{ github.workspace }}/.cargogit:/home/builder/.cargo/git" \
            "ghcr.io/${OWNER}/repoexe-builder:latest" \
            python3 scripts/cli/build.py pack "pkg/${PKG_NAME}" --channel "${CHANNEL}" 2>&1 | tee -a "${LOG_FILE}"

      - name: Termux Docker Smoke Test
        continue-on-error: true
        id: test_step
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG_NAME: ${{ matrix.package }}
          CHANNEL: ${{ matrix.channel }}
        run: |
          set -o pipefail
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          LOG_FILE="build_logs/${PKG_NAME}_${CHANNEL}.log"
          echo "=== STAGE: TEST ===" >> "${LOG_FILE}"

          docker run --rm \
            --volume "${{ github.workspace }}:/home/builder/RepoExe" \
            --workdir /home/builder/RepoExe \
            --env GH_TOKEN="${GH_TOKEN}" \
            --env PYTHONPATH="scripts" \
            --env GITHUB_WORKSPACE="${{ github.workspace }}" \
            --env SCCACHE_DIR="/home/builder/.cache/sccache" \
            --volume "${{ github.workspace }}/.sccache:/home/builder/.cache/sccache" \
            "ghcr.io/${OWNER}/repoexe-builder:latest" \
            python3 scripts/cli/build.py test "pkg/${PKG_NAME}" --channel "${CHANNEL}" 2>&1 | tee -a "${LOG_FILE}"

      - name: Fix Cache Permissions Before Save
        if: always() && github.ref == 'refs/heads/main'
        run: |
          sudo chmod -R 777 .sccache .gocache .gomodcache .cargoregistry .cargogit 2>/dev/null || true

      - name: Save Toolchain & Build Caches
        uses: actions/cache/save@v6
        if: always() && github.ref == 'refs/heads/main'
        with:
          path: |
            .sccache
            .gocache
            .gomodcache
            .cargoregistry
            .cargogit
          key: build-cache-${{ matrix.build_system }}-${{ matrix.package }}-${{ matrix.channel }}-${{ github.sha }}

      - name: Save Package Build Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: "package-artifact-${{ matrix.package }}"
          path: output/
          retention-days: 1

      - name: Save Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: "build-log-${{ matrix.package }}-${{ matrix.channel }}"
          path: build_logs/
          retention-days: 1

  build-layer-1:
    name: "1:${{ matrix.package }}@${{ matrix.channel }}"
    needs: [generate-matrix, build-layer-0]
    if: ${{ always() && needs.generate-matrix.outputs.layer_1 != '[]' }}
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-matrix.outputs.layer_1) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare Workspace Permissions
        run: |
          mkdir -p build output build_logs .sccache .gocache .gomodcache .cargoregistry .cargogit
          sudo chmod -R 777 .

      - name: Download Layer 0 Dependency Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: package-artifact-*
          path: artifacts
          merge-multiple: true
        continue-on-error: true

      - name: Free Disk Space
        if: matrix.free_space
        uses: ./.github/actions/free-space

      - name: Setup Memory & Swap
        if: matrix.zram > 0 || matrix.swap > 0
        uses: ./.github/actions/setup-memory
        with:
          zram: ${{ matrix.zram }}
          swap: ${{ matrix.swap }}

      - name: Restore Toolchain & Build Caches
        uses: actions/cache/restore@v6
        with:
          path: |
            .sccache
            .gocache
            .gomodcache
            .cargoregistry
            .cargogit
          key: build-cache-${{ matrix.build_system }}-${{ matrix.package }}-${{ matrix.channel }}-${{ github.sha }}
          restore-keys: |
            build-cache-${{ matrix.build_system }}-${{ matrix.package }}-${{ matrix.channel }}-
            build-cache-${{ matrix.build_system }}-${{ matrix.package }}-
            build-cache-${{ matrix.build_system }}-
            build-cache-

      - name: Fix Cache Permissions
        run: |
          mkdir -p .sccache .gocache .gomodcache .cargoregistry .cargogit
          sudo chmod -R 777 .sccache .gocache .gomodcache .cargoregistry .cargogit 2>/dev/null || true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile Package Payload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG_NAME: ${{ matrix.package }}
          CHANNEL: ${{ matrix.channel }}
        run: |
          set -o pipefail
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          LOG_FILE="build_logs/${PKG_NAME}_${CHANNEL}.log"
          mkdir -p build_logs
          echo "=== STAGE: COMPILE ===" >> "${LOG_FILE}"

          docker run --rm \
            --volume "${{ github.workspace }}:/home/builder/RepoExe" \
            --workdir /home/builder/RepoExe \
            --env GH_TOKEN="${GH_TOKEN}" \
            --env PYTHONPATH="scripts" \
            --env GITHUB_WORKSPACE="${{ github.workspace }}" \
            --env SCCACHE_DIR="/home/builder/.cache/sccache" \
            --env GOCACHE="/home/builder/.cache/go-build" \
            --env GOMODCACHE="/home/builder/go/pkg/mod" \
            --volume "${{ github.workspace }}/.sccache:/home/builder/.cache/sccache" \
            --volume "${{ github.workspace }}/.gocache:/home/builder/.cache/go-build" \
            --volume "${{ github.workspace }}/.gomodcache:/home/builder/go/pkg/mod" \
            --volume "${{ github.workspace }}/.cargoregistry:/home/builder/.cargo/registry" \
            --volume "${{ github.workspace }}/.cargogit:/home/builder/.cargo/git" \
            "ghcr.io/${OWNER}/repoexe-builder:latest" \
            python3 scripts/cli/build.py compile "pkg/${PKG_NAME}" --channel "${CHANNEL}" 2>&1 | tee -a "${LOG_FILE}"

      - name: Profile Build Memory Peak
        if: always()
        run: |
          RAM_STR="N/A"
          SWAP_STR="N/A"
          CG_DIR="/sys/fs/cgroup$(awk -F: '$2=="" || $2=="{systemd}" {print $3}' /proc/self/cgroup 2>/dev/null)"
          [ -d "$CG_DIR" ] || CG_DIR="/sys/fs/cgroup"
          if [ -f "$CG_DIR/memory.peak" ]; then
            BYTES="$(cat "$CG_DIR/memory.peak" 2>/dev/null || echo 0)"
            if [ "$BYTES" -gt 0 ] 2>/dev/null; then
              RAM_STR="$(awk -v b="$BYTES" 'BEGIN {printf "%.2f GB (%d bytes)", b/1073741824, b}')"
            fi
          elif [ -f "/sys/fs/cgroup/memory/memory.max_usage_in_bytes" ]; then
            BYTES="$(cat "/sys/fs/cgroup/memory/memory.max_usage_in_bytes" 2>/dev/null || echo 0)"
            if [ "$BYTES" -gt 0 ] 2>/dev/null; then
              RAM_STR="$(awk -v b="$BYTES" 'BEGIN {printf "%.2f GB (%d bytes)", b/1073741824, b}')"
            fi
          fi
          if [ -f "$CG_DIR/memory.swap.peak" ]; then
            SBYTES="$(cat "$CG_DIR/memory.swap.peak" 2>/dev/null || echo 0)"
            if [ "$SBYTES" -gt 0 ] 2>/dev/null; then
              SWAP_STR="$(awk -v b="$SBYTES" 'BEGIN {printf "%.2f GB (%d bytes)", b/1073741824, b}')"
            fi
          fi
          # shellcheck disable=SC2129
          echo "### 📊 Peak Memory Consumption (${{ matrix.package }})" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "Peak RAM Usage:  ${RAM_STR}" >> "$GITHUB_STEP_SUMMARY"
          echo "Peak Swap Usage: ${SWAP_STR}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Assemble Package Archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG_NAME: ${{ matrix.package }}
          CHANNEL: ${{ matrix.channel }}
        run: |
          set -o pipefail
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          LOG_FILE="build_logs/${PKG_NAME}_${CHANNEL}.log"
          echo "=== STAGE: PACK ===" >> "${LOG_FILE}"

          docker run --rm \
            --volume "${{ github.workspace }}:/home/builder/RepoExe" \
            --workdir /home/builder/RepoExe \
            --env GH_TOKEN="${GH_TOKEN}" \
            --env PYTHONPATH="scripts" \
            --env GITHUB_WORKSPACE="${{ github.workspace }}" \
            --env SCCACHE_DIR="/home/builder/.cache/sccache" \
            --env GOCACHE="/home/builder/.cache/go-build" \
            --env GOMODCACHE="/home/builder/go/pkg/mod" \
            --volume "${{ github.workspace }}/.sccache:/home/builder/.cache/sccache" \
            --volume "${{ github.workspace }}/.gocache:/home/builder/.cache/go-build" \
            --volume "${{ github.workspace }}/.gomodcache:/home/builder/go/pkg/mod" \
            --volume "${{ github.workspace }}/.cargoregistry:/home/builder/.cargo/registry" \
            --volume "${{ github.workspace }}/.cargogit:/home/builder/.cargo/git" \
            "ghcr.io/${OWNER}/repoexe-builder:latest" \
            python3 scripts/cli/build.py pack "pkg/${PKG_NAME}" --channel "${CHANNEL}" 2>&1 | tee -a "${LOG_FILE}"

      - name: Termux Docker Smoke Test
        continue-on-error: true
        id: test_step
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG_NAME: ${{ matrix.package }}
          CHANNEL: ${{ matrix.channel }}
        run: |
          set -o pipefail
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          LOG_FILE="build_logs/${PKG_NAME}_${CHANNEL}.log"
          echo "=== STAGE: TEST ===" >> "${LOG_FILE}"

          docker run --rm \
            --volume "${{ github.workspace }}:/home/builder/RepoExe" \
            --workdir /home/builder/RepoExe \
            --env GH_TOKEN="${GH_TOKEN}" \
            --env PYTHONPATH="scripts" \
            --env GITHUB_WORKSPACE="${{ github.workspace }}" \
            --env SCCACHE_DIR="/home/builder/.cache/sccache" \
            --volume "${{ github.workspace }}/.sccache:/home/builder/.cache/sccache" \
            "ghcr.io/${OWNER}/repoexe-builder:latest" \
            python3 scripts/cli/build.py test "pkg/${PKG_NAME}" --channel "${CHANNEL}" 2>&1 | tee -a "${LOG_FILE}"

      - name: Fix Cache Permissions Before Save
        if: always() && github.ref == 'refs/heads/main'
        run: |
          sudo chmod -R 777 .sccache .gocache .gomodcache .cargoregistry .cargogit 2>/dev/null || true

      - name: Save Toolchain & Build Caches
        uses: actions/cache/save@v6
        if: always() && github.ref == 'refs/heads/main'
        with:
          path: |
            .sccache
            .gocache
            .gomodcache
            .cargoregistry
            .cargogit
          key: build-cache-${{ matrix.build_system }}-${{ matrix.package }}-${{ matrix.channel }}-${{ github.sha }}

      - name: Save Package Build Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: "package-artifact-${{ matrix.package }}"
          path: output/
          retention-days: 1

      - name: Save Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: "build-log-${{ matrix.package }}-${{ matrix.channel }}"
          path: build_logs/
          retention-days: 1

  build-layer-2:
    name: "2:${{ matrix.package }}@${{ matrix.channel }}"
    needs: [generate-matrix, build-layer-0, build-layer-1]
    if: ${{ always() && needs.generate-matrix.outputs.layer_2 != '[]' }}
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-matrix.outputs.layer_2) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare Workspace Permissions
        run: |
          mkdir -p build output build_logs .sccache .gocache .gomodcache .cargoregistry .cargogit
          sudo chmod -R 777 .

      - name: Download Prior Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: package-artifact-*
          path: artifacts
          merge-multiple: true
        continue-on-error: true

      - name: Free Disk Space
        if: matrix.free_space
        uses: ./.github/actions/free-space

      - name: Setup Memory & Swap
        if: matrix.zram > 0 || matrix.swap > 0
        uses: ./.github/actions/setup-memory
        with:
          zram: ${{ matrix.zram }}
          swap: ${{ matrix.swap }}

      - name: Restore Toolchain & Build Caches
        uses: actions/cache/restore@v6
        with:
          path: |
            .sccache
            .gocache
            .gomodcache
            .cargoregistry
            .cargogit
          key: build-cache-${{ matrix.build_system }}-${{ matrix.package }}-${{ matrix.channel }}-${{ github.sha }}
          restore-keys: |
            build-cache-${{ matrix.build_system }}-${{ matrix.package }}-${{ matrix.channel }}-
            build-cache-${{ matrix.build_system }}-${{ matrix.package }}-
            build-cache-${{ matrix.build_system }}-
            build-cache-

      - name: Fix Cache Permissions
        run: |
          mkdir -p .sccache .gocache .gomodcache .cargoregistry .cargogit
          sudo chmod -R 777 .sccache .gocache .gomodcache .cargoregistry .cargogit 2>/dev/null || true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile Package Payload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG_NAME: ${{ matrix.package }}
          CHANNEL: ${{ matrix.channel }}
        run: |
          set -o pipefail
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          LOG_FILE="build_logs/${PKG_NAME}_${CHANNEL}.log"
          mkdir -p build_logs
          echo "=== STAGE: COMPILE ===" >> "${LOG_FILE}"

          docker run --rm \
            --volume "${{ github.workspace }}:/home/builder/RepoExe" \
            --workdir /home/builder/RepoExe \
            --env GH_TOKEN="${GH_TOKEN}" \
            --env PYTHONPATH="scripts" \
            --env GITHUB_WORKSPACE="${{ github.workspace }}" \
            --env SCCACHE_DIR="/home/builder/.cache/sccache" \
            --env GOCACHE="/home/builder/.cache/go-build" \
            --env GOMODCACHE="/home/builder/go/pkg/mod" \
            --volume "${{ github.workspace }}/.sccache:/home/builder/.cache/sccache" \
            --volume "${{ github.workspace }}/.gocache:/home/builder/.cache/go-build" \
            --volume "${{ github.workspace }}/.gomodcache:/home/builder/go/pkg/mod" \
            --volume "${{ github.workspace }}/.cargoregistry:/home/builder/.cargo/registry" \
            --volume "${{ github.workspace }}/.cargogit:/home/builder/.cargo/git" \
            "ghcr.io/${OWNER}/repoexe-builder:latest" \
            python3 scripts/cli/build.py compile "pkg/${PKG_NAME}" --channel "${CHANNEL}" 2>&1 | tee -a "${LOG_FILE}"

      - name: Profile Build Memory Peak
        if: always()
        run: |
          RAM_STR="N/A"
          SWAP_STR="N/A"
          CG_DIR="/sys/fs/cgroup$(awk -F: '$2=="" || $2=="{systemd}" {print $3}' /proc/self/cgroup 2>/dev/null)"
          [ -d "$CG_DIR" ] || CG_DIR="/sys/fs/cgroup"
          if [ -f "$CG_DIR/memory.peak" ]; then
            BYTES="$(cat "$CG_DIR/memory.peak" 2>/dev/null || echo 0)"
            if [ "$BYTES" -gt 0 ] 2>/dev/null; then
              RAM_STR="$(awk -v b="$BYTES" 'BEGIN {printf "%.2f GB (%d bytes)", b/1073741824, b}')"
            fi
          elif [ -f "/sys/fs/cgroup/memory/memory.max_usage_in_bytes" ]; then
            BYTES="$(cat "/sys/fs/cgroup/memory/memory.max_usage_in_bytes" 2>/dev/null || echo 0)"
            if [ "$BYTES" -gt 0 ] 2>/dev/null; then
              RAM_STR="$(awk -v b="$BYTES" 'BEGIN {printf "%.2f GB (%d bytes)", b/1073741824, b}')"
