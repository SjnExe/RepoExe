name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      packages:
        description: 'Target specs (e.g. "all@all", "tsc@latest", "!jscpd")'
        required: false
        type: string
        default: 'all@all'
      publish:
        description: 'Publish release assets & update GitHub Pages site'
        required: false
        type: boolean
        default: true
      skip_build:
        description: 'Skip compilation step and re-index existing releases'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate-matrix:
    name: Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      should_publish: ${{ steps.decision.outputs.should_publish }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          uv pip install --system -r pyproject.toml || true
          pip install pytest ruff pydantic pyyaml

      - name: Audit & Health Check
        env:
          PYTHONPATH: scripts
        run: |
          python scripts/build.py check
          pytest scripts/tests/

      - name: Determine Publish Decision
        id: decision
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ] && [ "${{ inputs.publish }}" != "false" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Matrix
        id: matrix
        env:
          TARGET_INPUT: ${{ inputs.packages || 'auto' }}
          PYTHONPATH: scripts
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          MATRIX_JSON=$(python scripts/generate_shards.py)
          echo "matrix=$MATRIX_JSON" >> "$GITHUB_OUTPUT"

  build-package:
    name: "${{ matrix.package }}@${{ matrix.channel }}"
    needs: [generate-matrix]
    if: ${{ !inputs.skip_build && needs.generate-matrix.outputs.matrix != '[]' }}
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Restore Go Cache
        if: matrix.build_system == 'go'
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-cache-${{ runner.os }}-${{ matrix.package }}-${{ hashFiles('**/go.mod', 'pkg/tsc/build.yml') }}
          restore-keys: |
            go-cache-${{ runner.os }}-${{ matrix.package }}-

      - name: Restore Cargo Cache
        if: matrix.build_system == 'cargo'
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-cache-${{ runner.os }}-${{ matrix.package }}-${{ hashFiles('**/Cargo.lock', 'pkg/*/build.yml') }}
          restore-keys: |
            cargo-cache-${{ runner.os }}-${{ matrix.package }}-

      - name: Free Disk Space
        if: env.HEAVY == 'true'
        uses: ./.github/actions/free-space

      - name: Enable 4GB Swap
        if: env.HEAVY == 'true'
        uses: ./.github/actions/setup-swap
        with:
          size: '4G'

      - name: Prepare Workspace & Cache Directories
        run: |
          mkdir -p build output build_logs ~/.cache/go-build ~/go/pkg/mod ~/.cargo/registry ~/.cargo/git
          sudo chmod -R 777 . ~/.cache/go-build ~/go ~/.cargo

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile Package Payload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG_NAME: ${{ matrix.package }}
          CHANNEL: ${{ matrix.channel }}
        run: |
          set -o pipefail
          OWNER=$(echo "${{ github.repository_owner }}" | tr "[:upper:]" "[:lower:]")
          LOG_FILE="build_logs/${PKG_NAME}_${CHANNEL}.log"
          echo "=== STAGE: COMPILE ===" >> "$LOG_FILE"

          docker run --rm \
            -v ${{ github.workspace }}:/home/builder/RepoExe \
            -v ~/.cache/go-build:/home/builder/.cache/go-build \
            -v ~/go/pkg/mod:/home/builder/go/pkg/mod \
            -v ~/.cargo/registry:/home/builder/.cargo/registry \
            -v ~/.cargo/git:/home/builder/.cargo/git \
            -w /home/builder/RepoExe \
            -e GH_TOKEN="$GH_TOKEN" \
            -e PYTHONPATH="scripts" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            "ghcr.io/$OWNER/repoexe-builder:latest" \
            sh -c "python3 -m pip install --break-system-packages --quiet pyyaml pydantic 2>/dev/null || true; python3 scripts/build.py compile \"pkg/$PKG_NAME\" --channel \"$CHANNEL\"" 2>&1 | tee -a "$LOG_FILE"

      - name: Assemble Package Archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG_NAME: ${{ matrix.package }}
          CHANNEL: ${{ matrix.channel }}
        run: |
          set -o pipefail
          OWNER=$(echo "${{ github.repository_owner }}" | tr "[:upper:]" "[:lower:]")
          LOG_FILE="build_logs/${PKG_NAME}_${CHANNEL}.log"
          echo "=== STAGE: PACK ===" >> "$LOG_FILE"

          docker run --rm \
            -v ${{ github.workspace }}:/home/builder/RepoExe \
            -w /home/builder/RepoExe \
            -e GH_TOKEN="$GH_TOKEN" \
            -e PYTHONPATH="scripts" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            "ghcr.io/$OWNER/repoexe-builder:latest" \
            sh -c "python3 -m pip install --break-system-packages --quiet pyyaml pydantic 2>/dev/null || true; python3 scripts/build.py pack \"pkg/$PKG_NAME\" --channel \"$CHANNEL\"" 2>&1 | tee -a "$LOG_FILE"

      - name: Termux Docker Smoke Test
        continue-on-error: true
        id: test_step
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG_NAME: ${{ matrix.package }}
          CHANNEL: ${{ matrix.channel }}
        run: |
          set -o pipefail
          OWNER=$(echo "${{ github.repository_owner }}" | tr "[:upper:]" "[:lower:]")
          LOG_FILE="build_logs/${PKG_NAME}_${CHANNEL}.log"
          echo "=== STAGE: TEST ===" >> "$LOG_FILE"

          docker run --rm \
            -v ${{ github.workspace }}:/home/builder/RepoExe \
            -w /home/builder/RepoExe \
            -e GH_TOKEN="$GH_TOKEN" \
            -e PYTHONPATH="scripts" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            "ghcr.io/$OWNER/repoexe-builder:latest" \
            sh -c "python3 -m pip install --break-system-packages --quiet pyyaml pydantic 2>/dev/null || true; python3 scripts/build.py test \"pkg/$PKG_NAME\" --channel \"$CHANNEL\"" 2>&1 | tee -a "$LOG_FILE"

      - name: Check Build and Test Status
        if: steps.build_step.outcome == 'failure' || steps.test_step.outcome == 'failure'
        run: |
          echo "::error::Target failed during build or test. Check aggregated logs."
          bash -c 'exit 1'

      - name: Save Go Cache (Main Branch Only)
        if: github.ref == 'refs/heads/main' && matrix.build_system == 'go' && always()
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-cache-${{ runner.os }}-${{ matrix.package }}-${{ hashFiles('**/go.mod', 'pkg/tsc/build.yml') }}

      - name: Save Cargo Cache (Main Branch Only)
        if: github.ref == 'refs/heads/main' && matrix.build_system == 'cargo' && always()
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-cache-${{ runner.os }}-${{ matrix.package }}-${{ hashFiles('**/Cargo.lock', 'pkg/*/build.yml') }}

      - name: Upload Single Target Build Log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log-${{ matrix.package }}-${{ matrix.channel }}
          path: build_logs/
          retention-days: 1

      - name: Publish Release Tag & Artifacts
        if: ${{ needs.generate-matrix.outputs.should_publish == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG_NAME: ${{ matrix.package }}
          CHANNEL: ${{ matrix.channel }}
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr "[:upper:]" "[:lower:]")
          TAG="${PKG_NAME}@${CHANNEL}"
          RECIPE_VER=$(docker run --rm -v ${{ github.workspace }}:/home/builder/RepoExe -w /home/builder/RepoExe -e PYTHONPATH="scripts" "ghcr.io/$OWNER/repoexe-builder:latest" python3 -c "from core.parser import parse_recipe; from pathlib import Path; r=parse_recipe(Path('pkg/$PKG_NAME/build.yml'), channel='$CHANNEL'); print(r.version)")
          RELEASE_TITLE="$PKG_NAME v$RECIPE_VER [$CHANNEL]"

          gh release create "$TAG" --title "$RELEASE_TITLE" --notes "Automated release build for $TAG" 2>/dev/null || gh release edit "$TAG" --title "$RELEASE_TITLE" --notes "Automated release build for $TAG"

          if [ -d "output" ] && [ "$(ls -A output)" ]; then
            for file in output/*; do
              if [ -f "$file" ]; then
                filename=$(basename "$file")
                if [[ "$filename" == *"_metadata.json" ]]; then
                  gh release upload "$TAG" "$file#metadata.json" --clobber
                else
                  gh release upload "$TAG" "$file" --clobber
                fi
              fi
            done
          fi

  build-status:
    name: Build Status & Log Aggregator
    needs: [generate-matrix, build-package]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download All Target Build Logs
        uses: actions/download-artifact@v8
        with:
          pattern: build-log-*
          path: all_logs
          merge-multiple: true
        continue-on-error: true

      - name: Aggregate All Logs Into Summary Text File
        run: |
          mkdir -p summary
          if [ -d "all_logs" ]; then
            python3 scripts/core/log_aggregator.py all_logs summary/all_build_logs.txt
          else
            echo "No build logs collected." > summary/all_build_logs.txt
          fi

      - name: Upload Aggregated Log Summary Artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aggregated-build-logs
          path: summary/all_build_logs.txt
          retention-days: 7

      - name: Verify Matrix Results
        run: |
          if [ "${{ needs.build-package.result }}" = "failure" ] || [ "${{ needs.build-package.result }}" = "cancelled" ]; then
            echo "❌ Matrix build failed! Download the 'aggregated-build-logs' artifact for detailed logs."
            exit 1
          fi
          echo "✓ All matrix targets built successfully or skipped."

  publish-site:
    name: Deploy
    needs: [generate-matrix, build-package]
    if: always() && needs.generate-matrix.outputs.should_publish == 'true' && (needs.build-package.result == 'success' || needs.build-package.result == 'failure' || needs.build-package.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Build Tools & GPG
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev libarchive-tools zip unzip jq gh gpg
          pip install pydantic pyyaml

      - name: Download All Release Artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts
          TAGS=$(gh release list --limit 1000 --json tagName --jq '.[].tagName' || true)
          for tag in $TAGS; do
            gh release download "$tag" --dir artifacts || true
          done

      - name: Import GPG Private Key for Repository Signing
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "$GPG_PRIVATE_KEY" | gpg --batch --import || echo "Notice: GPG key import failed."
          else
            echo "Notice: GPG_PRIVATE_KEY secret is omitted; repository metadata will remain unsigned."
          fi

      - name: Build Full Site & Repository Indexes
        env:
          PYTHONPATH: scripts
        run: |
          python -c "
          from core.index_gen import prepare_site
          prepare_site('site', 'artifacts')
          "

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Prune Outdated Release Tag Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: scripts
        run: |
          python -c "
          from core.prune import prune_release_tags
          prune_release_tags()
          " || echo "Notice: Release asset pruning completed."
