  build-status:
    name: Build Status & Log Aggregator
    needs: [generate-matrix, build-layer-0, build-layer-1, build-layer-2, build-layer-3]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Download All Target Build Logs
        uses: actions/download-artifact@v8
        with:
          pattern: build-log-*
          path: all_logs
          merge-multiple: true
        continue-on-error: true

      - name: Aggregate All Logs
        run: |
          mkdir -p summary
          if [ -d "all_logs" ]; then
            python3 scripts/utils/log_aggregator.py all_logs summary/all_build_logs.txt
          else
            echo "No build logs collected." > summary/all_build_logs.txt
          fi

      - name: Upload Aggregated Log Summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aggregated-build-logs
          path: summary/all_build_logs.txt
          retention-days: 7

  publish-site:
    name: Deploy
    needs: [generate-matrix, build-layer-0, build-layer-1, build-layer-2, build-layer-3]
    if: always() && needs.generate-matrix.outputs.should_publish == 'true' && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: package-artifact-*
          path: artifacts
          merge-multiple: true
        continue-on-error: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: true

      - name: Install Build Tools & GPG
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev libarchive-tools zip unzip jq gh gpg
          pip install pydantic pyyaml

      - name: Build Full Site & Repository Indexes
        env:
          PYTHONPATH: scripts
        run: |
          python scripts/cli/index_gen.py

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
