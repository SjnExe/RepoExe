name: Build

on:
  push:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'scripts/mixins/**'
      - 'ndk-patches/**'
  pull_request:
    paths:
      - 'packages/**'
      - 'scripts/mixins/**'
      - 'ndk-patches/**'
  workflow_dispatch:
    inputs:
      packages:
        description: 'Space separated list of packages to build (use @all to build everything)'
        required: true
        default: '@all'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [aarch64, arm, i686, x86_64]
      fail-fast: false

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Free disk space
        run: sudo ./scripts/free-space.sh || true

      - name: Setup ZRAM
        uses: ./.github/actions/zram

      - name: Determine packages to build
        id: pkgs
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.packages }}" == "@all" ]; then
              ALL_PKGS=$(ls -d packages/*/ | xargs -n 1 basename | tr '\n' ' ')
              echo "packages=${ALL_PKGS}" >> $GITHUB_OUTPUT
            else
              echo "packages=${{ github.event.inputs.packages }}" >> $GITHUB_OUTPUT
            fi
          elif [ "${{ github.event_name }}" == "pull_request" ]; then
            BASE_COMMIT=${{ github.event.pull_request.base.sha }}
            HEAD_COMMIT=${{ github.event.pull_request.head.sha }}
            CHANGED=$(git diff-tree --no-commit-id --name-only -r $BASE_COMMIT $HEAD_COMMIT | grep '^packages/' | cut -d/ -f2 | sort -u | tr '\n' ' ')
            echo "packages=${CHANGED}" >> $GITHUB_OUTPUT
          else
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.event.after }}"

            # If BEFORE is missing or zeroes (e.g., initial push or forced push), just check the last commit
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
               BEFORE="HEAD^1"
               AFTER="HEAD"
            fi

            CHANGED=$(git diff-tree --no-commit-id --name-only -r $BEFORE $AFTER | grep '^packages/' | cut -d/ -f2 | sort -u | tr '\n' ' ')
            echo "packages=${CHANGED}" >> $GITHUB_OUTPUT
          fi

      - name: Restore cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.ccache
            output
          key: ${{ runner.os }}-build-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-build-${{ matrix.arch }}-

      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Packages
        run: |
          echo "Building packages for ${{ matrix.arch }}: ${{ steps.pkgs.outputs.packages }}"
          mkdir -p output ~/.ccache

          if [ -z "${{ steps.pkgs.outputs.packages }}" ] || [ "${{ steps.pkgs.outputs.packages }}" = " " ]; then
            echo "No changed packages found. Skipping build loop."
            exit 0
          fi

          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          # We execute the build inside the custom container via docker run
          docker run --rm \
            -u builder \
            --device /dev/fuse \
            --cap-add SYS_ADMIN \
            --security-opt apparmor:unconfined \
            -v ${{ github.workspace }}:/home/builder/RepoExe \
            -v ~/.ccache:/home/builder/.ccache \
            -w /home/builder/RepoExe \
            -e REPO_ROOT=/home/builder/RepoExe \
            ghcr.io/$OWNER/repoexe-builder:latest \
            bash -c "set -e
              # Inject live RepoExe URL for concurrent dependency resolution
              sudo mkdir -p /data/data/com.termux/files/usr/etc/apt/sources.list.d/
              echo 'deb [trusted=yes] https://SjnExe.github.io/RepoExe/ stable main' | sudo tee /data/data/com.termux/files/usr/etc/apt/sources.list.d/repoexe.list > /dev/null

              # Clone Termux build infrastructure
              echo 'Cloning termux-packages...'
              git clone --depth 1 https://github.com/termux/termux-packages.git /home/builder/termux-packages

              # Apply NDK patches
              if [ -d \"ndk-patches/29\" ]; then
                echo 'Applying NDK patches...'
                for patch in ndk-patches/29/*.patch; do
                  if [ -f \"\$patch\" ]; then
                    echo \"Applying \$patch\"
                    sudo patch -p1 -d /home/builder/lib/android-ndk/sysroot < \"\$patch\" || true
                  fi
                done
              fi

              # Phase 1: Mirror all RepoExe packages into the build environment first.
              # This explicitly deletes and replaces the official Termux package directories
              # with ours to prevent buildorder.py conflicts (e.g., legacy subpackages).
              for pkg_dir in packages/*; do
                if [ -d \"\$pkg_dir\" ]; then
                  pkg=\$(basename \"\$pkg_dir\")
                  rm -rf \"/home/builder/termux-packages/packages/\$pkg\"
                  cp -a \"\$pkg_dir\" \"/home/builder/termux-packages/packages/\"
                fi
              done

              # Phase 2: Build the changed packages.
              for pkg in ${{ steps.pkgs.outputs.packages }}; do
                if [ ! -d \"packages/\$pkg\" ]; then
                  echo \"Skipping \$pkg because it no longer exists.\"
                  continue
                fi

                echo \"Building \$pkg...\"

                # Universal Packages Optimization
                if grep -q 'TERMUX_PKG_PLATFORM_INDEPENDENT=true' \"packages/\$pkg/build.sh\"; then
                  if [ \"${{ matrix.arch }}\" != \"aarch64\" ]; then
                    echo \"Skipping \$pkg on ${{ matrix.arch }} because it is architecture independent.\"
                    continue
                  fi
                fi

                cd /home/builder/termux-packages
                ./build-package.sh -a ${{ matrix.arch }} -I \$pkg

                mv output/*.deb /home/builder/RepoExe/output/ 2>/dev/null || true
                cd /home/builder/RepoExe
              done
            "

      - name: Save cache
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.ccache
            output
          key: ${{ runner.os }}-build-${{ matrix.arch }}-${{ github.sha }}

      # Generate SLSA build provenance (only for non-PR runs)
      - name: Generate build provenance
        if: github.event_name != 'pull_request' && hashFiles('output/*.deb') != ''
        uses: actions/attest@v4
        with:
          subject-path: 'output/*.deb'

      - name: Upload to GitHub Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for pkg in ${{ steps.pkgs.outputs.packages }}; do
            if [ ! -d "packages/$pkg" ]; then
              continue
            fi

            # Extract version from build.sh
            VERSION=""
            if grep -q '^TERMUX_PKG_VERSION=' "packages/$pkg/build.sh"; then
              VERSION=$(grep '^TERMUX_PKG_VERSION=' "packages/$pkg/build.sh" | cut -d= -f2 | tr -d \''"')
            fi

            TAG="$pkg"
            TITLE="$pkg"
            if [ -n "$VERSION" ]; then
              TITLE="$pkg $VERSION"
            fi

            NOTES="Automated build for $pkg"$'\n'"- **Version:** ${VERSION:-Unknown}"$'\n'"- **Architecture:** ${{ matrix.arch }}"$'\n'"- **Commit:** ${{ github.sha }}"

            gh release create "$TAG" --title "$TITLE" --notes "$NOTES" || true

            # To prevent race conditions across matrix jobs, ONLY aarch64 is allowed to prune and upload _all.deb files
            # (Because universal packages are only built on the aarch64 runner)

            if [ "${{ matrix.arch }}" = "aarch64" ]; then
              echo "Pruning old assets for $TAG (${{ matrix.arch }} & all)..."
              OLD_ASSETS=$(gh release view "$TAG" --json assets --jq ".assets[].name | select(endswith(\"_${{ matrix.arch }}.deb\") or endswith(\"_all.deb\"))" || true)
            else
              echo "Pruning old assets for $TAG (${{ matrix.arch }})..."
              OLD_ASSETS=$(gh release view "$TAG" --json assets --jq ".assets[].name | select(endswith(\"_${{ matrix.arch }}.deb\"))" || true)
            fi

            for asset in $OLD_ASSETS; do
              gh release delete-asset "$TAG" "$asset" -y || true
            done

            echo "Uploading new assets for $TAG..."
            UPLOAD_FILES=""
            if ls output/*_${{ matrix.arch }}.deb 1> /dev/null 2>&1; then
              UPLOAD_FILES="$UPLOAD_FILES output/*_${{ matrix.arch }}.deb"
            fi

            if [ "${{ matrix.arch }}" = "aarch64" ]; then
              if ls output/*_all.deb 1> /dev/null 2>&1; then
                UPLOAD_FILES="$UPLOAD_FILES output/*_all.deb"
              fi
            fi

            if [ -n "$UPLOAD_FILES" ]; then
              gh release upload "$TAG" $UPLOAD_FILES
            else
              echo "No .deb files found to upload for $pkg"
            fi
          done
