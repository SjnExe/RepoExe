name: Build

on:
  push:
    branches:
      - main
    paths:
      - 'pkg/**'
      - 'scripts/**'
  pull_request:
    branches:
      - main
    paths:
      - 'pkg/**'
      - 'scripts/**'
  workflow_dispatch:
    inputs:
      packages:
        description: 'Target packages (e.g. "all", "tsc", "tsc@latest")'
        required: true
        default: 'all'
      publish_repo:
        description: 'Publish the built packages to the repository if successful'
        required: false
        type: boolean
        default: true

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.sharding.outputs.shards }}
      publish_decision: ${{ steps.decision.outputs.publish_decision }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set publish decision
        id: decision
        run: |
          if [ "${{ github.event_name }}" == "push" ] && [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "publish_decision=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ inputs.publish_repo }}" == "true" ]; then
            echo "publish_decision=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish_decision=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Determine target packages
        id: pkgs
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "targets=${{ github.event.inputs.packages }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" == "pull_request" ]; then
            BASE_COMMIT=${{ github.event.pull_request.base.sha }}
            HEAD_COMMIT=${{ github.event.pull_request.head.sha }}
            CHANGED=$(git diff-tree --no-commit-id --name-only -r "$BASE_COMMIT" "$HEAD_COMMIT" | grep '^pkg/' | cut -d/ -f2 | sort -u | tr '\n' ' ')
            echo "targets=${CHANGED}" >> "$GITHUB_OUTPUT"
          else
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.event.after }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
               BEFORE="HEAD^1"
               AFTER="HEAD"
            fi
            CHANGED=$(git diff-tree --no-commit-id --name-only -r "$BEFORE" "$AFTER" | grep '^pkg/' | cut -d/ -f2 | sort -u | tr '\n' ' ')
            echo "targets=${CHANGED}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Shards
        id: sharding
        env:
          TARGET_INPUT: ${{ steps.pkgs.outputs.targets }}
        run: |
          SHARDS_JSON=$(uv run python scripts/generate_shards.py)
          echo "shards=$SHARDS_JSON" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    if: needs.prepare.outputs.shards != '[]' && needs.prepare.outputs.shards != ''
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64]
        shard: ${{ fromJson(needs.prepare.outputs.shards) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Packages inside Container
        run: |
          mkdir -p output
          chmod 777 output
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          docker run -d --name repoexe-daemon \
            -v ${{ github.workspace }}:/home/builder/RepoExe \
            -w /home/builder/RepoExe \
            "ghcr.io/$OWNER/repoexe-builder:latest" sleep infinity

          docker exec -u 0 repoexe-daemon bash -c '
            chmod -R 777 /home/builder/RepoExe
            for target in ${{ matrix.shard.packages }} ; do
              pkg=$(echo "$target" | cut -d: -f1)
              ch=$(echo "$target" | cut -d: -f2)
              [ -d "pkg/$pkg" ] || continue
              echo "=== Building $pkg ($ch) ==="
              uv run python scripts/build.py build "pkg/$pkg" --channel "$ch"
            done
          '
          docker rm -f repoexe-daemon
          sudo chown -R $USER:$USER .

      - name: Upload Build Artifacts for Testing
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts-shard-${{ matrix.shard.shard }}
          path: output/

      - name: Generate Job Summary
        run: |
          echo "### 📦 Built Packages (Shard ${{ matrix.shard.shard }})" >> $GITHUB_STEP_SUMMARY
          echo "| Package Target | Artifacts Generated |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          for target in ${{ matrix.shard.packages }}; do
            pkg=$(echo "$target" | cut -d: -f1)
            files=$(find output/ -type f \( -name "${pkg}*" -o -name "*${pkg}*" \) -exec basename {} \; | tr '\n' ', ')
            echo "| \`$target\` | \`${files:-None}\` |" >> $GITHUB_STEP_SUMMARY
          done

      - name: Publish GitHub Releases (Main & Dispatched Published Builds)
        if: needs.prepare.outputs.publish_decision == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MATRIX_PACKAGES: ${{ matrix.shard.packages }}
        run: |
          for target in $MATRIX_PACKAGES; do
            pkg=$(echo "$target" | cut -d: -f1)
            ch=$(echo "$target" | cut -d: -f2)
            [ -d "pkg/$pkg" ] || continue

            TAG="${pkg}@${ch}"
            
            META_JSON=$(uv run python -c "import os, json; from pathlib import Path; from core.parser import parse_recipe; pkg = '$pkg'; ch = '$ch'; recipe_path = Path(f'pkg/{pkg}/build.yml'); r = parse_recipe(recipe_path, channel=ch); print(json.dumps({'name': r.name, 'version': r.version, 'revision': r.revision, 'channel': r.active_channel, 'state_hash': r.state_hash}))")
            
            PKG_VER=$(echo "$META_JSON" | python3 -c "import sys, json; print(json.load(sys.stdin)['version'])")
            TITLE="${pkg} v${PKG_VER} [${ch}]"

            gh release create "$TAG" --title "$TITLE" --notes "Automated release build for $pkg@$ch" || true
            echo "$META_JSON" > output/metadata.json

            FILES=$(find output/ -type f \( -name "${pkg}*" -o -name "*${pkg}*" -o -name "metadata.json" \))
            if [ -n "$FILES" ]; then
              gh release upload "$TAG" $FILES --clobber
            fi
          done

  trigger_publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    if: always() && needs.prepare.outputs.publish_decision == 'true'
    steps:
      - name: Save publish decision
        run: echo "true" > publish_decision.txt
      - name: Upload decision artifact
        uses: actions/upload-artifact@v7
        with:
          name: publish_decision
          path: publish_decision.txt
