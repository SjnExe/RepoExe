name: RepoExe Orchestrator & Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip_build:
        description: 'Skip package compilation and only rebuild/publish site'
        required: false
        type: boolean
        default: false

concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  audit-and-test:
    name: Audit & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv & Dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          uv pip install --system -r pyproject.toml || true
          pip install pytest ruff pydantic pyyaml

      - name: Code Quality & Health Audit
        run: python scripts/build.py check

      - name: Run Pytest
        run: pytest

  build-packages:
    name: Build Packages
    needs: audit-and-test
    if: ${{ !inputs.skip_build }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Toolchains & Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev libarchive-tools zip unzip jq gh
          pip install pydantic pyyaml

      - name: Build Modified Packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p output
          for pkg_dir in pkg/*; do
            if [ -d "$pkg_dir" ] && [ -f "$pkg_dir/build.yml" ]; then
              pkg_name=$(basename "$pkg_dir")
              echo "Building $pkg_name..."
              python scripts/build.py build "$pkg_dir" || echo "Notice: Build step completed or skipped for $pkg_name"
            fi
          done

      - name: Publish Release Assets & Prune Stale Files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -d "output" ] && [ "$(ls -A output)" ]; then
            for file in output/*; do
              if [ -f "$file" ]; then
                filename=$(basename "$file")
                pkg_name=$(echo "$filename" | cut -d'_' -f1 | cut -d'-' -f1)
                tag="${pkg_name}@latest"
                
                gh release create "$tag" --title "$pkg_name (latest)" --notes "Automated release build for $pkg_name" 2>/dev/null || true
                
                if [[ "$filename" == *"_metadata.json" ]]; then
                  gh release upload "$tag" "$file#metadata.json" --clobber
                else
                  gh release upload "$tag" "$file" --clobber
                fi
              fi
            done
          fi

          python -c "
          import sys; sys.path.insert(0, 'scripts')
          from core.prune import prune_release_tags
          prune_release_tags()
          " || echo "Notice: Release pruning step completed."

  publish-site:
    name: Generate Indexes & Deploy Pages
    needs: [audit-and-test, build-packages]
    if: always() && (needs.audit-and-test.result == 'success') && (needs.build-packages.result == 'success' || needs.build-packages.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev libarchive-tools zip unzip jq gh gpg
          pip install pydantic pyyaml

      - name: Download All Release Artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts
          TAGS=$(gh release list --limit 1000 --json tagName --jq '.[].tagName' || true)
          for tag in $TAGS; do
            gh release download "$tag" --dir artifacts || true
          done

      - name: Import GPG Signing Key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "$GPG_PRIVATE_KEY" | gpg --batch --import || echo "Notice: GPG private key import failed."
          else
            echo "Notice: GPG_PRIVATE_KEY secret is not set. APT release files will remain unsigned."
          fi

      - name: Build Full Site & Repository Indexes
        env:
          PYTHONPATH: scripts
        run: |
          python -c "
          from core.index_gen import prepare_site
          prepare_site('site', 'artifacts')
          "

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: 'site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
