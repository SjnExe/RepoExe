            --env GOCACHE="/home/builder/.cache/go-build" \
            --env GOMODCACHE="/home/builder/go/pkg/mod" \
            --volume "${{ github.workspace }}/.sccache:/home/builder/.cache/sccache" \
            --volume "${{ github.workspace }}/.gocache:/home/builder/.cache/go-build" \
            --volume "${{ github.workspace }}/.gomodcache:/home/builder/go/pkg/mod" \
            --volume "${{ github.workspace }}/.cargoregistry:/home/builder/.cargo/registry" \
            --volume "${{ github.workspace }}/.cargogit:/home/builder/.cargo/git" \
            "ghcr.io/${OWNER}/repoexe-builder:latest" \
            python3 scripts/cli/build.py compile "pkg/${PKG_NAME}" --channel "${CHANNEL}" 2>&1 | tee -a "${LOG_FILE}"

