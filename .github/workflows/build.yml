name: Build

on:
  push:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'scripts/**'
  pull_request:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'scripts/**'
  workflow_dispatch:
    inputs:
      packages:
        description: 'Space separated list of packages to build'
        required: true
        default: '@all'
      channel:
        description: 'Target channel to build (e.g. latest, v1, beta)'
        required: false
        default: 'latest'
      publish_repo:
        description: 'Publish the built packages to the repository if successful'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.sharding.outputs.shards }}
      publish_decision: ${{ steps.decision.outputs.publish_decision }}
      channel: ${{ steps.channel.outputs.channel }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine channel
        id: channel
        run: |
          CH="${{ inputs.channel }}"
          if [ -z "$CH" ]; then CH="latest"; fi
          echo "channel=$CH" >> "$GITHUB_OUTPUT"

      - name: Set publish decision
        id: decision
        run: |
          if [ "${{ github.event_name }}" == "push" ] && [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "publish_decision=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ inputs.publish_repo }}" == "true" ]; then
            echo "publish_decision=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish_decision=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: 'scripts/uv.lock'

      - name: Determine changed packages
        id: pkgs
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.packages }}" == "@all" ]; then
              echo "packages=$(find packages -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | tr '
' ' ')" >> "$GITHUB_OUTPUT"
            else
              echo "packages=${{ github.event.inputs.packages }}" >> "$GITHUB_OUTPUT"
            fi
          elif [ "${{ github.event_name }}" == "pull_request" ]; then
            BASE_COMMIT=${{ github.event.pull_request.base.sha }}
            HEAD_COMMIT=${{ github.event.pull_request.head.sha }}
            CHANGED=$(git diff-tree --no-commit-id --name-only -r "$BASE_COMMIT" "$HEAD_COMMIT" | grep '^packages/' | cut -d/ -f2 | sort -u | tr '
' ' ')
            echo "packages=${CHANGED}" >> "$GITHUB_OUTPUT"
            echo "is_pr=true" >> "$GITHUB_OUTPUT"
          else
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.event.after }}"

            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
               BEFORE="HEAD^1"
               AFTER="HEAD"
            fi

            CHANGED=$(git diff-tree --no-commit-id --name-only -r "$BEFORE" "$AFTER" | grep '^packages/' | cut -d/ -f2 | sort -u | tr '
' ' ')
            echo "packages=${CHANGED}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Shards
        id: sharding
        run: |
          cd scripts
          uv run python -c "import json, sys; from core.dag import DependencyGraph; dag = DependencyGraph('../packages'); changed_pkgs_str = '${{ steps.pkgs.outputs.packages }}'; is_pr = '${{ steps.pkgs.outputs.is_pr }}' == 'true'; tokens = changed_pkgs_str.split() if changed_pkgs_str.strip() else []; target_packages = [t for t in tokens if not t.startswith('!')] if tokens else None; excluded_packages = {t[1:] for t in tokens if t.startswith('!')}; shards = dag.get_shards(target_packages=target_packages, excluded_packages=excluded_packages, is_pr=is_pr, num_shards=4); print(json.dumps([{'shard': i, 'packages': ' '.join(s)} for i, s in enumerate(shards) if s]))" > shards.json
          echo "shards=$(cat shards.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    if: ${{ needs.prepare.outputs.shards != '[]' && needs.prepare.outputs.shards != '' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64]
        shard: ${{ fromJson(needs.prepare.outputs.shards) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: 'scripts/uv.lock'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Packages
        run: |
          echo "Building packages for ${{ matrix.arch }} (Shard ${{ matrix.shard.shard }}): ${{ matrix.shard.packages }}"
          mkdir -p output
          chmod 777 output

          if [ -n "${{ matrix.shard.packages }}" ]; then
            OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

            docker run -d --name repoexe-daemon               -v ${{ github.workspace }}:/home/builder/RepoExe               -w /home/builder/RepoExe               "ghcr.io/$OWNER/repoexe-builder:latest" sleep infinity

            docker exec repoexe-daemon bash -c '
              for pkg in ${{ matrix.shard.packages }} ; do
                if [ ! -d "packages/$pkg" ]; then
                  continue
                fi

                echo "Building $pkg (Channel: ${{ needs.prepare.outputs.channel }})..."
                uv --project scripts run python scripts/build.py build "packages/$pkg" --channel "${{ needs.prepare.outputs.channel }}" || continue
                mv output/*.deb /home/builder/RepoExe/output/ 2>/dev/null || true
              done
            '

            docker rm -f repoexe-daemon
          fi

      - name: Upload to GitHub Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CH="${{ needs.prepare.outputs.channel }}"

          for pkg in ${{ matrix.shard.packages }}; do
            if [ ! -d "packages/$pkg" ]; then
              continue
            fi

            TAG="${pkg}@${CH}"
            META_JSON=$(uv --project scripts run python -c "from scripts.core.parser import parse_recipe; from pathlib import Path; import json; r = parse_recipe(Path('packages/$pkg/build.yml'), channel='$CH'); print(json.dumps({'name': r.name, 'version': r.version, 'revision': r.revision, 'channel': r.active_channel, 'state_hash': r.state_hash}))")

            PKG_VER=$(echo "$META_JSON" | python3 -c "import sys, json; print(json.load(sys.stdin)['version'])")
            PKG_REV=$(echo "$META_JSON" | python3 -c "import sys, json; print(json.load(sys.stdin)['revision'])")
            STATE_HASH=$(echo "$META_JSON" | python3 -c "import sys, json; print(json.load(sys.stdin)['state_hash'])")

            if [ "$PKG_REV" -gt 0 ] 2>/dev/null; then
              FULL_VER="${PKG_VER}-${PKG_REV}"
            else
              FULL_VER="${PKG_VER}"
            fi

            TITLE="${pkg} v${FULL_VER} [${CH}]"
            NOTES="Automated build for ${pkg}@${CH}"$'
'"- **Commit:** ${{ github.sha }}"$'
'"- **State Hash:** ${STATE_HASH}"

            gh release create "$TAG" --title "$TITLE" --notes "$NOTES" || true
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" || true

            echo "$META_JSON" > metadata.json
            gh release upload "$TAG" metadata.json --clobber || true

            UPLOAD_FILES=""
            if ls output/*.deb 1> /dev/null 2>&1; then
              UPLOAD_FILES=$(ls output/*.deb)
            fi

            if [ -n "$UPLOAD_FILES" ]; then
              gh release upload "$TAG" $UPLOAD_FILES --clobber
            fi
          done

  trigger_publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    if: always() && needs.prepare.outputs.publish_decision == 'true'
    steps:
      - name: Save publish decision
        run: echo "true" > publish_decision.txt
      - name: Upload decision artifact
        uses: actions/upload-artifact@v7
        with:
          name: publish_decision
          path: publish_decision.txt
