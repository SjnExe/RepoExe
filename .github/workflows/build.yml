name: Build

on:
  push:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'scripts/**'
  pull_request:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'scripts/**'
  workflow_dispatch:
    inputs:
      packages:
        description: 'Space separated list of packages to build (use @all to build everything)'
        required: true
        default: '@all'
      publish_repo:
        description: 'Publish the built packages to the repository if successful'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.sharding.outputs.shards }}
      publish_decision: ${{ steps.decision.outputs.publish_decision }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set publish decision
        id: decision
        run: |
          if [ "${{ github.event_name }}" == "push" ] && [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "publish_decision=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ inputs.publish_repo }}" == "true" ]; then
            echo "publish_decision=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish_decision=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          enable-cache-save: ${{ github.event_name != 'pull_request' }}
          cache-dependency-glob: 'scripts/uv.lock'

      - name: Determine changed packages
        id: pkgs
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.packages }}" == "@all" ]; then
              echo "packages=$(find packages -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
            else
              echo "packages=${{ github.event.inputs.packages }}" >> "$GITHUB_OUTPUT"
            fi
          elif [ "${{ github.event_name }}" == "pull_request" ]; then
            BASE_COMMIT=${{ github.event.pull_request.base.sha }}
            HEAD_COMMIT=${{ github.event.pull_request.head.sha }}
            CHANGED=$(git diff-tree --no-commit-id --name-only -r "$BASE_COMMIT" "$HEAD_COMMIT" | grep '^packages/' | cut -d/ -f2 | sort -u | tr '\n' ' ')
            echo "packages=${CHANGED}" >> "$GITHUB_OUTPUT"
            echo "is_pr=true" >> "$GITHUB_OUTPUT"
          else
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.event.after }}"

            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
               BEFORE="HEAD^1"
               AFTER="HEAD"
            fi

            CHANGED=$(git diff-tree --no-commit-id --name-only -r "$BEFORE" "$AFTER" | grep '^packages/' | cut -d/ -f2 | sort -u | tr '\n' ' ')
            echo "packages=${CHANGED}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Shards
        id: sharding
        run: |
          cd scripts
          cat << 'PY_EOF' > sharding_script.py
          import json
          import sys
          import os
          from core.dag import DAG

          arch = "aarch64"
          dag = DAG("../packages", arch)

          changed_pkgs_str = sys.argv[1]
          is_pr = sys.argv[2] == "true" if len(sys.argv) > 2 else False

          target_packages = None
          excluded_packages = set()

          if changed_pkgs_str.strip():
              tokens = changed_pkgs_str.split()
              target_packages = []
              for token in tokens:
                  if token.startswith("!"):
                      excluded_packages.add(token[1:])
                  else:
                      target_packages.append(token)

          try:
              shards = dag.get_shards(
                  target_packages=target_packages,
                  excluded_packages=excluded_packages,
                  is_pr=is_pr,
                  num_shards=4
              )
          except Exception as e:
              print(f"Failed to generate shards: {e}", file=sys.stderr)
              sys.exit(1)


          print(json.dumps([{"shard": i, "packages": " ".join(shard)} for i, shard in enumerate(shards) if shard]))
          PY_EOF
          SHARDS_JSON=$(uv run python sharding_script.py "${{ steps.pkgs.outputs.packages }}" "${{ steps.pkgs.outputs.is_pr }}")
          echo "shards=${SHARDS_JSON}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    if: ${{ needs.prepare.outputs.shards != '[]' && needs.prepare.outputs.shards != '' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, arm, x86_64, i686, riscv64, wasm32-wasi]
        shard: ${{ fromJson(needs.prepare.outputs.shards) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Free Disk Space
        uses: ./.github/actions/free-space

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Configure sccache
        uses: mozilla-actions/sccache-action@v0.0.6
        with:
          version: 'v0.8.1'

      - name: sccache cache restore
        uses: actions/cache/restore@v4
        if: github.event_name == 'pull_request'
        with:
          path: /home/runner/.cache/sccache
          key: ${{ runner.os }}-sccache-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-sccache-${{ matrix.arch }}-

      - name: sccache cache
        uses: actions/cache@v4
        if: github.event_name != 'pull_request'
        with:
          path: /home/runner/.cache/sccache
          key: ${{ runner.os }}-sccache-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-sccache-${{ matrix.arch }}-

      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Packages
        run: |
          echo "Building packages for ${{ matrix.arch }} (Shard ${{ matrix.shard.shard }}): ${{ matrix.shard.packages }}"
          mkdir -p output ~/.ccache

          chmod 777 output

          if [ -z "${{ matrix.shard.packages }}" ] || [ "${{ matrix.shard.packages }}" = " " ]; then
            echo "No packages found in this shard. Skipping."
            # We don't exit to prevent erroring out, we just let it finish.
          else
            OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

            # Start daemon
            docker run -d --name repoexe-daemon \
              -v ${{ github.workspace }}:/home/builder/RepoExe \
              -v ~/.ccache:/home/builder/.ccache \
              -w /home/builder/RepoExe \
              -e REPO_ROOT=/home/builder/RepoExe \
              -e MAKEFLAGS="-j4" \
              -e NINJA_ARGS="-j4" \
              "ghcr.io/$OWNER/repoexe-builder:latest" sleep infinity

            # We rely on the orchestrator logic natively now, not shell scripts
            docker exec repoexe-daemon bash -c '
              # Set up fake repo for dependency resolution
              sudo mkdir -p /data/data/com.repoexe/files/usr/etc/apt/sources.list.d/
              echo "deb [trusted=yes] https://SjnExe.github.io/RepoExe/ stable main" | sudo tee /data/data/com.repoexe/files/usr/etc/apt/sources.list.d/repoexe.list > /dev/null
              sudo chown -R builder:builder /data/data/com.repoexe/files/usr/etc/apt/sources.list.d/

              cd /home/builder/RepoExe/scripts
              uv pip install --system pydantic pyyaml

              for pkg in ${{ matrix.shard.packages }} ; do
                if [ ! -d "../packages/$pkg" ]; then
                  echo "Skipping $pkg because it no longer exists."
                  continue
                fi

                echo "Building $pkg..."
                # This triggers the core orchestrator. We use dry run first to see if it is excluded.
                python build.py build ../packages/$pkg --arch ${{ matrix.arch }} || continue

                mv ../output/*.deb /home/builder/RepoExe/output/ 2>/dev/null || true
                mv ../output/*.pkg.tar.zst /home/builder/RepoExe/output/ 2>/dev/null || true
                mv ../output/*.apk /home/builder/RepoExe/output/ 2>/dev/null || true
              done
            '

            docker rm -f repoexe-daemon
          fi

      - name: Upload to GitHub Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for pkg in ${{ matrix.shard.packages }}; do
            if [ ! -d "packages/$pkg" ]; then
              continue
            fi

            # Need to get version and revision to form the title
            PKG_VER=$(uv run python -c "from scripts.core.parser import parse_build_yml; pkg=parse_build_yml('packages/$pkg/build.yml'); print(pkg.version)")
            PKG_REV=$(uv run python -c "from scripts.core.parser import parse_build_yml; pkg=parse_build_yml('packages/$pkg/build.yml'); print(pkg.revision)")

            TAG="$pkg"
            TITLE="$pkg $PKG_VER-$PKG_REV"

            NOTES="Automated build for $pkg"$'\n'"- **Commit:** ${{ github.sha }}"

            gh release create "$TAG" --title "$TITLE" --notes "$NOTES" || true

            echo "We want to keep only the latest release for a tag, and the tag itself represents the package."
            # Actually, to truly ensure we only have the latest version's assets, and since the title has the version:
            # We can check if the title of the existing release matches our TITLE. If not, we should probably delete the old release and recreate it.
            # But the requirement is: "Tag/release should always keep latest versions only, and should either delete the tag and remake it or remove the old assets and add new assets."
            # "Tag should be just package name, the release title should be the "{package name} {version}-{revision}""

            # Read existing title
            EXISTING_TITLE=$(gh release view "$TAG" --json name --jq '.name' || true)

            if [ "$EXISTING_TITLE" != "$TITLE" ]; then
              echo "Title changed. Re-creating release to prune old assets."
              gh release delete "$TAG" -y --cleanup-tag || true
              gh release create "$TAG" --title "$TITLE" --notes "$NOTES" || true
            else
              # Since the title is exactly what we want, let's just make sure it's updated.
              gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" || true

              # Prune old assets (any .deb for this arch)
              echo "Pruning old assets for $TAG (${{ matrix.arch }})..."
            OLD_ASSETS=$(gh release view "$TAG" --json assets --jq ".assets[].name | select(endswith(\"_${{ matrix.arch }}.deb\") or endswith(\"_all.deb\") or endswith(\"_${{ matrix.arch }}.pkg.tar.zst\") or endswith(\"_${{ matrix.arch }}.apk\"))" || true)

              for asset in $OLD_ASSETS; do
                gh release delete-asset "$TAG" "$asset" -y || true
              done
            fi

            echo "Uploading new assets for $TAG..."
            UPLOAD_FILES=""
            if ls output/*_${{ matrix.arch }}.deb 1> /dev/null 2>&1; then
              UPLOAD_FILES="$UPLOAD_FILES output/*_${{ matrix.arch }}.deb"
            fi

            if [ "${{ matrix.arch }}" = "aarch64" ]; then
              if ls output/*_all.deb 1> /dev/null 2>&1; then
                UPLOAD_FILES="$UPLOAD_FILES output/*_all.deb"
              fi
            fi

            # Add other extension support
            if ls output/*_${{ matrix.arch }}.pkg.tar.zst 1> /dev/null 2>&1; then
              UPLOAD_FILES="$UPLOAD_FILES output/*_${{ matrix.arch }}.pkg.tar.zst"
            fi
            if ls output/*_${{ matrix.arch }}.apk 1> /dev/null 2>&1; then
              UPLOAD_FILES="$UPLOAD_FILES output/*_${{ matrix.arch }}.apk"
            fi
            if [ "${{ matrix.arch }}" = "aarch64" ]; then
              if ls output/*_all.pkg.tar.zst 1> /dev/null 2>&1; then
                UPLOAD_FILES="$UPLOAD_FILES output/*_all.pkg.tar.zst"
              fi
              if ls output/*_all.apk 1> /dev/null 2>&1; then
                UPLOAD_FILES="$UPLOAD_FILES output/*_all.apk"
              fi
            fi

            if [ -n "$UPLOAD_FILES" ]; then
              # shellcheck disable=SC2086
              gh release upload "$TAG" $UPLOAD_FILES

              # Save necessary metadata into release notes or file to avoid downloading entire packages in publish
              # For APT, we could extract the control file data. For now, since the issue just states:
              # "Also in tag, there's patch note or release note, we can store some necessary stuffs there for above scenario to work if it's necessary, also it can be used for many other purposes."
              # Let's upload a metadata file.
              echo "{\"name\": \"$pkg\", \"version\": \"$PKG_VER\", \"revision\": \"$PKG_REV\"}" > metadata.json
              gh release upload "$TAG" metadata.json || true
            else
              echo "No package files found to upload for $pkg"
            fi
          done

  trigger_publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    if: always() && needs.prepare.outputs.publish_decision == 'true'
    steps:
      - name: Save publish decision
        run: echo "true" > publish_decision.txt
      - name: Upload decision artifact
        uses: actions/upload-artifact@v7
        with:
          name: publish_decision
          path: publish_decision.txt
