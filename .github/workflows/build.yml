name: Build

on:
  push:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'scripts/**'
  pull_request:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'scripts/**'
  workflow_dispatch:
    inputs:
      packages:
        description: 'Target packages (e.g. "all", "all !tsc", "all@all !jscpd@v1", "tsc@latest")'
        required: true
        default: 'all'
      publish_repo:
        description: 'Publish the built packages to the repository if successful'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.sharding.outputs.shards }}
      publish_decision: ${{ steps.decision.outputs.publish_decision }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set publish decision
        id: decision
        run: |
          if [ "${{ github.event_name }}" == "push" ] && [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "publish_decision=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ inputs.publish_repo }}" == "true" ]; then
            echo "publish_decision=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish_decision=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: 'scripts/uv.lock'

      - name: Determine target packages and channels
        id: pkgs
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "targets=${{ github.event.inputs.packages }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" == "pull_request" ]; then
            BASE_COMMIT=${{ github.event.pull_request.base.sha }}
            HEAD_COMMIT=${{ github.event.pull_request.head.sha }}
            CHANGED=$(git diff-tree --no-commit-id --name-only -r "$BASE_COMMIT" "$HEAD_COMMIT" | grep '^packages/' | cut -d/ -f2 | sort -u | tr '\n' ' ')
            echo "targets=${CHANGED}" >> "$GITHUB_OUTPUT"
            echo "is_pr=true" >> "$GITHUB_OUTPUT"
          else
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.event.after }}"

            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
               BEFORE="HEAD^1"
               AFTER="HEAD"
            fi

            CHANGED=$(git diff-tree --no-commit-id --name-only -r "$BEFORE" "$AFTER" | grep '^packages/' | cut -d/ -f2 | sort -u | tr '\n' ' ')
            echo "targets=${CHANGED}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate Shards
        id: sharding
        env:
          TARGET_INPUT: ${{ steps.pkgs.outputs.targets }}
        run: |
          cd scripts
          uv run python - << 'PYEOF_INNER' > shards.json
          import os, json
          from pathlib import Path
          from core.parser import parse_recipe

          pkgs_dir = Path('../packages')
          raw_input = os.environ.get('TARGET_INPUT', 'all').strip() or 'all'
          all_pkg_dirs = sorted([d.name for d in pkgs_dir.iterdir() if d.is_dir() and (d / 'build.yml').exists()])

          def get_channels(pkg_name):
              recipe_path = pkgs_dir / pkg_name / 'build.yml'
              if not recipe_path.exists():
                  return ['latest']
              try:
                  recipe = parse_recipe(recipe_path, channel='latest')
                  return list(recipe.channels.keys()) if recipe.channels else ['latest']
              except Exception:
                  return ['latest']

          incl_tokens, excl_tokens = [], []
          for token in raw_input.split():
              if token.startswith('!'):
                  excl_tokens.append(token[1:])
              else:
                  incl_tokens.append(token)

          if not incl_tokens:
              incl_tokens = ['all']

          candidates = set()
          for token in incl_tokens:
              pkg, ch = token.split('@', 1) if '@' in token else (token, 'latest')
              target_pkgs = all_pkg_dirs if pkg == 'all' else [pkg]
              for p in target_pkgs:
                  if not (pkgs_dir / p).exists():
                      continue
                  target_chs = get_channels(p) if ch == 'all' else [ch]
                  for c in target_chs:
                      candidates.add((p, c))

          excluded = set()
          for token in excl_tokens:
              pkg, ch = token.split('@', 1) if '@' in token else (token, None)
              target_pkgs = all_pkg_dirs if pkg == 'all' else [pkg]
              for (p, c) in list(candidates):
                  if p in target_pkgs:
                      if ch is None or ch == 'all' or c == ch:
                          excluded.add((p, c))

          final_targets = [f"{p}:{c}" for (p, c) in sorted(candidates - excluded)]
          shards = [[] for _ in range(4)]
          for i, target in enumerate(final_targets):
              shards[i % 4].append(target)

          print(json.dumps([{'shard': i, 'packages': ' '.join(s)} for i, s in enumerate(shards) if s]))
          PYEOF_INNER
          echo "shards=$(cat shards.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    if: needs.prepare.outputs.shards != '[]' && needs.prepare.outputs.shards != ''
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64]
        shard: ${{ fromJson(needs.prepare.outputs.shards) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: 'scripts/uv.lock'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Packages
        run: |
          echo "Building targets for ${{ matrix.arch }} (Shard ${{ matrix.shard.shard }}): ${{ matrix.shard.packages }}"
          mkdir -p output
          chmod 777 output

          if [ -n "${{ matrix.shard.packages }}" ]; then
            OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

            docker run -d --name repoexe-daemon \
              -v ${{ github.workspace }}:/home/builder/RepoExe \
              -w /home/builder/RepoExe \
              "ghcr.io/$OWNER/repoexe-builder:latest" sleep infinity

            docker exec repoexe-daemon bash -c '
              for target in ${{ matrix.shard.packages }} ; do
                pkg=$(echo "$target" | cut -d: -f1)
                ch=$(echo "$target" | cut -d: -f2)

                if [ ! -d "packages/$pkg" ]; then
                  continue
                fi

                echo "Building $pkg (Channel: $ch)..."
                uv --project scripts run python scripts/build.py build "packages/$pkg" --channel "$ch"
              done
            '

            docker rm -f repoexe-daemon
          fi

      - name: Upload to GitHub Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MATRIX_PACKAGES: ${{ matrix.shard.packages }}
        run: |
          for target in $MATRIX_PACKAGES; do
            pkg=$(echo "$target" | cut -d: -f1)
            ch=$(echo "$target" | cut -d: -f2)

            if [ ! -d "packages/$pkg" ]; then
              continue
            fi

            export PKG_NAME="$pkg"
            export CHANNEL="$ch"
            TAG="${pkg}@${ch}"

            META_JSON=$(uv --project scripts run python -c "import os, json; from pathlib import Path; from core.parser import parse_recipe; pkg = os.environ['PKG_NAME']; ch = os.environ['CHANNEL']; recipe_path = Path(f'packages/{pkg}/build.yml'); r = parse_recipe(recipe_path, channel=ch); print(json.dumps({'name': r.name, 'version': r.version, 'revision': r.revision, 'channel': r.active_channel, 'state_hash': r.state_hash}))")

            PKG_VER=$(echo "$META_JSON" | python3 -c "import sys, json; print(json.load(sys.stdin)['version'])")
            PKG_REV=$(echo "$META_JSON" | python3 -c "import sys, json; print(json.load(sys.stdin)['revision'])")
            STATE_HASH=$(echo "$META_JSON" | python3 -c "import sys, json; print(json.load(sys.stdin)['state_hash'])")

            if [ "$PKG_REV" -gt 0 ] 2>/dev/null; then
              FULL_VER="${PKG_VER}-${PKG_REV}"
            else
              FULL_VER="${PKG_VER}"
            fi

            TITLE="${pkg} v${FULL_VER} [${ch}]"
            NOTES="Automated build for ${pkg}@${ch}
- **Commit:** ${{ github.sha }}
- **State Hash:** ${STATE_HASH}"

            gh release create "$TAG" --title "$TITLE" --notes "$NOTES" || true
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" || true

            echo "$META_JSON" > metadata.json
            gh release upload "$TAG" metadata.json --clobber || true

            UPLOAD_FILES=""
            if ls output/${pkg}*.deb 1> /dev/null 2>&1; then
              UPLOAD_FILES=$(ls output/${pkg}*.deb)
            elif ls output/*.deb 1> /dev/null 2>&1; then
              UPLOAD_FILES=$(ls output/*.deb)
            fi

            if [ -n "$UPLOAD_FILES" ]; then
              echo "Uploading $UPLOAD_FILES to release $TAG..."
              gh release upload "$TAG" $UPLOAD_FILES --clobber
            fi
          done

  trigger_publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    if: always() && needs.prepare.outputs.publish_decision == 'true'
    steps:
      - name: Save publish decision
        run: echo "true" > publish_decision.txt
      - name: Upload decision artifact
        uses: actions/upload-artifact@v7
        with:
          name: publish_decision
          path: publish_decision.txt
