name: Build

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'scripts/**'
      - 'Dockerfile'
  pull_request:
    branches: [main]
    paths:
      - 'packages/**'
      - 'scripts/**'
  workflow_dispatch:
    inputs:
      packages:
        description: 'Target packages (e.g. "all", "tsc")'
        required: true
        default: 'all'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.sharding.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Generate Shards
        id: sharding
        run: |
          SHARDS_JSON=$(uv run python scripts/generate_shards.py)
          echo "shards=$SHARDS_JSON" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    if: needs.prepare.outputs.shards != '[]' && needs.prepare.outputs.shards != ''
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64]
        shard: ${{ fromJson(needs.prepare.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Packages
        run: |
          mkdir -p output
          chmod 777 output
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          docker run -d --name repoexe-daemon \
            -v ${{ github.workspace }}:/home/builder/RepoExe \
            -w /home/builder/RepoExe \
            "ghcr.io/$OWNER/repoexe-builder:latest" sleep infinity

          docker exec -u 0 repoexe-daemon bash -c '
            chmod -R 777 /home/builder/RepoExe
            for target in ${{ matrix.shard.packages }} ; do
              pkg=$(echo "$target" | cut -d: -f1)
              ch=$(echo "$target" | cut -d: -f2)
              [ -d "packages/$pkg" ] || continue
              uv run python scripts/build.py build "packages/$pkg" --channel "$ch"
            done
          '
          docker rm -f repoexe-daemon

      - name: Upload Complete Release Assets
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MATRIX_PACKAGES: ${{ matrix.shard.packages }}
        run: |
          for target in $MATRIX_PACKAGES; do
            pkg=$(echo "$target" | cut -d: -f1)
            ch=$(echo "$target" | cut -d: -f2)
            [ -d "packages/$pkg" ] || continue

            TAG="${pkg}@${ch}"
            TITLE="${pkg} [${ch}]"
            
            gh release create "$TAG" --title "$TITLE" --notes "Automated release build" || true

            # Collect ALL produced package formats (.deb, .apk, .pkg.tar.zst, .whl, .tgz)
            FILES=$(find output/ -type f \( -name "${pkg}*" -o -name "*${pkg}*" \))
            if [ -n "$FILES" ]; then
              echo "Uploading generated files for $pkg: $FILES"
              gh release upload "$TAG" $FILES --clobber
            fi
          done
