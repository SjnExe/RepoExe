name: RepoExe Orchestrator & Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  audit-and-test:
    name: Audit & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv & Dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          uv pip install --system -r pyproject.toml || true
          pip install pytest ruff pydantic pyyaml

      - name: Code Quality & Health Audit
        run: |
          python scripts/build.py check

      - name: Run Pytest
        run: |
          pytest

  build-and-deploy:
    name: Build Packages & Deploy Site
    needs: audit-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Toolchains & Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev libarchive-tools zip unzip jq
          pip install pydantic pyyaml

      - name: Build Modified Packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p output
          for pkg in pkg/*; do
            if [ -d "$pkg" ] && [ -f "$pkg/build.yml" ]; then
              python scripts/build.py build "$pkg" || echo "Notice: Build step completed or skipped for $pkg"
            fi
          done

      - name: Generate Repository Indexes & Manifests
        run: |
          python -c "
          from core.pip import generate_pip_index
          from core.npm import generate_npm_index
          generate_pip_index('site')
          generate_npm_index('site')
          "

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
