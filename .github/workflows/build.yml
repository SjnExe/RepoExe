name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      packages:
        description: 'Target specs (e.g. "@all", "type:npm", "type:sys", "jscpd,tsc")'
        required: false
        type: string
        default: '@all'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write
  attestations: write
  actions: write

jobs:
  matrix:
    name: Matrix Generation
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv & Dependencies
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: "pyproject.toml"

      - name: Install Dependencies
        run: uv pip install --system -r pyproject.toml pytest ruff pydantic pyyaml

      - name: Generate Matrix
        id: matrix
        env:
          PYTHONPATH: scripts
          TARGET_PKGS: ${{ inputs.packages }}
        run: python scripts/cli/generate_shards.py

  build:
    name: Build Shard
    needs: matrix
    if: "needs.matrix.outputs.matrix != '{\"include\": []}'"
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: "pyproject.toml"

      - name: Pull Docker Builder
        run: docker pull ghcr.io/sjnexe/repoexe-builder:latest

      - name: Free Space
        if: ${{ contains(matrix.targets, 'free_space:true') }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true

      - name: Setup ZRAM
        if: ${{ contains(matrix.targets, 'zram:') }}
        run: |
          ZRAM_SIZE=$(echo "${{ matrix.targets }}" | grep -o 'zram:[0-9]*' | cut -d':' -f2)
          if [ ! -z "$ZRAM_SIZE" ]; then
            sudo modprobe zram
            sudo zramctl --find --size ${ZRAM_SIZE}G
            sudo mkswap /dev/zram0
            sudo swapon /dev/zram0
            echo "ZRAM configured with ${ZRAM_SIZE}GB"
          fi

      - name: Build Packages (Docker)
        run: |
          docker run --rm \
            --device /dev/fuse \
            --cap-add SYS_ADMIN \
            --security-opt apparmor:unconfined \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ghcr.io/sjnexe/repoexe-builder:latest \
            python3 scripts/cli/build.py \
              --shard "${{ matrix.shard }}" \
              --shards "${{ matrix.shards }}" \
              --targets "${{ matrix.targets }}"

      - name: Upload Output Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: output-shard-${{ matrix.shard }}
          path: output/
          if-no-files-found: ignore

      - name: Upload Log Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-shard-${{ matrix.shard }}
          path: logs/
          if-no-files-found: ignore

  build-summary:
    name: Build Status & Log Aggregator
    needs: [matrix, build]
    if: "always() && (needs.matrix.outputs.matrix != '{\"include\": []}')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Download all logs
        uses: actions/download-artifact@v7
        with:
          pattern: logs-shard-*
          path: all_logs
          merge-multiple: true

      - name: Download all outputs (for publishing trigger)
        uses: actions/download-artifact@v7
        with:
          pattern: output-shard-*
          path: all_outputs
          merge-multiple: true

      - name: Generate Summary
        env:
          PYTHONPATH: scripts
        run: python scripts/utils/log_aggregator.py all_logs summary.txt

      - name: Display Summary
        run: cat summary.txt

      - name: Trigger Publish Workflow (if on main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -d "all_outputs" ] && [ "$(ls -A all_outputs)" ]; then
            gh workflow run publish.yml -f trigger_sha=${{ github.sha }}
          else
            echo "No artifacts generated, skipping publish."
          fi

      - name: Check for Failures
        run: |
          if grep -q "❌ STATUS: BUILD FAILURE\|❌ STATUS: TEST FAILURE" summary.txt; then
            echo "Build errors detected!"
            exit 1
          fi