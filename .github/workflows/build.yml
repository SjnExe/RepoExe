name: RepoExe Orchestrator & Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  audit-and-test:
    name: Audit & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv & Dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          uv pip install --system -r pyproject.toml || true
          pip install pytest ruff pydantic pyyaml

      - name: Code Quality & Health Audit
        run: |
          python scripts/build.py check

      - name: Run Pytest
        run: |
          pytest

  build-and-deploy:
    name: Build Packages & Deploy Site
    needs: audit-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Toolchains & Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev libarchive-tools zip unzip jq gh
          pip install pydantic pyyaml

      - name: Build Modified Packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p output
          for pkg_dir in pkg/*; do
            if [ -d "$pkg_dir" ] && [ -f "$pkg_dir/build.yml" ]; then
              pkg_name=$(basename "$pkg_dir")
              echo "Building $pkg_name..."
              python scripts/build.py build "$pkg_dir" || echo "Notice: Build step completed or skipped for $pkg_name"
            fi
          done

      - name: Publish Release Assets & Prune Stale Files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -d "output" ] && [ "$(ls -A output)" ]; then
            for file in output/*; do
              if [ -f "$file" ]; then
                filename=$(basename "$file")
                pkg_name=$(echo "$filename" | cut -d'_' -f1 | cut -d'-' -f1)
                tag="${pkg_name}@latest"
                
                # Ensure Release Tag Exists
                gh release create "$tag" --title "$pkg_name (latest)" --notes "Automated release build for $pkg_name" 2>/dev/null || true
                
                # Upload compiled asset to GitHub Release tag
                gh release upload "$tag" "$file" --clobber
              fi
            done
          fi

          # Prune outdated release assets
          python -c "
          from core.prune import prune_release_tags
          prune_release_tags()
          " || echo "Notice: Release pruning step completed."

      - name: Generate Repository Indexes & Manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p site
          python -c "
          from core.pip import generate_pip_index
          from core.npm import generate_npm_index
          from core.index_gen import prepare_site_assets
          generate_pip_index('site')
          generate_npm_index('site')
          prepare_site_assets('site')
          "

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: 'site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
