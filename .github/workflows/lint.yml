name: Lint and Format

on:
  pull_request:
    branches:
      - main

jobs:
  lint-and-format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: 'scripts/uv.lock'

      - name: Install Prettier
        run: npm install -g prettier

      - name: Run Ruff (Check)
        run: uvx ruff check .

      - name: Run Ruff (Format Check)
        run: uvx ruff format --check .

      - name: Run Prettier
        run: prettier --check .

      - name: Run actionlint
        run: |
          # Download and install latest actionlint directly without third-party actions
          cd /tmp
          LATEST_VERSION=$(curl -s "https://api.github.com/repos/rhysd/actionlint/releases/latest" | grep -Po '"tag_name": "\K.*?(?=")')
          wget -qO- "https://github.com/rhysd/actionlint/releases/download/${LATEST_VERSION}/actionlint_${LATEST_VERSION#v}_linux_amd64.tar.gz" | tar xz
          sudo mv actionlint /usr/local/bin/
          cd "$GITHUB_WORKSPACE"
          actionlint
