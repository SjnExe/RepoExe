name: Build & Release

on:
  push:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'scripts/mixins/**'
      - 'ndk-patches/**'
  workflow_dispatch:
    inputs:
      packages:
        description: 'Comma separated list of packages to build'
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [aarch64, arm, i686, x86_64]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Free disk space
        run: sudo ./scripts/free-space.sh || true

      - name: Setup ZRAM
        uses: ./.github/actions/zram

      - name: Determine packages to build
        id: pkgs
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "packages=${{ github.event.inputs.packages }}" >> $GITHUB_OUTPUT
          else
            CHANGED=$(git diff-tree --no-commit-id --name-only -r HEAD^1 HEAD | grep '^packages/' | cut -d/ -f2 | sort -u | tr '\n' ' ')
            echo "packages=${CHANGED}" >> $GITHUB_OUTPUT
          fi

      - name: Restore cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.ccache
            output
          key: ${{ runner.os }}-build-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-build-${{ matrix.arch }}-

      - name: Build Packages
        run: |
          echo "Building packages for ${{ matrix.arch }}: ${{ steps.pkgs.outputs.packages }}"
          mkdir -p output ~/.ccache

          if [ -z "${{ steps.pkgs.outputs.packages }}" ] || [ "${{ steps.pkgs.outputs.packages }}" = " " ]; then
            echo "No changed packages found. Skipping build loop."
            exit 0
          fi

          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          # We execute the build inside the custom container via docker run
          docker run --rm \
            -u builder \
            -v ${{ github.workspace }}:/home/builder/RepoExe \
            -v ~/.ccache:/home/builder/.ccache \
            -w /home/builder/RepoExe \
            -e REPO_ROOT=/home/builder/RepoExe \
            ghcr.io/$OWNER/repoexe-builder:latest \
            bash -c "
              # Inject live RepoExe URL for concurrent dependency resolution
              sudo mkdir -p /data/data/com.termux/files/usr/etc/apt/sources.list.d/
              echo 'deb [trusted=yes] https://SjnExe.github.io/RepoExe/ stable main' | sudo tee /data/data/com.termux/files/usr/etc/apt/sources.list.d/repoexe.list > /dev/null

              # Clone Termux build infrastructure
              echo 'Cloning termux-packages...'
              git clone --depth 1 https://github.com/termux/termux-packages.git /home/builder/termux-packages

              # Apply NDK patches
              if [ -d \"ndk-patches/29\" ]; then
                echo 'Applying NDK patches...'
                for patch in ndk-patches/29/*.patch; do
                  if [ -f \"\$patch\" ]; then
                    echo \"Applying \$patch\"
                    sudo patch -p1 -d /home/builder/lib/android-ndk/sysroot < \"\$patch\" || true
                  fi
                done
              fi

              for pkg in ${{ steps.pkgs.outputs.packages }}; do
                echo \"Building \$pkg...\"

                # Universal Packages Optimization
                if grep -q 'TERMUX_PKG_PLATFORM_INDEPENDENT=true' \"packages/\$pkg/build.sh\"; then
                  if [ \"${{ matrix.arch }}\" != \"aarch64\" ]; then
                    echo \"Skipping \$pkg on ${{ matrix.arch }} because it is architecture independent.\"
                    continue
                  fi
                fi

                cp -r packages/\$pkg /home/builder/termux-packages/packages/
                cd /home/builder/termux-packages
                ./build-package.sh -a ${{ matrix.arch }} -I \$pkg

                mv output/*.deb /home/builder/RepoExe/output/ 2>/dev/null || true
                cd /home/builder/RepoExe
              done
            "

      - name: Save cache
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.ccache
            output
          key: ${{ runner.os }}-build-${{ matrix.arch }}-${{ github.sha }}

      # Generate SLSA build provenance
      - name: Generate build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'output/*.deb'

      - name: Upload to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for pkg in ${{ steps.pkgs.outputs.packages }}; do
            TAG="pkg-$pkg"
            gh release create "$TAG" --title "Rolling Release $pkg" --notes "Automated build" || true

            # To prevent race conditions across matrix jobs, ONLY aarch64 is allowed to prune and upload _all.deb files
            # (Because universal packages are only built on the aarch64 runner)

            if [ "${{ matrix.arch }}" = "aarch64" ]; then
              echo "Pruning old assets for $TAG (${{ matrix.arch }} & all)..."
              OLD_ASSETS=$(gh release view "$TAG" --json assets --jq ".assets[].name | select(endswith(\"_${{ matrix.arch }}.deb\") or endswith(\"_all.deb\"))" || true)
            else
              echo "Pruning old assets for $TAG (${{ matrix.arch }})..."
              OLD_ASSETS=$(gh release view "$TAG" --json assets --jq ".assets[].name | select(endswith(\"_${{ matrix.arch }}.deb\"))" || true)
            fi

            for asset in $OLD_ASSETS; do
              gh release delete-asset "$TAG" "$asset" -y || true
            done

            echo "Uploading new assets for $TAG..."
            UPLOAD_FILES=""
            if ls output/*_${{ matrix.arch }}.deb 1> /dev/null 2>&1; then
              UPLOAD_FILES="$UPLOAD_FILES output/*_${{ matrix.arch }}.deb"
            fi

            if [ "${{ matrix.arch }}" = "aarch64" ]; then
              if ls output/*_all.deb 1> /dev/null 2>&1; then
                UPLOAD_FILES="$UPLOAD_FILES output/*_all.deb"
              fi
            fi

            if [ -n "$UPLOAD_FILES" ]; then
              gh release upload "$TAG" $UPLOAD_FILES
            else
              echo "No .deb files found to upload for $pkg"
            fi
          done
