name: Build Docker Image

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/Dockerfile'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Cache APT packages
        uses: actions/cache@v5
        id: cache
        with:
          path: apt-cache
          key: apt-cache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            apt-cache-${{ runner.os }}-

      - name: Cache APT lists
        uses: actions/cache@v5
        id: cache-lib
        with:
          path: apt-lib
          key: apt-lib-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            apt-lib-${{ runner.os }}-

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Inject Cache into Docker
        uses: reproducible-containers/buildkit-cache-dance@v3.3.2
        with:
          cache-map: |
            {
              "apt-cache": "/var/cache/apt",
              "apt-lib": "/var/lib/apt"
            }
          skip-extraction: ${{ steps.cache.outputs.cache-hit == 'true' && steps.cache-lib.outputs.cache-hit == 'true' }}

      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lower case owner name
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/repoexe-builder
          tags: |
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max' || '' }}
          provenance: false

  clean-ghcr:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: Set lower case owner name
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Delete untagged images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Fetching untagged versions..."
          VERSION_IDS=$(gh api -H "Accept: application/vnd.github+json" \
            "/users/${{ env.OWNER }}/packages/container/repoexe-builder/versions" \
            --jq '.[] | select(.metadata.container.tags | length == 0) | .id')

          for ID in $VERSION_IDS; do
            echo "Deleting version ID: $ID"
            gh api --method DELETE -H "Accept: application/vnd.github+json" \
              /users/${{ env.OWNER }}/packages/container/repoexe-builder/versions/$ID || true
          done
