name: Build Docker Image

on:
  push:
    branches: ['main']
    paths:
      - 'Dockerfile'
      - 'ndk-patches/**'
      - 'docker/**'
      - '.github/workflows/docker.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - 'ndk-patches/**'
      - 'docker/**'
      - '.github/workflows/docker.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build and test Docker image
        run: docker build -t ghcr.io/sjnexe/repoexe-builder:latest .
