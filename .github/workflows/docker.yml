name: Build Docker Image

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/docker/**'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

jobs:
  build-docker:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set lower case owner name
        run: echo "OWNER=$(echo "${{ github.repository_owner }}" | tr "[:upper:]" "[:lower:]")" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.OWNER }}/repoexe-builder
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./scripts/docker/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max' || '' }}
          provenance: false

      - name: Fast Docker Container Verification
        run: |
          docker run --rm "ghcr.io/${{ env.OWNER }}/repoexe-builder:latest" python3 -c "import pydantic, yaml; print('✓ Docker container healthy')"
