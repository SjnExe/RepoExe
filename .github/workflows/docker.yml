name: Build Docker Image

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

jobs:
  build-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set lower case owner name
        run: echo "OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.OWNER }}/repoexe-builder
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  clean-ghcr:
    needs: build-docker
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: Set lower case owner name
        run: echo "OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Delete untagged images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Fetching untagged versions..."
          VERSION_IDS=$(gh api -H "Accept: application/vnd.github+json"             "/users/${{ env.OWNER }}/packages/container/repoexe-builder/versions"             --jq '.[] | select(.metadata.container.tags | length == 0) | .id' 2>/dev/null || true)

          for ID in $VERSION_IDS; do
            echo "Deleting untagged version ID: $ID"
            gh api --method DELETE -H "Accept: application/vnd.github+json"               "/users/${{ env.OWNER }}/packages/container/repoexe-builder/versions/$ID" || true
          done
