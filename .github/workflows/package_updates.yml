name: Package Updates

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Run upstream_check.py
        id: check
        run: |
          uv --project scripts run python scripts/core/upstream_check.py > update_log.txt 2>&1 || true
          cat update_log.txt

          grep "Update available for" update_log.txt > updates_to_process.txt || true

          if [ -s updates_to_process.txt ]; then
            echo "updates_found=true" >> "$GITHUB_OUTPUT"
          else
            echo "updates_found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Process Updates
        if: steps.check.outputs.updates_found == 'true'
        run: |
          while read -r line; do
            if [[ "$line" =~ Update\ available\ for\ ([^@]+)@([^:]+):\ ([^\ ]+)\ -\>\ (.+) ]]; then
              PKG="${BASH_REMATCH[1]}"
              CHANNEL="${BASH_REMATCH[2]}"
              OLD="${BASH_REMATCH[3]}"
              NEW="${BASH_REMATCH[4]}"

              BRANCH_NAME="update-${PKG}-${CHANNEL}-${NEW}"

              if git ls-remote --exit-code --heads origin "$BRANCH_NAME"; then
                echo "Branch $BRANCH_NAME already exists, skipping."
                continue
              fi

              echo "Processing update for $PKG@$CHANNEL to $NEW"
              git checkout -b "$BRANCH_NAME"

              if [ "$CHANNEL" == "latest" ]; then
                sed -i "s/^version: .*/version: \"$NEW\"/" "pkg/$PKG/build.yml"
                sed -i "s/^revision: .*/revision: 0/" "pkg/$PKG/build.yml"
              else
                python3 -c "
                import yaml
                p = 'pkg/$PKG/build.yml'
                with open(p, 'r') as f:
                    d = yaml.safe_load(f)
                if 'channels' in d and '$CHANNEL' in d['channels']:
                    d['channels']['$CHANNEL']['version'] = '$NEW'
                    d['channels']['$CHANNEL']['revision'] = 0
                with open(p, 'w') as f:
                    yaml.dump(d, f, sort_keys=False)
                "
              fi

              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add "pkg/$PKG/build.yml"
              git commit -m "feat($PKG): update $CHANNEL channel to $NEW"

              git push origin "$BRANCH_NAME"
              gh pr create --title "feat($PKG@$CHANNEL): update to $NEW" --body "Automated update for channel **$CHANNEL** from $OLD to $NEW" --base main --head "$BRANCH_NAME"

              git checkout main
            fi
          done < updates_to_process.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
