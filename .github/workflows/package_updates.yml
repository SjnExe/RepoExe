name: Package Updates

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: package-updates
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  check-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile --silent

      - name: Run Upstream Version Check
        id: check
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          bun scripts/cli/upstream_check.ts --json > updates.json || echo "[]" > updates.json
          cat updates.json
          COUNT=$(jq 'length' updates.json)
          if [ "$COUNT" -gt 0 ]; then
            echo "updates_found=true" >> "$GITHUB_OUTPUT"
          else
            echo "updates_found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Process Updates
        if: steps.check.outputs.updates_found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 1. Fast Lane: batch all non-heavy updates into one PR so they share one CI run
          LIGHT_COUNT=$(jq '[.[] | select(.heavy == false)] | length' updates.json)
          if [ "$LIGHT_COUNT" -gt 0 ]; then
            BULK_BRANCH="update/bulk-$(date -u +%Y%m%d-%H%M)"
            OPEN_BULK=$(gh pr list --state open --search "in:title [auto-update] bulk" --json number --jq 'length' || echo "0")
            if [ "$OPEN_BULK" -eq 0 ] && ! git ls-remote --exit-code --heads origin "$BULK_BRANCH" >/dev/null 2>&1; then
              git checkout -b "$BULK_BRANCH" main
              UPDATED_COUNT=0
              BODY_LINES=""
              while IFS= read -r item; do
                PKG=$(echo "$item" | jq -r '.name')
                OLD=$(echo "$item" | jq -r '.oldVersion')
                NEW=$(echo "$item" | jq -r '.newVersion')
                if ! bun scripts/cli/update_recipe.ts "$PKG" "$NEW"; then
                  echo "::warning:: Skipping $PKG ($NEW) in bulk lane: update_recipe.ts failed."
                  git checkout -- "pkg/$PKG/recipe.ts" 2>/dev/null || true
                  continue
                fi
                git add "pkg/$PKG/recipe.ts"
                UPDATED_COUNT=$((UPDATED_COUNT + 1))
                BODY_LINES="${BODY_LINES}- \`${PKG}\`: \`${OLD}\` -> \`${NEW}\`\n"
              done < <(jq -c '.[] | select(.heavy == false)' updates.json)

              if [ "$UPDATED_COUNT" -gt 0 ] && ! git diff --cached --quiet; then
                git commit -m "chore(auto-update): bulk update (${UPDATED_COUNT} packages)"
                git push -q origin "$BULK_BRANCH"
                gh pr create \
                  --title "chore(auto-update): [auto-update] bulk update (${UPDATED_COUNT} packages)" \
                  --body "$(printf "Automated fast-lane package updates:\n\n%b" "$BODY_LINES")" \
                  --base main \
                  --head "$BULK_BRANCH" || true
                gh pr merge "$BULK_BRANCH" --auto --squash || true
              fi
              git checkout main
            else
              echo "An open bulk auto-update PR already exists; skipping duplicate bulk PR."
            fi
          fi

          # 2. Heavy Lane: isolate each heavy package in its own PR so it never blocks fast updates
          while IFS= read -r item; do
            PKG=$(echo "$item" | jq -r '.name')
            OLD=$(echo "$item" | jq -r '.oldVersion')
            NEW=$(echo "$item" | jq -r '.newVersion')
            BRANCH_NAME="update/heavy-${PKG}-${NEW}"

            if git ls-remote --exit-code --heads origin "$BRANCH_NAME" >/dev/null 2>&1; then
              echo "Branch $BRANCH_NAME already exists, skipping."
              continue
            fi

            git checkout -b "$BRANCH_NAME" main
            if ! bun scripts/cli/update_recipe.ts "$PKG" "$NEW"; then
              echo "::warning:: Skipping heavy update for $PKG ($NEW): update_recipe.ts failed."
              git checkout -- "pkg/$PKG/recipe.ts" 2>/dev/null || true
              git checkout main
              continue
            fi
            git add "pkg/$PKG/recipe.ts"
            if git diff --cached --quiet; then
              echo "::warning:: No changes produced for heavy package $PKG ($NEW); skipping."
              git checkout main
              continue
            fi
            git commit -m "feat($PKG): [auto-update] update to $NEW"
            git push -q origin "$BRANCH_NAME"

            gh pr create \
              --title "feat($PKG): [auto-update] update to $NEW" \
              --body "Automated heavy-lane update from \`$OLD\` to \`$NEW\`." \
              --base main \
              --head "$BRANCH_NAME" || true
            gh pr merge "$BRANCH_NAME" --auto --squash || true
            git checkout main
          done < <(jq -c '.[] | select(.heavy == true)' updates.json)
