name: Package Updates

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Run upstream_check.py
        id: check
        env:
          PYTHONPATH: scripts
        run: |
          uv run python scripts/cli/upstream_check.py > update_log.txt 2>&1 || true
          cat update_log.txt

          grep "Update available for" update_log.txt > updates_to_process.txt || true

          if [ -s updates_to_process.txt ]; then
            echo "updates_found=true" >> "$GITHUB_OUTPUT"
          else
            echo "updates_found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Process Updates
        if: steps.check.outputs.updates_found == 'true'
        run: |
          while read -r line; do
            if [[ "$line" =~ Update\ available\ for\ ([^@]+)@([^:]+):\ ([^\ ]+)\ -\>\ (.+) ]]; then
              PKG="${BASH_REMATCH[1]}"
              CHANNEL="${BASH_REMATCH[2]}"
              OLD="${BASH_REMATCH[3]}"
              NEW="${BASH_REMATCH[4]}"

              BRANCH_NAME="update/${PKG}@${CHANNEL}/${NEW}"

              if git ls-remote --exit-code --heads origin "$BRANCH_NAME"; then
                echo "Branch $BRANCH_NAME already exists, skipping."
                continue
              fi

              echo "Processing update for $PKG@$CHANNEL to $NEW"
              git checkout -b "$BRANCH_NAME"

              python3 scripts/cli/update_recipe.py "$PKG" "$CHANNEL" "$NEW"

              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add "pkg/$PKG/build.yml"
              git commit -m "feat($PKG@$CHANNEL): update to $NEW"

              git push origin "$BRANCH_NAME"
              gh pr create --title "feat($PKG@$CHANNEL): update to $NEW" --body "Automated update for channel **$CHANNEL** from $OLD to $NEW" --base main --head "$BRANCH_NAME"
              gh pr merge "$BRANCH_NAME" --auto --squash

              git checkout main
            fi
          done < updates_to_process.txt
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
