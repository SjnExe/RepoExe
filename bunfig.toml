# Bun Configuration - Optimized Multi-Core Pipeline
[install]
cache = true
minimumReleaseAge = 0
peer = true

[test]
isolate = true
parallel = true
smol = false
coverage = true
timeout = 5000
onlyFailures = true
# randomize = true

[run]
bun = true
shell = "bun"
logLevel = "warn"
telemetry = false
noOrphans = true
linker = "isolated"
